    ${n.ban<=0?`<div class="row sb" style="padding:12px 14px;border-radius:11px;background:var(--pa2)">
      <span style="font-weight:600;color:var(--mu)">Chưa nhập giá bán</span>
      <b class="num" style="font-size:15px;color:var(--mu)">Giá vốn ${F(g.von)} đ</b></div>
    <div class="note">Nhập giá báo khách vào ô trên thì máy tính ngay lời lỗ. Muốn lời 20% thì báo ${F(Math.round(g.von/0.8/1000)*1000)} đ.</div>`
    :`<div class="row sb" style="padding:12px 14px;border-radius:11px;background:${g.loi<0?"var(--bad-bg)":g.pct<15?"var(--warn-bg)":"var(--ok-bg)"}">
      <span style="font-weight:600;color:${g.loi<0?"var(--bad)":g.pct<15?"var(--warn)":"var(--ok)"}">
        ${g.loi<0?"Đơn này LỖ":g.loi===0?"Đúng bằng giá vốn":g.pct<15?"Lời mỏng":"Lời tốt"}</span>
      <b class="num" style="font-size:19px;color:${g.loi<0?"var(--bad)":g.pct<15?"var(--warn)":"var(--ok)"}">${F(g.loi)} đ · ${F2(g.pct,1)}%</b></div>
    ${g.pct<15?`<div class="note">Xưởng đặt ngưỡng 15%. Dưới mức này nên xem lại giá bán hoặc lùi kích thước.</div>`:""}`}
    <button class="b sp ${K?"":"off"}" style="margin-top:14px" data-gui="1">${
      K?`Gửi báo giá cho ${esc(K)}`:"Chọn khách trước khi gửi"}</button>
    <div class="note">Báo giá gửi đi có ghi rõ định mức vật tư và hạn hiệu lực 7 ngày.</div>
  </div>`}
  ${S.bg.length?`<div class="h2">Báo giá đã gửi</div>
    ${S.bg.map(q=>{const st=q.tt==="ok"?["ok","Khách đồng ý"]:q.tt==="huy"?["","Hết hạn"]:["wa",`Chờ trả lời · còn ${q.con} ngày`];
      return `<button class="li" data-bgx="${esc(q.id)}">
      <span class="av ${st[0]}">${q.tt==="ok"?"✓":q.tt==="huy"?"—":"?"}</span>
      <span class="bd"><span class="t1">${esc(q.kh)} · ${esc(q.hang)}</span>
        <span class="t2">${esc(q.id)} · gửi ${esc(q.ngay)} · ${esc(st[1])}</span></span>
      <span class="rt"><b class="num sm">${Ftr(q.ban)}</b></span><span class="chev">›</span></button>`;}).join("")}
    <div class="note">Báo giá quá 7 ngày tự hết hạn. Giá thép đổi thì phải báo lại.</div>`:""}`;
}

/* ===================== ĐƠN HÀNG ===================== */
function vDon(){
  if (S.xem&&S.xem.k==="don"){
    const o=timDon(S.xem.id); if(!o) {S.xem=null; return vDon();}
    const t=tang(qh(o)), nAnh=CD.filter((_,i)=>anhBuoc(o,i)).length;
    return `<button class="bk" data-bk="1">‹ Đơn hàng</button>
    <div class="h1">${esc(o.hang)}</div><div class="sub">${esc(o.id)} · ${esc(o.kh)}${o.cd<5&&o.han!==null&&o.han>0?` · còn ${o.han} ngày là tới hẹn`:""}</div>
    <div class="c"><div class="lbl">ĐANG LÀM TỚI ĐÂU</div>
      ${CD.map((c,i)=>{const a=anhBuoc(o,i);return `<div class="row" style="align-items:center;gap:11px;padding:9px 0;border-bottom:${i<CD.length-1?"1px solid var(--line)":"0"}">
        <span style="flex:0 0 24px;height:24px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;
          background:${(i<o.cd||o.cd>=5)?"var(--ok)":i===o.cd?"var(--spark-ink)":"var(--soft)"};
          color:${i<=o.cd?"#fff":"var(--ink-3)"}">${(i<o.cd||o.cd>=5)?"✓":i+1}</span>
        <span style="flex:1;font-weight:${i===o.cd?600:400};color:${i<o.cd?"var(--ink-3)":"var(--ink)"}">${esc(c)}
          ${a?`<span class="xs muted" style="display:block">Thợ chụp lúc ${esc(a[1])}</span>`:""}</span>
        ${a?`<button class="thumb" data-anh="${esc(o.id)}|${esc(a[0])}|${esc(a[1])}" aria-label="Xem ảnh bước ${esc(c)}">
           <img src="${anhURL(o.id,a[0],a[1],1)}" alt=""></button>`
          : (i===o.cd&&o.cd<5)?'<span class="p wa">Đang làm</span>':""}</div>`;}).join("")}
      ${nAnh?`<div class="xs muted" style="margin-top:9px">${nAnh} ảnh thợ chụp. Bấm vào ảnh để xem to và tải về.</div>`:""}
    </div>
    <div class="c">
      <div class="dl"><span>Giá bán</span><b>${F(o.ban)} đ</b></div>
      ${(S.vai==="chu"||S.vai==="so")?`<div class="dl"><span>Giá vốn</span><b>${F(o.von)} đ</b></div>
      <div class="dl"><span>Lời</span><b style="color:${(o.ban-o.von)/o.ban<0.15?"var(--bad)":"var(--ok)"}">${F(o.ban-o.von)} đ · ${Math.round((o.ban-o.von)/o.ban*100)}%</b></div>`:""}
      ${(S.vai==="chu"||S.vai==="so")&&chiDon(o.id)>0?(()=>{
        const vt=vonVatTu(o), ch=chiDon(o.id), vuot=ch-vt;
        return `<div class="dl"><span>Đã chi thật, ghi ở sổ chi phí</span><b>${F(ch)} đ</b></div>
      ${vt>0?`<div class="dl"><span>Dự toán vật tư trong giá vốn</span><b>${F(vt)} đ</b></div>
      <div class="dl"><span>${vuot>0?"Mua vượt dự toán":"Mua dưới dự toán"}</span><b style="color:${vuot>0?"var(--bad)":"var(--ok)"}">${vuot>0?"+ ":"− "}${F(Math.abs(vuot))} đ</b></div>`
      :`<div class="note" style="margin:7px 0 0">Đơn này chưa ghi loại vật tư và số cây, nên máy không tính được dự toán vật tư để so.</div>`}`;
      })():""}
      <div class="dl"><span>Khách đã trả</span><b>${F(o.thu)} đ</b></div>
      <div class="tot"><span>Còn nợ</span><b style="color:${no(o)>0?"var(--bad)":"var(--ok)"}">${F(no(o))} đ</b></div>
    </div>
    ${o.cd===5&&!o.ct?`<div class="c" style="background:var(--spark-bg)">
      <b style="color:var(--spark-ink)">Đơn xong rồi nhưng chưa có giấy tờ</b>
      <div class="sm" style="margin-top:6px">Chưa có biên bản thì khách khất nợ là xưởng chịu. Bấm một nút, máy làm đủ ba loại giấy và gửi thẳng vào Zalo khách.</div>
      <button class="b sp" style="margin-top:12px" data-nt="${esc(o.id)}">Nghiệm thu và gửi hồ sơ</button></div>`:""}
    ${o.ct?`<div class="row sb" style="margin:18px 2px 7px"><b class="sm">Hồ sơ đã gửi khách</b><span class="p ok">Đủ 3 giấy</span></div>
      <div class="sbox">${GIAY.map(([g,ic,mo],i)=>`<button class="gt" data-giay="${esc(o.id)}|${i}">
        <span class="gi">${ic}</span><span class="st"><b>${esc(g)}</b><span>${esc(mo)}</span></span>
        <span class="chev">›</span></button>`).join("")}</div>
      <div class="note">Bấm từng giấy để xem nhanh, tải về máy hoặc gửi lại Zalo khách.</div>`:""}
    ${no(o)>0&&qh(o)>0?`<div class="c"><div class="row sb"><b>Quá hạn ${qh(o)} ngày</b><span class="p ${t.c}">${esc(t.t)}</span></div>
      ${duocPhep(3)?`<button class="b gh" style="margin-top:12px" data-nn="${esc(o.id)}">Nhắc khách trả tiền</button>`
      :`<div class="sm muted" style="margin-top:10px">Anh đang tắt “Nhắc việc qua tin nhắn”, nên máy không gửi gì vào Zalo khách. Anh gọi trực tiếp.</div>
        ${sdtKhach(o.kh)?`<a class="b gh" href="tel:${esc(String(sdtKhach(o.kh)).replace(/\D/g,""))}" style="display:block;text-align:center;text-decoration:none;margin-top:9px">Gọi ${esc(sdtKhach(o.kh))}</a>`:""}
        <button class="b gh" style="margin-top:9px" data-cm="rieng">Bật lại công tắc</button>`}</div>`:""}`;
  }

  const dl=dangLam().sort((a,b)=>(a.han??99)-(b.han??99)), xg=S.don.filter(o=>o.cd===5);
  const mo=S.moDon, hien=mo?dl:dl.slice(0,3);
  const row=(o,n)=>`<button class="li" data-od="${esc(o.id)}">
    <span class="av ${o.cd===5?(no(o)>0?"hot":"ok"):""}">${n!==undefined?n:o.cd}</span>
    <span class="bd"><span class="t1">${esc(o.hang)}</span>
      <span class="t2">${esc(o.kh)} · ${o.cd===5?"xong":esc(CD[o.cd])}${
        o.cd<5&&o.han!==null?` · còn ${o.han} ngày`:""}${no(o)>0?` · còn nợ ${Ftr(no(o))}`:""}</span></span>
    <span class="rt"><b class="num sm">${Ftr(o.ban)}</b></span><span class="chev">›</span></button>`;
  return `<div class="h1">Đơn hàng</div><div class="sub">${dl.length} đang làm · ${xg.length} đã xong</div>
    <div class="h2">Đang làm trong xưởng</div>
    ${hien.map(o=>row(o)).join("")||'<div class="empty">Không có đơn nào đang chạy.</div>'}
    ${dl.length>3?`<button class="b gh" data-mod="1" style="margin-bottom:4px">${
      mo?"Thu gọn":`Xem thêm ${dl.length-3} đơn`}</button>`:""}
    <div class="h2">Đã xong</div>${xg.map((o,i)=>row(o,i+1)).join("")}`;
}

/* ===================== THU TIỀN ===================== */
function theROI(){
  const r=ROI_NHAC;
  if(!r || !r.soLanNhac) return "";
  return `<button class="c" data-roi="1" style="display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:11px">
    <div class="row sb"><span class="sm">Nhắc nợ đã đòi về được</span>
      <b class="num sm" style="color:var(--ok)">${F(r.tienSauNhac||0)} đ</b></div>
    <div class="xs muted" style="margin-top:3px">${r.soLanNhac} lần nhắc · ${Math.round((r.tyLeNhacCoTra||0))}% có tiền về · trung bình ${F(r.tienMoiLanNhac||0)} đ mỗi lần</div></button>`;
}
function vThu(){
  if (S.xem&&S.xem.k==="no"){
    const o=S.don.find(x=>x.id===S.xem.id); if(!o){S.xem=null; return vThu();}
    const d=qh(o), t=tang(d);
    return `<button class="bk" data-bk="1">‹ Thu tiền</button>
    <div class="h1">${esc(o.kh)}</div><div class="sub">${esc(o.hang)} · ${esc(o.id)}</div>
    <div class="c dark"><div class="lbl">CÒN NỢ</div><div class="big" style="margin-top:4px">${F(no(o))} đ</div>
      <div class="sm" style="color:#AEB9C6;margin-top:8px">Đơn ${F(o.ban)} đ · đã trả ${F(o.thu)} đ${d>0?` · quá hạn ${d} ngày`:""}</div></div>
    ${!o.ct?`<div class="c" style="background:var(--bad-bg)">
      <b style="color:var(--bad)">Chưa có giấy tờ để đòi</b>
      <div class="sm" style="margin-top:6px">Nợ đòi không được phần lớn là vì thiếu giấy, không phải vì khách xấu. Làm hồ sơ trước đã.</div>
      <button class="b sp" style="margin-top:12px" data-nt="${esc(o.id)}">Nghiệm thu và gửi hồ sơ</button></div>`:""}
    <div class="c"><div class="row sb" style="margin-bottom:10px"><b>Nhắc khách</b><span class="p ${t.c}">${esc(t.t)}</span></div>
      ${duocPhep(3)?`<div class="sm muted" style="margin-bottom:12px">Quá hạn ${d} ngày thì nên ${d<=7?"nhắc nhẹ cho đỡ ngại":d<=15?"gửi kèm bản đối chiếu công nợ":"gọi điện và gửi lại đủ giấy tờ"}.</div>
      <button class="b" data-nn="${esc(o.id)}">Gửi lời nhắc qua Zalo</button>`
      :`<div class="sm muted" style="margin-bottom:12px">Quá hạn ${d} ngày. Anh đang tắt “Nhắc việc qua tin nhắn”, nên máy không soạn tin giúp anh. Gọi thì nói: ${d<=7?"nhắc nhẹ cho đỡ ngại":d<=15?"xin đối chiếu lại công nợ":"hẹn ngày trả và gửi lại đủ giấy tờ"}.</div>
        ${sdtKhach(o.kh)?`<a class="b" href="tel:${esc(String(sdtKhach(o.kh)).replace(/\D/g,""))}" style="display:block;text-align:center;text-decoration:none">Gọi ${esc(sdtKhach(o.kh))}</a>`:""}
        <button class="b gh" style="margin-top:9px" data-cm="rieng">Bật lại công tắc</button>`}</div>
    <div class="c"><b>Khách vừa trả bao nhiêu</b>
      <div class="sm muted" style="margin-top:6px">Trả một phần thì ghi đúng số đã nhận. Máy tự trừ vào phần còn nợ.</div>
      <div class="f" style="margin-top:12px"><label>Số tiền khách vừa trả (đ)</label>
        <input id="itra" type="number" inputmode="numeric" placeholder="0" value=""></div>
      <div class="row" style="gap:8px;margin-top:9px;flex-wrap:wrap">
        ${[0.3,0.5].map(p=>`<button class="b gh sm" style="flex:1;min-width:120px" data-tranh="${Math.round(no(o)*p/1000)*1000}">${p*100}% · ${F(Math.round(no(o)*p/1000)*1000)} đ</button>`).join("")}
      </div>
      <button class="b sp" style="margin-top:11px;width:100%" data-traso="${esc(o.id)}">Ghi nhận đã trả</button>
      <button class="b gh" style="margin-top:9px;width:100%" data-dt="${esc(o.id)}">Khách trả đủ ${F(no(o))} đ</button></div>`;
  }
  if (S.xem&&S.xem.k==="khno"){
    const g=noKhach().find(x=>x.ten===S.xem.id); if(!g){S.xem=null; return vThu();}
    const k=S.kh.find(x=>x.ten===g.ten);
    return `<button class="bk" data-bk="1">‹ Thu tiền</button>
    <div class="h1">${esc(g.ten)}</div>
    <div class="sub">${g.ds.length} đơn còn nợ${g.ngay>0?` · lâu nhất ${g.ngay} ngày`:" · chưa đến hạn"}</div>
    <div class="c dark"><div class="lbl">KHÁCH NÀY CÒN NỢ</div>
      <div class="big" style="margin-top:4px">${F(g.tien)} đ</div>
      ${g.ngay>0?`<div class="row sb" style="margin-top:12px;padding-top:12px;border-top:1px solid #3D4859">
        <span class="sm" style="color:#AEB9C6">Bậc nhắc lúc này</span>
        <b class="sm" style="color:#FF8A6B">${esc(tang(g.ngay).t)}</b></div>`:""}</div>
    ${k?`<button class="b gh" data-goi="${esc(k.sdt)}">Gọi ${esc(k.sdt)}</button>
      <button class="b gh" data-kh="${esc(g.ten)}" style="margin-top:9px">Mở hồ sơ khách</button>`:""}
    <div class="h2">Từng đơn</div>
    ${g.ds.map(o=>{const d=qh(o);return `<button class="li" data-nod="${esc(o.id)}">
      <span class="av ${d>30?"hot":d>0?"":"ok"}">${d>0?"!":"·"}</span>
      <span class="bd"><span class="t1">${esc(o.hang)}</span>
        <span class="t2">${esc(o.id)} · ${d>0?`quá hạn ${d} ngày`:"chưa đến hạn"}${!o.ct&&o.cd===5?" · thiếu giấy tờ":""}</span></span>
      <span class="rt"><b class="num" style="font-size:15px;color:${d>0?"var(--bad)":"var(--ink)"}">${Ftr(no(o))}</b></span>
      <span class="chev">›</span></button>`;}).join("")}`;
  }
  const gs=noKhach();
  const ds=noDon();
  const tong=ds.reduce((s,o)=>s+no(o),0), quaHan=ds.filter(o=>qh(o)>0).reduce((s,o)=>s+no(o),0);
  const nQH=gs.filter(g=>g.ngay>0).length;
  return `${theROI()}<div class="h1">Thu tiền</div>
  <div class="sub">${gs.length} khách còn nợ · ${ds.length} đơn${nQH?` · ${nQH} khách đã quá hạn`:""}</div>
  <div class="g2"><div class="c"><div class="lbl">KHÁCH ĐANG GIỮ TIỀN</div><div class="mid" style="margin-top:5px">${Ftr(tong)}</div>
      <div class="xs muted" style="margin-top:3px">đơn đã giao, chưa trả</div></div>
    <div class="c" style="background:var(--bad-bg)"><div class="lbl">ĐÃ QUÁ HẠN</div>
      <div class="mid" style="margin-top:5px;color:var(--bad)">${Ftr(quaHan)}</div></div></div>
  ${(()=>{ const dl=noDonLam(), t=dl.reduce((a,o)=>a+no(o),0);
    return t>0?`<div class="c flat" style="margin-top:11px">
      <div class="row sb"><span class="sm">Đơn còn trong xưởng, chưa tới lúc đòi</span>
        <b class="num sm">${Ftr(t)}</b></div>
      <div class="xs muted" style="margin-top:3px">${dl.length} đơn · không tính vào số trên, vì chưa giao thì chưa đòi được</div></div>`:""; })()}
  <div class="h2">Ai nợ lâu nhất xếp trước</div>
  ${gs.map(g=>{const t=tang(g.ngay);
    return `<button class="li" data-knod="${esc(g.ten)}">
      <span class="av ${g.ngay>30?"hot":g.ngay>0?"":"ok"}">${esc(chuCai(g.ten))}</span>
      <span class="bd"><span class="t1">${esc(g.ten)}${g.ds.length>1?` <span class="p" style="margin-left:4px">${g.ds.length} đơn</span>`:""}</span>
        <span class="t2">${g.ngay>0?`quá hạn ${g.ngay} ngày · ${t.t}`:"chưa đến hạn"}${g.thieu?" · thiếu giấy tờ":""}</span></span>
      <span class="rt"><b class="num" style="font-size:15px;color:${g.ngay>0?"var(--bad)":"var(--ink)"}">${Ftr(g.tien)}</b></span>
      <span class="chev">›</span></button>`;}).join("")}
  <div class="note">Một khách nợ nhiều đơn thì gộp làm một dòng, đúng như mục Khách hàng.</div>`;
}

/* ===================== CHI PHÍ (người giữ sổ) ===================== */
function vChi(){
  /* Nhãn cũ là "ĐÃ CHI THÁNG NÀY" nhưng phép tính là tổng MỌI khoản chi từ đầu:
     napVaoS nạp S.chi từ duyet('chi') không khoảng, không giới hạn. Dữ liệu mẫu
     có cả ba khoản trong cùng một tháng nên nó trông đúng; sau một năm thì không.
     Giờ lọc thật theo tháng đang xem, và vẫn hiện tổng từ đầu bên dưới để không
     mất thông tin. */
  const nay=new Date(), thang=nay.getMonth(), nam=nay.getFullYear();
  const trongThang=(S.chi||[]).filter(c=>{
    const t=mocChi(c); if(!t) return false;
    const d=new Date(t); return d.getMonth()===thang && d.getFullYear()===nam;
  });
  const tong=trongThang.reduce((s,c)=>s+c.tien,0);
  const tongHet=(S.chi||[]).reduce((s,c)=>s+c.tien,0);
  return `<div class="h1">Chi phí vật tư</div><div class="sub">Ghi lại để biết đơn nào mua vượt dự toán</div>
  <div class="c dark"><div class="lbl">ĐÃ CHI THÁNG NÀY</div><div class="big" style="margin-top:4px">${F(tong)} đ</div>
    <div class="xs" style="margin-top:4px;opacity:.75">${trongThang.length} khoản trong tháng ${thang+1}${tongHet>tong?` · cả sổ ${F(tongHet)} đ`:""}</div></div>
  <div class="c"><div class="lbl" style="margin-bottom:10px">GHI MỘT KHOẢN MỚI</div>
    <div class="f"><label>Mua gì</label><input id="cmo" placeholder="Ví dụ: Thép hộp 40×80 — 20 cây"></div>
    <div class="g2"><div class="f"><label>Hết bao nhiêu (đ)</label><input id="ctien" type="number" placeholder="0"></div>
      <div class="f"><label>Cho đơn nào</label><select id="cdon">
        <option value="">Chưa rõ</option>${S.don.map(o=>`<option value="${o.id}">${o.id} — ${esc(o.kh)}</option>`).join("")}</select></div></div>
    <button class="b" data-gc="1">Ghi vào sổ</button></div>
  ${(()=>{
    const ds=[...new Set((S.chi||[]).map(c=>c.don).filter(Boolean))]
      .map(id=>timDon(id)).filter(Boolean)

const AU={b:"chao",sdt:"",ma:"",pin1:"",pin:"",pinN:"",lan:3,dem:45,loi:"",cho:false,at:false,
          tho:false,mo:false,dongy:false,quyen:[true,false,false,false,false],moi:"",pinB:"",hen:null,sai:0,khoaToi:0};
const TN={co:0,tp:false,cd:false};
let SHEET=false,BANG=false,TM=null;
let PL=false;   /* đang mở văn bản pháp lý từ màn đăng ký (chưa vào app, chưa có Cài đặt) */

const QUYEN=[
 ["Đọc tin nhắn khách gửi","Để dựng sẵn báo giá. Tắt thì anh nhập tay.",1],
 ["Lưu ảnh bản vẽ khách gửi","Để xem lại lúc làm. Mốc giữ ảnh do anh chọn ở mục Ảnh bản vẽ.",0],
 ["Gửi phần mô tả vật tư ra dịch vụ AI nước ngoài","Chưa bật trong bản này. Khi bật, tên khách và số điện thoại sẽ được xoá trước khi gửi.",0],
 ["Nhắc việc qua tin nhắn","Nhắc đơn sắp tới hạn và khách nợ lâu.",0],

/* ===================== CỔNG QUYỀN ===================== */
/* Một chỗ duy nhất trả lời "được phép chưa". Mọi đường đi qua đây.
   0 đọc tin khách · 1 lưu ảnh bản vẽ · 2 gửi ra AI nước ngoài
   3 nhắc việc qua tin nhắn · 4 dùng dữ liệu để cải thiện sản phẩm

   Hai cờ dưới KHÔNG phải tuỳ chọn của chủ xưởng — chúng là lời thú thật của bản
   dựng này. Bật công tắc 3 mà chưa có hồ sơ chuyển dữ liệu xuyên biên giới
   (Luật 91/2025 Điều 20) thì vẫn không được gửi. Bật công tắc 5 mà chưa có máy
   chủ thì không có chỗ nào nhận. Chỉ đổi sang true khi điều kiện thật đã xong. */
const CO_DICH_VU_AI = false;
const CO_MAY_CHU    = false;

function duocPhep(i){
  if(!AU.dongy) return false;                  /* chưa tick đồng ý thì không có quyền nào */
  if(!AU.quyen || AU.quyen[i]!==true) return false;
  if(i===2 && !CO_DICH_VU_AI) return false;
  if(i===4 && !CO_MAY_CHU)    return false;
  return true;
}
const QUYEN_TAT = i => `Anh đang tắt “${QUYEN[i][0]}”. Bật lại ở Cài đặt › Quyền riêng tư.`;

/* ===================== NHẬT KÝ ĐỒNG Ý ===================== */
/* Luật 91/2025 Điều 10 khoản 2: việc rút lại đồng ý phải kiểm chứng được.
   Công tắc bật tắt được rồi, nhưng không ghi mốc thời gian thì xưởng không có
   gì chứng minh "tôi đã tắt từ ngày đó" — mà đúng lúc bị hỏi mới cần.

   Ghi vào bảng nk của CSDL. Chọn nk vì nó KHÔNG nằm trong BANG_DU_LIEU, nên
   mọi đường ghi đè, nhập tệp và dọn dữ liệu đều không chạm tới. Bản ghi đồng ý
   là BẰNG CHỨNG chứ không phải dữ liệu nghiệp vụ, nên nó cũng không hết hạn
   theo mốc giữ ảnh hay mốc giữ đơn.

   Giữ thêm một bản trong bộ nhớ vì ve() chạy đồng bộ, không await được.
   Không ghi số điện thoại vào nhật ký: vai và mã máy là đủ để đối chiếu. */
let NKQ = [];                     /* mới nhất nằm cuối */
const NKQ_TRAN = 500;             /* năm công tắc, một xưởng không bấm tới mức này */
const NKQ_TONG = -1;              /* khoá cho ô tick đồng ý tổng */

function nkqTen(i){ return i===NKQ_TONG ? "Đồng ý điều khoản" : (QUYEN[i] && QUYEN[i][0]) || ("Mục "+i); }

function nkqGio(ms){
  const d=new Date(ms), h=n=>String(n).padStart(2,"0");
  return `${h(d.getHours())}:${h(d.getMinutes())} · ${h(d.getDate())}/${h(d.getMonth()+1)}/${d.getFullYear()}`;
}

/* Trả về bản ghi vừa tạo. Không bao giờ ném lỗi ra ngoài: một công tắc quyền
   không được chết chỉ vì CSDL đang hỏng. */
function ghiNKQ(i, bat){
  const d={ luc:Date.now(), i:i, bat:!!bat, vai:(S&&S.vai)||"chu" };
  NKQ.push(d);
  if(NKQ.length>NKQ_TRAN) NKQ=NKQ.slice(-NKQ_TRAN);
  if(DB){
    try{
      const p=DB.datVao("nk",{ luc:d.luc, may:DB.may||"", bang:"quyen", khoa:String(i),
                               viec:d.bat?"bat":"tat", truoc:!d.bat, sau:d.bat,
                               nd:d.vai+" · "+nkqTen(i) }, {nk:false});
      if(p && p.catch) p.catch(()=>{});
    }catch(e){}
  }
  return d;
}

/* Đọc lại lúc mở app. Quét đúng khoảng bang='quyen' trên chỉ mục bang_khoa nên
   dù nk có vài nghìn dòng vẫn chỉ đọc đúng mấy dòng quyền. */
async function napNKQ(){
  if(!DB) return 0;
  try{
    const ds=await DB.duyet("nk",{ chiMuc:"bang_khoa",
      bang:[["quyen",""],["quyen","￿"]], gioiHan:NKQ_TRAN });
    NKQ=(ds||[]).map(o=>({ luc:+o.luc||0, i:parseInt(o.khoa,10),
                           bat:o.sau===true||o.viec==="bat", vai:(o.nd||"").split(" · ")[0]||"chu" }))
               .filter(o=>!isNaN(o.i))
               .sort((a,b)=>a.luc-b.luc);
    if(NKQ.length>NKQ_TRAN) NKQ=NKQ.slice(-NKQ_TRAN);
  }catch(e){ NKQ=[]; }
  return NKQ.length;
}

/* ===================== CỔNG THÔNG BÁO ===================== */
/* Khoá là chữ ở trường x.i trong dsTB(). Thứ tự TBAO_LOAI KHÔNG trùng thứ tự
   dsTB() đẩy vào, nên phải tra bằng tên chứ đừng tra bằng vị trí. */
const TB_IDX = {tin:0, tien:1, xong:2, han:3, no:4};
function baoDuoc(loai){
  const i = TB_IDX[loai];
  if(i===undefined) return true;   /* loại lạ thì vẫn hiện — đừng im lặng làm mất thông báo */
  if(!S.tbao) return true;
  return S.tbao[i]!==false;
}

/* ===================== NĂM ĐƯỜNG DUY NHẤT QUA CỔNG =====================
   Mỗi quyền có đúng một hàm làm cửa. Thêm đường mới thì đi qua đây, đừng mọc
   đường riêng — chỗ nào gọi thẳng vào bộ máy bên dưới là chỗ đó lọt cổng. */

/* --- Quyền 1: ảnh bản vẽ KHÁCH GỬI. Khác ảnh thợ chụp báo xong bước: ảnh thợ là
   ảnh sản phẩm của xưởng, đi qua luuAnhThat() và không thuộc quyền này. --- */
async function luuAnhKhach(moiId, tep){
  if(!duocPhep(1)) return null;
  const r=await hacCoAnh(tep);
  const id="moi|"+String(moiId);
  if(DB){
    await DB.datVao("anh",{ id, donId:"", moiId:String(moiId), buoc:-1, kieu:"image/jpeg",
      byte:r.blob.size, rong:r.w, cao:r.h, du:r.blob, luc:Date.now(), hetHan:hanGiuAnh() });
  }
  try{
    if(ANH_THAT[id]) URL.revokeObjectURL(ANH_THAT[id]);
    ANH_THAT[id]=URL.createObjectURL(r.blob);
  }catch(e){}
  return {byte:r.blob.size, w:r.w, h:r.h};
}
function anhKhachURL(moiId){ return ANH_THAT["moi|"+String(moiId)]||""; }

/* --- Quyền 2: đường duy nhất ra ngoài lãnh thổ. --- */
/* Xoá dấu nhận dạng trước khi bất cứ thứ gì rời khỏi máy. Công tắc 3 hứa với chủ
   xưởng rằng "tên khách và số điện thoại sẽ được xoá trước khi gửi" — chỗ thực
   hiện lời hứa đó là đây, không phải ở chỗ gọi. */
function boNhanDang(t){
  let s = String(t||"");
  (S.kh||[]).forEach(k=>{ if(k.ten) s = s.split(k.ten).join("[khách]"); });
  s = s.replace(/(?:\+?84|0)\d[\d\s.\-]{7,}\d/g, "[số điện thoại]");
  return s;
}
/* CO_DICH_VU_AI chỉ được đổi sang true SAU KHI hồ sơ đánh giá tác động chuyển dữ
   liệu cá nhân xuyên biên giới đã gửi cơ quan chuyên trách — Luật 91/2025 Điều 20
   khoản 2, trong 60 ngày kể từ lần chuyển đầu tiên. Chưa có hồ sơ thì bật công tắc
   cũng không gửi, vì duocPhep(2) tự trả false. */
function guiRaAI(moTa){
  if(!duocPhep(2)) return null;
  return { sach: boNhanDang(moTa) };   /* chỗ nối: đổi thành lời gọi thật khi có dịch vụ */
}

/* --- Quyền 3: nhắc tự động. Bản này không gọi (chưa có việc chạy nền); cổng dựng
   sẵn để khi có máy chủ, đường nhắc tự động không mọc ra ngoài công tắc. --- */
function nhacTuDong(){
  if(!duocPhep(3)) return 0;
  let n=0;
  noKhach().filter(g=>g.ngay>0).forEach(g=>{
    const o=g.ds[0]; if(!o) return;
    if(guiTin(g.ten,{ai:"xu",nhac:true,
      t:`Dạ anh ơi, đơn ${o.id} còn ${F(no(o))} đ, quá hạn ${g.ngay} ngày. Anh xem giúp em.`})) n++;
  });
  return n;
}

/* --- Quyền 4: số liệu cải thiện sản phẩm. ---
   Đường ra duy nhất là module nhịp tim (mayChu/nhip.js, nhúng ở cuối file này).
   Nói rõ cách nó chạy, vì nó KHÔNG phải loại đếm theo từng sự kiện: module tự
   dựng gói từ S và AU trong gom() rồi lọc qua danh sách trắng CHO_PHEP của chính
   nó, và tự kiểm AU.quyen[IronNhip.QUYEN_SO] trước khi gửi. Nghĩa là app không
   có chỗ nào "đẩy số liệu đi" — nên hàm dưới đây là cổng TRẢ LỜI, không phải
   cổng CHUYỂN. Đừng viết một đường đẩy riêng: chỗ đó sẽ lọt cổng. */
function truongDuocGui(truong){
  /* Danh sách trắng thật của module, không phải bản chép lại — chép lại là để
     hai bản lệch nhau rồi tin vào bản sai. */
  try{ return !!(window.IronNhip && IronNhip.CHO_PHEP && IronNhip.CHO_PHEP[truong]); }
  catch(e){ return false; }
}
function goiSoLieu(truong){
  if(!duocPhep(4)) return false;          /* gồm cả CO_MAY_CHU: chưa có nơi nhận thì không gửi */
  if(truong===undefined) return true;     /* hỏi suông: "bây giờ có được gửi không" */

 const so=document.getElementById("iSo");
 if(so)so.oninput=()=>{AU.sdt=so.value.replace(/\D/g,"").replace(/^0/,"").slice(0,9);AU.loi="";
   /* Đếm theo SỐ CHỮ SỐ đứng trước con trỏ, không theo vị trí ký tự:
      dấu cách do fmtSo chèn vào làm lệch vị trí, nên gõ từng chữ số thì số bị đảo. */
   const nSo = so.value.slice(0, so.selectionStart).replace(/\D/g,"").length;
   so.value = fmtSo(AU.sdt);
   let v = 0, d = 0;
   while(v < so.value.length && d < nSo){ if(/\d/.test(so.value[v])) d++; v++; }
   while(v < so.value.length && so.value[v] === " ") v++;
   try{ so.setSelectionRange(v, v); }catch(_){}};
 on("[data-gui]",()=>{
   /* Chan khi mat mang CHI co nghia khi that su co may chu de gui ma toi.
      Ban nay CO_MAY_CHU = false va ma OTP duoc so NGAY TAI MAY o duoi
      (AU.ma === "123456") — khong mot loi goi mang nao phia sau. Nen chan o
      day khong bao ve duoc gi, ma no CHAN DUNG duong vao app khi tat mang.
      Dieu do pha chinh cai manh nhat cua san pham: mot tep chay offline hoan
      toan. Mo che do may bay roi khong dang nhap duoc thi loi hua do thanh
      loi noi suong. Khi nao co may chu that thi dieu kien nay tu song lai. */
   if(CO_MAY_CHU && !navigator.onLine){AU.loi="mang";return veA();}
   if(!/^[35789]\d{8}$/.test(AU.sdt)){AU.loi="so";return veA();}

 const ma=document.getElementById("iMa");

     if(AU.ma==="123456"){AU.loi="";AU.b="pin1";clearInterval(TM);}
     else{AU.loi="ma";AU.lan=Math.max(0,AU.lan-1);
          setTimeout(()=>{if(AU.loi==="ma"){AU.ma="";AU.loi="";veA();}},1400);}
     veA();},900);});

 on("[data-k]",e=>{const k=e.dataset.k;
   const f=AU.b==="pin1"?"pin1":"pinN";
   if(k==="x"){AU[f]=AU[f].slice(0,-1);AU.loi="";AU.hen=null;return veA();}
   if(AU[f].length>=4)return;
   AU[f]+=k;AU.loi="";veA();
   if(AU[f].length===4){ const moc=AU.hen={}; setTimeout(()=>{
     if(AU.hen!==moc||AU[f].length!==4) return;
     if(AU.b==="pin1"){AU.pinN="";AU.b="pin2";}

     else if(AU.b==="mo"){
   if(AU.khoaToi&&Date.now()<AU.khoaToi){
     AU.loi=`Sai nhiều lần. Đợi ${Math.ceil((AU.khoaToi-Date.now())/1000)} giây rồi thử lại.`;
     AU.pinN=""; return veA(); }

const KHOA="ironspace.v8";
function bam(t){ let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))>>>0; return "h"+h.toString(36); }
let DB=null, HET_CHO=false;
/* ===== MỘT LỆNH GHI THẤT BẠI PHẢI ĐƯỢC NÓI RA =====
   db.js báo đúng mọi lần ghi thất bại: nó trả {khongGhiDuoc:true} và đặt
   db.loiGhiCuoi. App thì ném kết quả đó đi — luu() bỏ Promise trong một try/catch
   ĐỒNG BỘ (catch không bao giờ bắt được một Promise bị từ chối), và hai chỗ
   ghiThu không có .then nào, ngay sau là toast("Đã ghi nhận…").

   Hậu quả: hết chỗ IndexedDB thì một lần khách trả tiền KHÔNG vào kho mà chủ
   xưởng vẫn thấy chữ "đã ghi nhận". Đây là đường mất im lặng rộng nhất của cả
   app, vì nó phủ MỌI lệnh ghi — thu tiền, nhắc nợ, ảnh, báo xong bước, đơn mới.
   Popup "hết chỗ" đã có từ trước nhưng chỉ gắn vào localStorage, không gắn vào
   IndexedDB.

   Từ đây mọi lệnh ghi đi qua daGhi(). Nó KHÔNG chặn màn hình: việc trên màn vẫn
   xong ngay, chỉ là nếu kho từ chối thì chủ xưởng được nói thẳng thay vì được
   trấn an. */
function daGhi(p, viec){
  if(!p || typeof p.then!=="function") return Promise.resolve(true);
  return p.then(function(r){
    if(r && r.khongGhiDuoc){ chuaLuuDuoc(viec, r); return false; }
    return true;
  }, function(e){ chuaLuuDuoc(viec, {loi:[String(e&&e.message||e)]}); return false; });
}
function chuaLuuDuoc(viec, r){
  HET_CHO=true;
  S.pop={k:"chualuu", viec:viec||"việc vừa rồi",
         loi:(r&&r.loi&&r.loi[0])||(DB&&DB.loiGhiCuoi&&DB.loiGhiCuoi.loi)||"không rõ lý do"};
  try{ ve(); }catch(e){}
}

function luu(){
  /* IndexedDB là kho chính: bền, dung lượng lớn, ghi bất đồng bộ không chặn màn hình.
     localStorage giữ phiên đăng nhập và làm bản dự phòng khi CSDL không mở được. */
  if(DB){ try{ daGhi(DB.ghiTuS(S,HM,VT,TN,AU), "lưu trạng thái"); }catch(e){} }
  try{
  localStorage.setItem(KHOA, JSON.stringify({
    v:8, S:S, HM:HM, VT:VT, TN:TN,
    AU:{mo:AU.mo,tho:AU.tho,sdt:AU.sdt,pinB:AU.pin?bam(AU.pin):"",dongy:AU.dongy,quyen:AU.quyen}
  }));
  HET_CHO=false;
}catch(e){
  /* Bộ nhớ máy đầy. Trước đây catch rỗng: app báo "đã xong" trong khi không ghi
     được byte nào, F5 là mất sạch việc vừa làm mà không một lời nào. */
  const day = e && (e.name==="QuotaExceededError" || e.code===22 || e.code===1014);
  if(day && !HET_CHO){
    HET_CHO=true;
    try{ S.pop={k:"hetcho"}; vePop(); bind(); }catch(e2){}
  }
} }
/* Máy đã khai là máy thợ thì về vai thợ và lược bỏ số liệu tiền ra khỏi state.

   chủ xưởng. Thợ không cần giá vốn để bấm "báo xong bước".
   Gọi ở MỌI đường nạp — cả localStorage lẫn CSDL. */
/* Những trường và bảng mà máy thợ KHÔNG được giữ. Danh sách này phải khớp với
   CAM.tho của máy chủ (api/src/quyen/cot.js) và CAT_CUA_THO của lớp đồng bộ —
   ba nơi lệch nhau là ba mức che khác nhau, và mức thấp nhất mới là mức thật.

   Hai trường dễ bỏ sót, cả hai đều từng bị bỏ sót:
     don.con = ban - thu, nên để lọt `con` là để lọt CẢ HAI.
     kh.sdtKhoa là sdtChuan(sdt) — SỐ ĐÃ CHUẨN HOÁ, KHÔNG phải băm. Tên cột
     gợi ý ngược, nên nó trông như vô hại mà không phải. */
const CAT_THO = {
  don:  ["von","thu","ban","con"],
  kh:   ["sdt","sdtKhoa"],
  vt:   ["gia"],
  tin:  ["tien"]
};
const BO_BANG_THO = ["chi","bg","thuLog","nhac"];

function locMayTho(){
  if(AU.tho!==true) return;
  S.vai="tho"; S.demo=false; S.xem=null;
  const cat=(ds,c)=>(ds||[]).forEach(o=>c.forEach(k=>{ delete o[k]; }));
  cat(S.don,   CAT_THO.don);
  cat(S.donCu, CAT_THO.don);
  cat(S.kh,    CAT_THO.kh);
  cat(VT,      CAT_THO.vt);
  /* S.tin là object khoá bằng tên khách, không phải mảng. */
  Object.keys(S.tin||{}).forEach(k=>cat(S.tin[k], CAT_THO.tin));
  BO_BANG_THO.forEach(b=>{ if(Array.isArray(S[b])) S[b]=[]; });
  S.dinhMuc={};
  if(VAI[S.vai]&&!VAI[S.vai].tabs.some(t=>t[0]===S.tab)) S.tab=VAI[S.vai].tabs[0][0];
}

/* Dọn phần tiền ra khỏi CHÍNH CƠ SỞ DỮ LIỆU trên máy thợ, không chỉ ra khỏi
   khối S. locMayTho() lọc khối trong bộ nhớ, nhưng các bảng IndexedDB thì không
   ai lọc — thợ mở công cụ nhà phát triển ra là đọc được hết. Kho `lui` còn nặng
   hơn: nó giữ NGUYÊN VĂN một bản sao khối v8 trước khi di trú, có cả giá vốn và
   số điện thoại.

   MỘT ĐIỀU KIỆN BẮT BUỘC: chỉ dọn khi ĐÃ CÓ MÁY CHỦ. Máy chủ mới là nơi giữ bản
   chuẩn; chưa có máy chủ thì cái trên máy này là BẢN DUY NHẤT, và dọn nó là xoá
   sổ sách của xưởng. Một máy offline mà ai đó lỡ nhập mã mời thợ vào thì không
   được mất dữ liệu vì chuyện đó.

   Và nói thẳng giới hạn: đây là hạn chế thiệt hại, KHÔNG phải phân quyền. Thợ
   có công cụ nhà phát triển, trên một máy từng là máy chủ xưởng, thì dọn sau
   cũng là dọn sau. Phân quyền thật nằm ở máy chủ: nó không bao giờ GỬI phần
   tiền xuống máy thợ. Hàm này chỉ lo cái đã kịp xuống trước đó. */
async function locKhoTho(){
  if(AU.tho!==true || !DB) return 0;
  if(!window.IRON_DONGBO) return 0;        /* chưa có máy chủ: đây là bản duy nhất */
  let n=0;
  try{
    for(const b of BO_BANG_THO){
      if(!IronDB.LUOC_DO[b]) continue;
      const ds=await DB.duyet(b,{keHienXoa:true,gioiHan:100000}).catch(()=>[]);
      const khoa=IronDB.LUOC_DO[b].khoa;
      for(const o of ds){ await DB.xoaCung(b,o[khoa]).catch(()=>{}); n++; }
    }
    /* Kho `lui` giữ bản sao nguyên văn trước di trú — trên máy thợ thì bỏ hẳn. */
    const lui=await DB.duyet("lui",{keHienXoa:true,gioiHan:10000}).catch(()=>[]);
    for(const o of lui){ await DB.xoaCung("lui",o.n).catch(()=>{}); n++; }
    /* Các cột tiền trong bảng còn lại: ghi lại từng dòng đã cắt. */
    for(const b of Object.keys(CAT_THO)){
      if(!IronDB.LUOC_DO[b]) continue;
      const ds=await DB.duyet(b,{keHienXoa:true,gioiHan:100000}).catch(()=>[]);
      for(const o of ds){
        let doi=false;
        CAT_THO[b].forEach(k=>{ if(k in o){ delete o[k]; doi=true; } });
        if(doi){ await DB.datVao(b,o,{nk:false}).catch(()=>{}); n++; }
      }
    }
  }catch(e){ return n; }
  return n;
}
function nap(){

  if(Array.isArray(d.VT)){ VT.length=0; d.VT.forEach(x=>VT.push(x)); }
  if(d.TN) Object.assign(TN,d.TN);

  if(d.AU&&d.AU.tho===true) locMayTho();
  S.toast=null; S.pop=null; S.xem=null;
  return !!(d.AU&&d.AU.mo);
}catch(e){ return false; } }

/* xoaLuu() CHI go localStorage. Du lieu that — don, khach, bao gia, anh — nam
   trong IndexedDB, nen nut "Toi hieu, xoa het" truoc day chi dang XUAT chu
   khong xoa gi: dang nhap lai la thay nguyen 12 don, 14 khach, tung ten khach.
   Dieu do pha chinh loi hua phap ly cua ca san pham (Luat 91/2025 Dieu 4 khoan
   1 diem d — quyen duoc xoa), va mot giam khao thu la thay ngay.

   KHONG nhet lenh xoa CSDL vao trong xoaLuu(): ham do con duoc goi o nam nhanh
   CUU HONG (khi doc cau hinh that bai, khi phien ban khong khop). Mot nhanh cuu
   hong ma xoa sach CSDL cua chu xuong la doi mot loi hien thi lay mat toan bo
   so sach. Nen chi duong nut xoa di qua ham rieng nay. */
function xoaHetThat(){
  xoaLuu();
  /* Tải lại KÈM CỜ chứ không tải lại trơn. Nhánh gieo dưới đáy boot cố ý ghi
     lại khối S khi CSDL rỗng — đúng cho máy mới, sai ngay sau khi người ta vừa
     bấm xoá: đo được 23 dòng mọc lại y nguyên sau khi xoá thành công. Cờ đi
     qua ĐƯỜNG DẪN vì localStorage vừa bị xoá cùng, và có máy chặn hẳn nó. */
  var xong = function(){
    try{ location.replace(location.pathname + "?sach=1"); }
    catch(e){ location.reload(); }
  };
  try{
    if (typeof IronDB !== "object" || !IronDB ||
        typeof IronDB.xoaCSDL !== "function") { return xong(); }
    var ten = (typeof DB === "object" && DB && DB.ten) ? DB.ten : "ironspace";

    /* PHAI DONG KET NOI TRUOC. indexedDB.deleteDatabase() khong xoa duoc khi
       con mot ket noi dang mo: no ban onblocked, va xoaCSDL() giai quyet
       onblocked bang ok('bi_chan') — tuc TRA VE THANH CONG trong khi khong xoa
       gi ca. Do la ly do nut "Toi hieu, xoa het" bao da xoa ma dang nhap lai
       van thay nguyen 23 dong don. Dong truoc roi xoa thi deleteDatabase chay
       that. */
    try{ if (DB && DB.raw && DB.raw.close) { DB.raw.close(); DB.dong = true; } }catch(e){}

    IronDB.xoaCSDL(ten).then(function(kq){
      /* Van bi chan (vi du mot tab khac cua app dang mo): thu lai mot lan sau
         300 ms, roi moi chiu thua. Tai lai trang ma CSDL con nguyen thi nguoi
         dung tuong da xoa — tha bao that con hon. */
      if (kq === 'bi_chan') {
        setTimeout(function(){ IronDB.xoaCSDL(ten).then(xong, xong); }, 300);
      } else { xong(); }
    }, xong);
  }catch(e){ xong(); }
}

  on("[data-nn]",e=>{ const o=S.don.find(x=>x.id===e.dataset.nn); if(!o) return;

            : `Dạ anh ơi, đơn ${o.id} còn ${F(no(o))} đ, quá hạn ${d} ngày. Em gửi lại đủ ba giấy tờ. Anh thu xếp giúp em trong tuần này nhé.`;

  on("[data-tranh]",e=>{ const el=document.getElementById("itra"); if(el){ el.value=e.dataset.tranh; el.focus(); } });

    const lai=no(o);

  on("[data-dt]",e=>{ const o=S.don.find(x=>x.id===e.dataset.dt); if(!o) return;

    /* Trước đây ghi cứng ngay:"10/10". Hệ quả không phải chỉ là ngày sai trên
       màn hình: chi.bam = bamDong({ngay,mo,tien,donId}) nên hai lần mua CÙNG mô
       tả, CÙNG số tiền, CÙNG đơn ra CÙNG băm, và ghiHetTuS gộp chúng thành MỘT
       dòng. Đo được: hai lần mua que hàn 820.000 đ thành một dòng 820.000 đ —
       mất đúng 820.000 đ tiền thật khỏi sổ. Mà xưởng cơ khí mua lặp cùng một

  on("[data-xong]",e=>{ const o=timDon(e.dataset.xong); if(!o||o.cd>=5) return;

  /* --- zalo khách --- */
  on("[data-zg]",()=>{ const el=document.getElementById("zin"); const t=(el.value||"").trim();
    if(!t) return toast("Anh gõ nội dung rồi bấm Gửi");

function batDau(co){

/* Phiên đăng nhập vẫn đọc từ localStorage: đồng bộ, nhẹ, để màn khoá PIN
   hiện ra ngay chứ không đợi CSDL mở xong. */
function napPhien(){

    AU.dongy=!!d.AU.dongy; if(d.AU.quyen) AU.quyen=d.AU.quyen;
    return !!d.AU.mo;

/* "Xoá hết dữ liệu trên máy này" phải GIỮ LỜI. Dọn khối S TRƯỚC khi nhánh gieo

   Giữ lại tên xưởng / tên chủ / số của CHÍNH chủ xưởng: đó là thứ họ tự khai
   lúc đăng ký, không phải dữ liệu của khách. Thứ phải biến mất là đơn, khách,

var VUA_XOA = /[?&]sach=1/.test(location.search || "");
if(VUA_XOA){
  ["don","donCu","kh","bg","chi","moi","phoi","tbao","tbDoc","thietBiRa","bo"]

      try{ napNKQ().then(function(n){ if(n && window.__sanSang) ve(); },function(){}); }catch(e){}

      return db.dem("don").then(function(n){

          .then(function(){ return donHetHan().catch(function(){ return null; }); })

        var co = nap();

    })
    .then(batDau)
    .catch(function(e){
      console.warn("Không mở được cơ sở dữ liệu, dùng bản lưu trong máy:", e);
      DB=null; batDau(nap());
    });
} else batDau(nap());

<script>
/* ===== NHỊP TIM (tuỳ chọn, MẶC ĐỊNH TẮT) =====
   Mỗi ngày gửi lên máy chủ đúng một gói 191 byte toàn số đếm:
   số đơn, số báo giá, đã chỉnh định mức chưa, thợ có dùng không.
   KHÔNG có giá vốn, KHÔNG có biên lợi nhuận, KHÔNG có tên hay số điện thoại khách,
   KHÔNG có tên xưởng. Bốn trường đếm chỉ nói xưởng DÙNG APP tới đâu.
   Chỉ chạy khi có window.IRON_NHIP và chủ xưởng bật quyền số 5. Không có
   khối cấu hình thì module này nằm im, app chạy y nguyên và không gọi ra mạng. */
/* ============================================================================
   nhip.js — nhịp tim phía máy khách của IronSpace
   ----------------------------------------------------------------------------
   Nhiệm vụ: mỗi ngày tối đa MỘT lần, gửi lên máy chủ vận hành một gói số đếm
   để nhà vận hành biết xưởng có mở app không, có tạo đơn không, có im lặng
   không. KHÔNG gửi gì về việc xưởng làm ăn thế nào.

   Bốn luật cứng, đọc hết file này vẫn thấy đúng:
     1. Chưa cấu hình máy chủ  -> im hoàn toàn. Không timer, không ghi kho,
        không gọi mạng. Đây là trạng thái mặc định của app.
     2. AU.quyen[4] tắt        -> không gửi, và DỌN LUÔN hàng đợi đang có.
     3. Không bao giờ ném lỗi ra ngoài. Mọi thứ nằm trong bọc an().
     4. Không bao giờ chặn giao diện. Mọi việc đẩy sang hàng đợi vi mô.

   Danh sách trắng CHO_PHEP ở dưới là cửa duy nhất dữ liệu được đi qua. Thêm
   trường mới mà không khai ở đó thì trường đó bị bỏ, không phải bị gửi.

   Nhúng: xem mayChu/DOC.md, phần "Nhúng vào app".
   ========================================================================== */
(function (G) {
  "use strict";

  /* ---------------------------------------------------------------- hằng số */

  var QUYEN_SO   = 4;      /* AU.quyen[4] — "Dùng dữ liệu xưởng này để cải thiện sản phẩm" */
  var PHIEN_BAN    = 8;      /* khớp với v:8 trong hàm luu() của app */
  var K_HANG_DOI = "ironspace.nhip.hangDoi";
  var K_TRANG_THAI = "ironspace.nhip.trangThai";
  var K_CAU_HINH = "ironspace.nhip.cauHinh";
  var TOI_DA_CHO = 30;     /* giữ tối đa 30 nhịp chờ ~ một tháng mất mạng */
  var CHO_MANG   = 8000;   /* ms, quá thì coi như mất mạng */
  var NHIP_QUET  = 900000; /* 15 phút: bắt lúc qua nửa đêm và lúc có mạng lại */
  var GOI_TOI_DA = 2048;   /* byte. Gói thật ~230 byte; quá mức này là có gì sai */

  /* Định mức mặc định của app. Dùng ĐỂ SO SÁNH, chỉ ra một chữ true/false.
     Bản thân các con số này không bao giờ ra khỏi máy. */
  var DM_MAC_DINH = {
    cay: 6000, mach: 2.5, duPhong: 10, hanTra: 15, gioCong: 60000,
    dien: 1500, da: 15000, nhatMoiDa: 40, que: 1375, khi: 2000
  };

  /* ------------------------------------------------------- DANH SÁCH TRẮNG */
  /* Khoá nào không có ở đây thì không ra khỏi máy. Mỗi khoá có luật riêng:
     chuỗi phải khớp mẫu hẹp, số phải nằm trong dải. Dải của các trường đếm cố
     ý chặn ở 1.000.000 — tiền trong app là hàng chục triệu, nên nếu có ai vô
     tình nhét một con tiền vào một trường đếm thì nó bị chặn tại đây. */
  var CHO_PHEP = {
    maXuong:      { loai: "chuoi", mau: /^[A-Za-z0-9_-]{3,32}$/ },
    ngay:         { loai: "chuoi", mau: /^\d{4}-\d{2}-\d{2}$/ },
    tuanCai:      { loai: "chuoi", mau: /^\d{4}-W\d{2}$/ },
    phienBan:       { loai: "so", min: 0, max: 999 },
    soDon:        { loai: "so", min: 0, max: 1000000 },
    soDonTong:    { loai: "so", min: 0, max: 1000000 },
    soDonXong:    { loai: "so", min: 0, max: 1000000 },
    soBaoGia:     { loai: "so", min: 0, max: 1000000 },
    daSuaDinhMuc: { loai: "co" },
    dungTho:      { loai: "co" },
    guiLuc:       { loai: "so", min: 0, max: 4000000000000 }
  };

  /* ------------------------------------------------------------- tiện nhỏ */

  /* Bọc an toàn: không có đường nào cho lỗi lọt ra giao diện. */
  function an(fn, duPhong) {
    try { return fn(); } catch (e) { return duPhong; }
  }
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function dsach(x) { return Object.prototype.toString.call(x) === "[object Array]" ? x : []; }
  function soNguyen(x) {
    var n = Number(x);
    return (typeof n === "number" && isFinite(n)) ? Math.round(n) : 0;
  }
  function ngayDiaPhuong(ms) {
    var d = new Date(ms);
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  }
  /* Tuần ISO "2026-W45" — dùng cho đoàn hệ giữ chân, chỉ tới mức tuần. */
  function tuanISO(ms) {
    var d = new Date(ms);
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var n = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - n);
    var dau = Date.UTC(d.getUTCFullYear(), 0, 1);
    var tuan = Math.ceil((((d.getTime() - dau) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + "-W" + p2(tuan);
  }
  /* Đẩy việc ra khỏi đường vẽ màn hình. Không bao giờ làm gì đồng bộ dài. */
  function roiRanh(fn) {
    if (typeof G.requestIdleCallback === "function") {
      an(function () { G.requestIdleCallback(function () { an(fn); }, { timeout: 2000 }); });
    } else {
      an(function () { setTimeout(function () { an(fn); }, 0); });
    }
  }

  /* -------------------------------------------------------------- kho nhỏ */
  /* Mặc định là localStorage. Tiêm được để kiểm thử chạy trong Node. Mọi lần
     đọc/ghi đều bọc an(): máy hết chỗ hay chặn cookie thì nhịp tim chết lặng,
     app vẫn chạy y nguyên. */
  function khoMacDinh() {
    return an(function () {
      var ls = G.localStorage;
      ls.setItem("ironspace.nhip.thu", "1");
      ls.removeItem("ironspace.nhip.thu");
      return ls;
    }, null);
  }
  function doc(kho, k, duPhong) {
    return an(function () {
      var r = kho.getItem(k);
      return r == null ? duPhong : JSON.parse(r);
    }, duPhong);
  }
  function ghi(kho, k, v) {
    return an(function () { kho.setItem(k, JSON.stringify(v)); return true; }, false);
  }
  function xoa(kho, k) { an(function () { kho.removeItem(k); }); }

  /* ------------------------------------------------------------- GOM SỐ */
  /* Đọc S và AU, trả về đúng các số đếm. Hàm thuần: không mạng, không kho.
     Mọi trường ở đây đều là ĐẾM hoặc CÓ/KHÔNG. Không một đồng tiền nào. */
  function gom(S, AU, tt, luc) {
    S = S || {}; AU = AU || {}; tt = tt || {};
    luc = soNguyen(luc) || Date.now();

    var don = dsach(S.don), donCu = dsach(S.donCu), bg = dsach(S.bg);
    var xong = 0, i, o;
    for (i = 0; i < don.length; i++) {
      o = don[i];
      if (o && soNguyen(o.cd) === 5) xong++;
    }
    for (i = 0; i < donCu.length; i++) {
      o = donCu[i];
      /* donCu là đơn đã lưu trữ; đơn nào thiếu cd thì coi như đã xong. */
      if (o && (o.cd == null || soNguyen(o.cd) === 5)) xong++;
    }

    /* Chỉ một chữ true/false: xưởng đã chỉnh định mức theo xưởng mình chưa.
       Chỉnh cái gì, chỉnh thành bao nhiêu — không gửi. */
    var dm = (S.dinhMuc && typeof S.dinhMuc === "object") ? S.dinhMuc : {};
    var daSua = false, k;
    for (k in DM_MAC_DINH) {
      if (dm[k] != null && Number(dm[k]) !== DM_MAC_DINH[k]) { daSua = true; break; }
    }

    return {
      maXuong:      String(tt.maXuong || ""),
      ngay:         ngayDiaPhuong(luc),
      tuanCai:      String(tt.tuanCai || tuanISO(luc)),
      phienBan:       soNguyen(tt.phienBan || PHIEN_BAN),
      soDon:        don.length,
      soDonTong:    don.length + donCu.length,
      soDonXong:    xong,
      soBaoGia:     bg.length,
      daSuaDinhMuc: !!daSua,
      dungTho:      AU.tho === true,
      guiLuc:       luc
    };
  }

  /* --------------------------------------------------------- LỌC AN TOÀN */
  /* Cửa cuối. Nhận một gói bất kỳ, trả về gói chỉ còn khoá trong danh sách
     trắng, giá trị đúng loại và đúng dải. Khoá lạ bị bỏ và báo tên ra (tên
     khoá thôi, không bao giờ kèm giá trị) để bộ kiểm thử bắt được. */
  function locAnToan(goi) {
    var sach = {}, bo = [], k, lu, v;
    if (!goi || typeof goi !== "object") return { goi: {}, bo: [], thieu: Object.keys(CHO_PHEP) };
    for (k in goi) {
      if (!Object.prototype.hasOwnProperty.call(goi, k)) continue;
      lu = CHO_PHEP[k];
      if (!lu) { bo.push(k); continue; }
      v = goi[k];
      if (lu.loai === "chuoi") {
        if (typeof v !== "string" || !lu.mau.test(v)) { bo.push(k); continue; }
        sach[k] = v;
      } else if (lu.loai === "so") {
        if (typeof v !== "number" || !isFinite(v) || v % 1 !== 0 ||
            v < lu.min || v > lu.max) { bo.push(k); continue; }
        sach[k] = v;
      } else { /* co */
        if (typeof v !== "boolean") { bo.push(k); continue; }
        sach[k] = v;
      }
    }
    var thieu = [];
    for (k in CHO_PHEP) if (!(k in sach)) thieu.push(k);
    return { goi: sach, bo: bo, thieu: thieu };
  }

  /* --------------------------------------------------------------- CẤU HÌNH */
  /* Ba đường, theo thứ tự: tham số truyền vào -> biến toàn cục G.IRON_NHIP ->
     localStorage. Thiếu mayChu, maXuong hay khoa thì coi như CHƯA cấu hình. */
  function docCauHinh(ch, kho) {
    var c = {};
    an(function () {
      var nen = (kho && doc(kho, K_CAU_HINH, null)) || null;
      var toan = G.IRON_NHIP || null;
      var ng = [nen, toan, ch], i, n, k;
      for (i = 0; i < ng.length; i++) {
        n = ng[i];
        if (n && typeof n === "object") for (k in n) if (n[k] != null && n[k] !== "") c[k] = n[k];
      }
    });
    c.mayChu = String(c.mayChu || "").replace(/\/+$/, "");
    c.maXuong = String(c.maXuong || "");
    c.khoa = String(c.khoa || "");
    c.phienBan = soNguyen(c.phienBan) || PHIEN_BAN;
    return c;
  }
  function daCauHinh(c) {
    return !!(c.mayChu && /^https?:\/\/[^\s]+$/.test(c.mayChu) &&
              CHO_PHEP.maXuong.mau.test(c.maXuong) && c.khoa.length >= 8);
  }

  /* ----------------------------------------------------------------- GỬI */
  /* Một lời gọi mạng duy nhất trong cả module, ở đúng một chỗ.
     Content-Type text/plain cố ý: gói thành "yêu cầu đơn giản" nên trình duyệt
     không phải preflight — app chạy từ file:// vẫn gửi được. */
  function guiMacDinh(url, than, hetGio) {
    if (typeof G.fetch === "function") {
      var huy = null, hd = null;
      if (typeof G.AbortController === "function") {
        hd = new G.AbortController();
        huy = setTimeout(function () { an(function () { hd.abort(); }); }, hetGio);
      }
      return G.fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: than,
        signal: hd ? hd.signal : undefined,
        cache: "no-store",
        keepalive: than.length < 60000
      }).then(function (r) {
        if (huy) clearTimeout(huy);
        return { ma: r.status };
      }, function (e) {
        if (huy) clearTimeout(huy);
        throw e;
      });
    }
    /* Trình duyệt quá cũ: XHR. */
    return new Promise(function (xong, truot) {
      var x = new G.XMLHttpRequest();
      x.open("POST", url, true);
      x.timeout = hetGio;
      x.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
      x.onload = function () { xong({ ma: x.status }); };
      x.onerror = function () { truot(new Error("mang")); };
      x.ontimeout = function () { truot(new Error("hetGio")); };
      x.send(than);
    });
  }

  /* ============================================================== BẮT ĐẦU */

  function batDau(tuyChon) {
    tuyChon = tuyChon || {};

    var kho   = tuyChon.kho || khoMacDinh();
    var gio   = tuyChon.gio || function () { return Date.now(); };
    var guiHTTP = tuyChon.guiHTTP || guiMacDinh;
    var layS  = typeof tuyChon.layS === "function" ? tuyChon.layS
              : function () { return G.S; };
    var layAU = typeof tuyChon.layAU === "function" ? tuyChon.layAU
              : function () { return G.AU; };

    var c = docCauHinh(tuyChon.cauHinh, kho);

    /* --- LUẬT 1: chưa cấu hình thì im hoàn toàn ----------------------------
       Không ghi kho, không đặt timer, không nghe sự kiện, không gọi mạng.
       Đây là trạng thái mặc định khi chủ xưởng tải app về dùng offline. */
    if (!daCauHinh(c)) {
      return { chay: false, lyDo: "chuaCauHinh", day: function () {}, dung: function () {} };
    }
    if (!kho) {
      /* Không có chỗ nhớ thì không xếp hàng được -> thà không chạy. */
      return { chay: false, lyDo: "khongCoKho", day: function () {}, dung: function () {} };
    }

    var hen = null, dangDay = false, daDung = false;
    var ngheOnline = null;

    function layTrangThai() {
      var tt = doc(kho, K_TRANG_THAI, null);
      if (!tt || typeof tt !== "object") tt = {};
      if (!tt.tuanCai) tt.tuanCai = tuanISO(gio());
      tt.maXuong = c.maXuong;
      tt.phienBan = c.phienBan;
      return tt;
    }

    function coQuyen() {
      return an(function () {
        var AU = layAU();
        return !!(AU && dsach(AU.quyen)[QUYEN_SO] === true);
      }, false);
    }

    function hangDoi() {
      var h = doc(kho, K_HANG_DOI, []);
      return dsach(h);
    }

    /* --- tạo nhịp của hôm nay, tối đa một lần mỗi ngày ------------------- */
    function taoNhipHomNay() {
      var tt = layTrangThai();
      var luc = gio();
      var homNay = ngayDiaPhuong(luc);
      if (tt.ngayDaTao === homNay) return false;   /* hôm nay đã tạo rồi */

      var tho = gom(layS(), layAU(), tt, luc);
      var r = locAnToan(tho);
      if (r.thieu.length) return false;            /* gói không đủ -> bỏ, im lặng */

      var h = hangDoi();
      /* cùng ngày thì thay tại chỗ, không nhân dòng trong hàng đợi */
      var i, thay = -1;
      for (i = 0; i < h.length; i++) if (h[i] && h[i].ngay === homNay) { thay = i; break; }
      if (thay >= 0) h[thay] = r.goi; else h.push(r.goi);
      if (h.length > TOI_DA_CHO) h = h.slice(h.length - TOI_DA_CHO);

      ghi(kho, K_HANG_DOI, h);
      tt.ngayDaTao = homNay;
      ghi(kho, K_TRANG_THAI, tt);
      return true;
    }

    /* --- đẩy hàng đợi lên máy chủ ---------------------------------------- */
    function dayHangDoi() {
      if (dangDay || daDung) return Promise.resolve(0);
      var h = hangDoi();
      if (!h.length) return Promise.resolve(0);
      dangDay = true;

      var daGui = 0;

      function moiCai() {
        if (daDung) return Promise.resolve();
        var con = hangDoi();
        if (!con.length) return Promise.resolve();
        if (!coQuyen()) { xoa(kho, K_HANG_DOI); return Promise.resolve(); }

        var goi = locAnToan(con[0]).goi;
        var than = JSON.stringify({ maXuong: c.maXuong, khoa: c.khoa, goi: goi });
        if (than.length > GOI_TOI_DA) {        /* không thể xảy ra với gói thật */
          ghi(kho, K_HANG_DOI, con.slice(1));
          return moiCai();
        }

        return guiHTTP(c.mayChu + "/nhip", than, CHO_MANG).then(function (kq) {
          var ma = kq && soNguyen(kq.ma);
          if (ma >= 200 && ma < 300) {
            /* xong: bỏ cái đầu, đi tiếp */
            var sau = hangDoi().slice(1);
            ghi(kho, K_HANG_DOI, sau);
            daGui++;
            return moiCai();
          }
          if (ma === 400 || ma === 401 || ma === 403 || ma === 413) {
            /* máy chủ từ chối hẳn gói này. Giữ lại chỉ tốn chỗ -> bỏ, im lặng. */
            ghi(kho, K_HANG_DOI, hangDoi().slice(1));
            return Promise.resolve();
          }
          /* 429 / 5xx / khác: để nguyên hàng đợi, lần sau thử lại */
          return Promise.resolve();
        }, function () {
          /* mất mạng: KHÔNG bỏ gói. Nằm chờ lần sau. */
          return Promise.resolve();
        });
      }

      return moiCai().then(function () {
        dangDay = false; return daGui;
      }, function () {
        dangDay = false; return daGui;
      });
    }

    /* --- một vòng: xét quyền, tạo nhịp, đẩy ------------------------------ */
    function motVong() {
      if (daDung) return Promise.resolve(0);

      /* --- LUẬT 2: quyền tắt thì không gửi và dọn sạch hàng đợi ---------
         Chủ xưởng tắt quyền hôm nay thì mấy nhịp đang chờ của hôm qua cũng
         không được đi. Tắt là tắt. */
      if (!coQuyen()) {
        if (hangDoi().length) xoa(kho, K_HANG_DOI);
        return Promise.resolve(0);
      }
      an(taoNhipHomNay);
      return dayHangDoi();
    }

    /* --- LUẬT 4: không chặn giao diện ----------------------------------- */
    roiRanh(function () { an(motVong); });

    hen = an(function () {
      var t = setInterval(function () { roiRanh(function () { an(motVong); }); }, NHIP_QUET);
      if (t && typeof t.unref === "function") t.unref();   /* Node: đừng giữ tiến trình sống */
      return t;
    }, null);

    if (G.addEventListener) {
      ngheOnline = function () { roiRanh(function () { an(motVong); }); };
      an(function () { G.addEventListener("online", ngheOnline); });
    }

    return {
      chay: true,
      lyDo: "",
      /* day(): chạy ngay một vòng. Bộ kiểm thử và nút "Gửi ngay" dùng. */
      day: function () { return an(motVong, Promise.resolve(0)); },
      dung: function () {
        daDung = true;
        an(function () { if (hen) clearInterval(hen); });
        an(function () { if (ngheOnline && G.removeEventListener) G.removeEventListener("online", ngheOnline); });
      },
      /* cho bộ kiểm thử xem bên trong, không dùng trong app */
      _hangDoi: hangDoi,
      _cauHinh: c
    };
  }

  /* ---------------------------------------------------------------- xuất */

  var IronNhip = {
    batDau: batDau,
    gom: gom,
    locAnToan: locAnToan,
    tuanISO: tuanISO,
    ngayDiaPhuong: ngayDiaPhuong,
    CHO_PHEP: CHO_PHEP,
    QUYEN_SO: QUYEN_SO,
    PHIEN_BAN: PHIEN_BAN
  };

  if (typeof module !== "undefined" && module.exports) module.exports = IronNhip;
  G.IronNhip = IronNhip;

})(typeof globalThis !== "undefined" ? globalThis
  : typeof window !== "undefined" ? window : this);

</script>
<script>
(function(){
  function batNhip(){ try{ IronNhip.batDau({ layS:function(){return S;}, layAU:function(){return AU;} }); }catch(e){} }
  if(!window.IRON_NHIP) return;                 /* chưa cấu hình: nằm im */
  if(window.__sanSang) batNhip();
  else document.addEventListener("ironspace:sansang", batNhip);
})();
</script>
</body></html>
