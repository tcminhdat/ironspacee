:root{
  --on-dark:#8A97A6;
  --steel:#2B3440; --steel-2:#3D4859; --spark:#D95A17; --spark-ink:#B3480F; --spark-bg:#FDF0E8;
  --ink:#141A21; --ink-2:#44505E; --ink-3:#5F6B79;
  --bg:#EDF0F3; --card:#FFFFFF; --soft:#F4F6F8; --line:#E1E6EB; --line-2:#C9D1D9;
  --ok:#1E7A46; --ok-bg:#E8F3EC; --bad:#B3261E; --bad-bg:#FBEAE8; --warn:#B3480F; --warn-bg:#FDF0E8;
  --sans:"Be Vietnam Pro",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px; --r-s:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 60px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;width:100%}

/* ---------- khung ngoài ---------- */
.top{width:100%;max-width:430px;margin-bottom:14px}
.wm{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.who{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:999px;box-shadow:0 1px 3px rgba(43,52,64,.10)}
.who button{flex:1;padding:8px 4px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-3);line-height:1.15}
.who button small{display:block;font-size:10px;font-weight:500;opacity:.8}
.who button[aria-current="true"]{background:var(--steel);color:#fff}

/* ---------- điện thoại ---------- */
.phone{width:100%;max-width:430px;background:var(--card);border-radius:28px;overflow:hidden;
  box-shadow:0 12px 40px rgba(43,52,64,.20),0 2px 8px rgba(43,52,64,.10);display:flex;flex-direction:column;
  height:calc(min(860px, 100vh - 150px) / var(--z,1));
  min-height:calc(560px / var(--z,1));
  max-width:calc(430px / var(--z,1))}
/* NẰM NGANG. min-height:560px THẮNG height:calc(100vh-150px): quay ngang
   điện thoại thì 100vh~390px, khung bị ép cao 560px, tràn khỏi màn hình và
   .nav ở cuối cột flex bị đẩy xuống dưới mép — mất hẳn thanh điều hướng, giám
   khảo không bấm được gì nữa. Màn thấp thì bỏ sàn cao và bớt phần trừ. */
@media (max-height:700px){
  /* 84px = đệm trên thân trang 20 + thanh .top 26 + khoảng cách 14 + chừa dưới
     24. Đo thật trên 844x390: khung bắt đầu ở y=60, nên trừ 24 vẫn lố 36px. */
  .phone{ min-height:0;
          height:calc(min(860px, 100vh - 84px) / var(--z,1)) }
}
.bar{background:var(--steel);color:#fff;padding:13px 18px 14px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.bar .lg{font-weight:700;font-size:17px;letter-spacing:-.01em}
.bar .lg i{color:var(--spark);font-style:normal}
.bar .sub{font-size:11.5px;color:#AEB9C6;margin-top:1px}
.bar .bell+.bell{margin-left:8px}
.bar .bell{margin-left:auto;flex:0 0 auto;position:relative;width:34px;height:34px;border-radius:999px;background:#3D4859;
  display:grid;place-items:center;font-size:15px}

/* ---------- khối ---------- */

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.03em}

/* ---------- nút ---------- */

/* ---------- dòng danh sách ---------- */

  padding:14px 15px;margin-bottom:9px;text-align:left;box-shadow:0 1px 3px rgba(43,52,64,.08)}

/* ---------- nhãn ---------- */

/* ---------- sơ đồ cắt ---------- */

/* ---------- vặt ---------- */

.bk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-3);margin-bottom:10px}

  padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(43,52,64,.3);

  if(Array.isArray(x)) return x.map(chuanHoa);
  var k=Object.keys(x).sort(), o={}, i;
  for(i=0;i<k.length;i++) o[k[i]]=chuanHoa(x[k[i]]);

}
function jsonChuan(x){ return JSON.stringify(chuanHoa(x)); }
/* Băm nội dung cho SÁU BẢNG CHỈ THÊM — 64 bit, KHÔNG dùng fnv1a 32 bit.
   Lý do đo được, không phải lý thuyết. bam là khoá chống trùng DUY NHẤT của
   tin, chi, buoc, phoi, thuLog, nhac, và ở máy chủ nó vào UNIQUE (xuong_id,
   bam) với ON CONFLICT DO NOTHING. Hai dòng trùng băm nghĩa là MỘT LẦN KHÁCH
   TRẢ TIỀN THẬT BỊ ÂM THẦM BỎ ĐI — không lỗi, không log, không ai thấy.

   Với 32 bit, xác suất một xưởng gặp ít nhất một lần trùng:
     10.000 dòng -> 1,2%     50.000 dòng -> 25%     100.000 dòng -> 69%
   Một xưởng 3 đơn/tuần chạy 10 năm sinh khoảng 30.000-50.000 dòng chỉ thêm,
   nên 32 bit là CỠ SAI cho việc này. Đo bản 64 bit dưới đây: 0 lần trùng trên
   2.000.000 dòng giống dữ liệu thật, và kỳ vọng sinh nhật ở mức đó là 1e-7.

   vào ít hơn vẻ ngoài của nó.

   Cả hai nhân bằng Math.imul. fnv1a() ở trên nhân bằng số thực,
   (h*0x01000193)>>>0, nên h lớn thì vượt 2^53 và mất chữ số: đo được nó trùng
   6,5 lần nhiều hơn FNV-1a đúng (170 so với 26 trên 500.000 chuỗi).
   KHÔNG sửa fnv1a() — nó là tổng kiểm tra tệp sao lưu, đổi nó là mọi tệp đã
   xuất không kiểm lại được.

  for(i=0;i<t.length;i++){ h^=t.charCodeAt(i)&0xff; h=Math.imul(h,0x01000193)>>>0;

/* Tuần ISO dạng "2026-W41" — khoá sắp được theo thứ tự chuỗi */
function tuanISO(ms){
  if(!ms) return '';

  var n=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-n);
  var dn=new Date(Date.UTC(d.getUTCFullYear(),0,1));

function sdtChuan(s){

  if(s.indexOf('+84')===0) s='0'+s.slice(3);
  else if(s.indexOf('84')===0 && s.length>9) s='0'+s.slice(2);
  return s;
}

/* ---- đọc giờ kiểu app7: "08/10 09:14" | "09:02" | "03/2025" ---- */
function docGio(s, moc){
  moc = moc || MOC_MAC_DINH;
  s = String(s||'').trim();
  var m;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/);
  if(m) return Date.UTC(new Date(moc).getUTCFullYear(), +m[2]-1, +m[1], +m[3], +m[4]);
  m = s.match(/^(\d{1,2}):(\d{2})$/);
  if(m){                                  /* chỉ có giờ: tính từ NỬA ĐÊM của ngày mốc.
      Mốc có thể là Date.now() (có cả giờ phút), cộng thẳng vào là lệch. */
    var d0=new Date(moc);
    return Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate())
           + (+m[1])*3600000 + (+m[2])*60000;
  }
  m = s.match(/^(\d{1,2})\/(\d{4})$/);                 /* "03/2025" */
  if(m) return Date.UTC(+m[2], +m[1]-1, 1);
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/);               /* "09/10" */
  if(m) return Date.UTC(new Date(moc).getUTCFullYear(), +m[2]-1, +m[1]);
  var t = Date.parse(s);
  return isFinite(t) ? t : 0;
}

/* ---- base64 cho ảnh trong tệp sao lưu (không dùng thư viện) ---- */
var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64Ma(buf){
  var b=new Uint8Array(buf), r='', i;
  for(i=0;i<b.length;i+=3){
    var c=(b[i]<<16)|((b[i+1]||0)<<8)|(b[i+2]||0);
    r+=B64[(c>>18)&63]+B64[(c>>12)&63]+(i+1<b.length?B64[(c>>6)&63]:'=')+(i+2<b.length?B64[c&63]:'=');
  }
  return r;
}
function b64Giai(s){
  s=String(s).replace(/[^A-Za-z0-9+/]/g,'');
  var n=s.length, byte=new Uint8Array(Math.floor(n*3/4)), p=0, i, c=0, bit=0;
  for(i=0;i<n;i++){ c=(c<<6)|B64.indexOf(s[i]); bit+=6;
    if(bit>=8){ bit-=8; byte[p++]=(c>>bit)&0xff; } }
  return byte.subarray(0,p);
}

/* ================== 3. BỌC INDEXEDDB BẰNG PROMISE ================== */

function yc(r){ return new Promise(function(ok,loi){
  r.onsuccess=function(){ ok(r.result); };
  r.onerror=function(){ loi(r.error||new Error('Lỗi IndexedDB')); };
}); }

/* như yc() nhưng chặn lỗi lan ra giao dịch: dùng khi cố ý chấp nhận
   va chạm chỉ mục unique (ví dụ nạp lại một bước đã có) */
function ycMem(r){ return new Promise(function(ok){
  r.onsuccess=function(){ ok({ok:true, kq:r.result}); };
  r.onerror=function(ev){
    if(ev&&ev.preventDefault) ev.preventDefault();
    if(ev&&ev.stopPropagation) ev.stopPropagation();
    ok({ok:false, loi:String(r.error&&r.error.name||'loi')});
  };
}); }

function xongGD(tx){ return new Promise(function(ok,loi){
  tx.oncomplete=function(){ ok(true); };
  tx.onerror=function(){ loi(tx.error||new Error('Giao dịch lỗi')); };
  tx.onabort =function(){ loi(tx.error||new Error('Giao dịch bị huỷ')); };
}); }

function quet(nguon, huong, fn){ return new Promise(function(ok,loi){
  var r=nguon.openCursor(null,huong||'next');
  r.onsuccess=function(){ var c=r.result;
    if(!c) return ok();
    var tiep;
    try{ tiep=fn(c.value,c); }catch(e){ return loi(e); }
    if(tiep===false) return ok();
    c.continue();
  };
  r.onerror=function(){ loi(r.error); };
}); }

function khoang(tu,den,moTu,moDen){
  if(tu===undefined && den===undefined) return null;
  if(tu!==undefined && den!==undefined) return IDBKeyRange.bound(tu,den,!!moTu,!!moDen);
  if(tu!==undefined) return IDBKeyRange.lowerBound(tu,!!moTu);
  return IDBKeyRange.upperBound(den,!!moDen);
}

function taoBang(db, ten){

  var kho = db.objectStoreNames.contains(ten)
          ? null
          : db.createObjectStore(ten, d.tang ? {keyPath:d.khoa, autoIncrement:true}
                                             : {keyPath:d.khoa});
  if(!kho) return;
  (d.mo||[]).forEach(function(m){
    kho.createIndex(m[0], m[1].length===1?m[1][0]:m[1], m[2]||{});
  });
}

/* Bản đồ nâng cấp lược đồ. Mỗi phiên bản là một bước, chạy trong
   onupgradeneeded. Thêm phiên bản mới thì thêm một khoá vào đây. */
var NANG_CAP = {
  9: function(db){ Object.keys(LUOC_DO).forEach(function(t){ taoBang(db,t); }); },
  /* 9 -> 10: thêm sổ thu tiền và sổ nhắc nợ. taoBang() bỏ qua bảng đã có, nên
     bước này chỉ tạo hai bảng mới; mọi dòng đang có trên máy không bị chạm. */
  10: function(db){ taoBang(db,'thuLog'); taoBang(db,'nhac'); }
};

function mo(tuyChon){
  tuyChon = tuyChon || {};
  var ten  = tuyChon.ten || TEN_CSDL;
  var dich = tuyChon.phienBan || PHIEN_BAN;
  return new Promise(function(ok,loi){
    if(typeof indexedDB==='undefined'||!indexedDB)
      return loi(new Error('Trình duyệt này không có IndexedDB'));
    var r=indexedDB.open(ten,dich);
    r.onupgradeneeded=function(ev){
      var db=r.result, cu=ev.oldVersion||0, v;
      for(v=cu+1; v<=dich; v++) if(NANG_CAP[v]) NANG_CAP[v](db, r.transaction, cu);
    };
    r.onblocked=function(){ loi(new Error('CSDL đang bị tab khác giữ, đóng tab kia rồi mở lại')); };
    r.onsuccess=function(){ ok(r.result); };
    r.onerror=function(){ loi(r.error||new Error('Không mở được CSDL')); };
  }).then(function(raw){
    var db=new CSDL(raw, ten);
    return db._khoiTao(tuyChon);
  });
}

function xoaCSDL(ten){
  return new Promise(function(ok,loi){
    var r=indexedDB.deleteDatabase(ten||TEN_CSDL);
    r.onsuccess=function(){ ok(true); };
    r.onerror=function(){ loi(r.error); };
    r.onblocked=function(){ ok('bi_chan'); };
  });
}

/* ================== 5. LỚP CSDL ================== */

function CSDL(raw, ten){
  this.raw = raw;
  this.ten = ten;
  this.may = null;        /* mã máy, sinh một lần cho mỗi điện thoại */
  this.tagMay = '';       /* hậu tố mã đơn, để hai máy không trùng mã */
  this.ghiNhatKy = true;
  this.dong = false;      /* kết nối đã đóng chưa */
  this._gan();
}

/* Tab khác xoá hoặc nâng cấp CSDL thì Chrome bắt kết nối này nhường chỗ.
   Phải nhớ lại, vì mọi transaction sau đó sẽ ném InvalidStateError. */
CSDL.prototype._gan = function(){
  var self=this, raw=self.raw;
  raw.onversionchange=function(){ self.dong=true; try{ raw.close(); }catch(e){} };
  raw.onclose=function(){ self.dong=true; };
};

/* Cửa duy nhất mở giao dịch. Kết nối đã đóng (tab khác xoá hoặc nâng cấp CSDL,
   hệ thống thu hồi) thì ném Error thường, bắt được bằng try/catch, thay vì để
   Chrome ném InvalidStateError ra ngoài mọi chỗ bắt lỗi. */
CSDL.prototype._tx = function(bangs,che){
  if(this.dong) throw new Error('CSDL đã đóng, hãy gọi moLai() trước khi ghi');
  try{ return this.raw.transaction(bangs,che); }
  catch(e){ this.dong=true; throw new Error('Không mở được giao dịch: '+(e.message||e.name)); }
};

/* Mở lại sau khi bị đóng. Dùng cho đường ghi gộp nhịp, để một lần mất kết nối
   không làm app mất luôn khả năng lưu. */
CSDL.prototype.moLai = function(){
  var self=this;
  if(!self.dong) return Promise.resolve(self);
  return new Promise(function(ok,loi){
    var r=indexedDB.open(self.ten, PHIEN_BAN);
    r.onupgradeneeded=function(ev){
      var db=r.result, cu=ev.oldVersion||0, v;
      for(v=cu+1; v<=PHIEN_BAN; v++) if(NANG_CAP[v]) NANG_CAP[v](db, r.transaction, cu);
    };
    r.onsuccess=function(){ self.raw=r.result; self.dong=false; self._gan(); ok(self); };
    r.onerror=function(){ loi(r.error||new Error('Không mở lại được CSDL')); };
    r.onblocked=function(){ loi(new Error('CSDL đang bị tab khác giữ')); };
  });
};

CSDL.prototype._khoiTao = function(tuyChon){
  var self=this;
  return self.layMeta('may').then(function(m){
    if(m) return m;
    var moi = 'may-'+Math.random().toString(36).slice(2,8)+'-'+Date.now().toString(36);
    return self.datMeta('may',moi).then(function(){ return moi; });
  }).then(function(m){
    self.may=m;
    return self.layMeta('tagMay');
  }).then(function(t){
    self.tagMay = t || '';
    return self.layMeta('phienBanDuLieu');
  }).then(function(pb){
    if(pb) return pb;
    return self.datMeta('phienBanDuLieu',PHIEN_BAN).then(function(){ return PHIEN_BAN; });
  }).then(function(){
    if(tuyChon.khongDiTru) return null;
    return self.diTru(tuyChon);
  }).then(function(){ return self; });
};

/* ---------- meta ---------- */
CSDL.prototype.layMeta = function(k){
  var tx=this._tx('meta','readonly');
  return yc(tx.objectStore('meta').get(k)).then(function(r){ return r?r.v:null; });
};
CSDL.prototype.datMeta = function(k,v){
  var tx=this._tx('meta','readwrite');
  tx.objectStore('meta').put({k:k,v:v,luc:nay()});
  return xongGD(tx).then(function(){ return v; });
};

/* ---------- chuẩn hoá dòng trước khi ghi ---------- */
CSDL.prototype._chuan = function(bang,o){
  o = o || {};
  var t = nay(), _k;
  for(_k in o) if(_k.charAt(0)==='_') delete o[_k];   /* cột nghĩa tạm của anhXaS */
  if(o.taoLuc==null) o.taoLuc = t;
  o.suaLuc = o.suaLuc==null ? t : o.suaLuc;
  if(o.xoa==null) o.xoa = 0;

  if(bang==='don'){
    o.ban = nguyen(o.ban); o.von = nguyen(o.von); o.thu = nguyen(o.thu);
    o.cd  = nguyen(o.cd);  o.kho = co(o.kho);  o.ct = co(o.ct);
    o.hanNgay = nguyen(o.hanNgay);                 /* 0 = chưa đặt hạn */
    o.xongLuc = o.xongLuc==null ? 0 : nguyen(o.xongLuc);
    o.con = Math.max(0, o.ban - o.thu);            /* cột dẫn xuất, có chỉ mục */
    o.tuanISO = tuanISO(o.xongLuc || o.taoLuc);    /* cột dẫn xuất, có chỉ mục */
    o.khTen = o.khTen || '';
    o.khId  = o.khId || '';
    /* chi tiết kỹ thuật của đơn: thiếu thì traPhoi() không biết trả đoạn thừa
       về kho dưới loại vật tư nào, và giấy nghiệm thu không in được khối lượng */
    o.vtId = o.vtId || '';
    o.len  = nguyen(o.len);  o.qty = nguyen(o.qty);  o.cay = nguyen(o.cay);
    o.daTraPhoi = co(o.daTraPhoi);   /* chống trả phôi hai lần khi bấm lại bước Cắt */
  }
  if(bang==='kh'){
    o.ten = String(o.ten||'').trim();
    o.sdt = String(o.sdt==null?'':o.sdt);
    o.sdtKhoa = sdtChuan(o.sdt);
    o.soLanCu = nguyen(o.soLanCu);
    o.tuNgay = nguyen(o.tuNgay);
  }
  if(bang==='bg'){
    o.ban=nguyen(o.ban); o.von=nguyen(o.von);
    o.ngay=nguyen(o.ngay); o.hetHan=nguyen(o.hetHan);
    o.tt = o.tt||'cho'; o.khId=o.khId||''; o.donId=o.donId||'';
  }
  if(bang==='tin'){
    o.luc=nguyen(o.luc); o.loai=o.loai||'text'; o.khId=o.khId||'';
    o.daDoc=co(o.daDoc);
    /* Băm KHÔNG lấy ngày, chỉ lấy giờ:phút. Khối S lưu tin trong ngày dưới dạng
       "07:42" không có ngày, nên ngày tuyệt đối là thứ suy ra từ mốc: đường di
       trú suy ra 10/10/2026 (hôm nay của dữ liệu demo), đường lưu thường ngày
       suy ra hôm nay. Cho ngày vào băm là cùng một tin thành hai dòng. */
    o.bam = o.bam || bamDong({khId:o.khId, ai:o.ai, t:o.t||'', loai:o.loai,
                              ma:o.ma||'', gp:gioPhut(o.luc)});
  }
  if(bang==='chi'){
    o.tien=nguyen(o.tien); o.ngay=nguyen(o.ngay); o.donId=o.donId||'';
    o.bam = o.bam || bamDong({ngay:o.ngay,mo:o.mo||'',tien:o.tien,donId:o.donId});
  }
  if(bang==='thuLog'){
    o.tien=nguyen(o.tien); o.luc=nguyen(o.luc);
    o.donId=o.donId||''; o.khId=o.khId||'';
    o.cach=o.cach||'khac';        /* tienmat | chuyenkhoan | khac */
    o.ghi=o.ghi||'';
    o.bam = o.bam || bamDong({donId:o.donId,khId:o.khId,luc:o.luc,tien:o.tien,cach:o.cach});
  }
  if(bang==='nhac'){
    o.luc=nguyen(o.luc); o.bac=nguyen(o.bac);
    o.donId=o.donId||''; o.khId=o.khId||'';
    o.kenh=o.kenh||'zalo';        /* zalo | goi | gap | khac */
    o.bam = o.bam || bamDong({donId:o.donId,khId:o.khId,luc:o.luc,bac:o.bac,kenh:o.kenh});
  }
  if(bang==='buoc'){ o.buoc=nguyen(o.buoc); o.luc=nguyen(o.luc);
    o.bam = o.bam || bamDong({donId:o.donId,buoc:o.buoc}); }
  if(bang==='phoi'){ o.len=nguyen(o.len); o.qty=nguyen(o.qty); o.vtId=o.vtId||''; o.tuDon=o.tuDon||'';
    o.bam = o.bam || bamDong({len:o.len,qty:o.qty,vtId:o.vtId,tuDon:o.tuDon}); }
  if(bang==='moi'){ o.xuLy=co(o.xuLy); o.luc=nguyen(o.luc); }
  if(bang==='tb'){ o.daDoc=co(o.daDoc); o.luc=nguyen(o.luc); }
  if(bang==='anh'){
    o.luc=nguyen(o.luc); o.hetHan=nguyen(o.hetHan); o.byte=nguyen(o.byte);
    o.buoc=nguyen(o.buoc); o.donId=o.donId||'';
    o.rong=nguyen(o.rong); o.cao=nguyen(o.cao);   /* kích thước sau khi hạ cỡ */
    o.kieu=o.kieu||'image/jpeg';
  }
  if(bang==='vt'){ o.gia=so(o.gia); o.an=co(o.an); }
  return o;
};

/* ---------- CRUD ---------- */

CSDL.prototype.them = function(bang,o,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var d=LUOC_DO[bang]; if(!d) return Promise.reject(new Error('Không có bảng '+bang));
  o=self._chuan(bang,o);
  if(!d.tang && (o[d.khoa]==null||o[d.khoa]==='')) return Promise.reject(new Error('Thiếu khoá chính '+d.khoa+' cho bảng '+bang));
  var bangs=[bang]; if(self.ghiNhatKy&&tuyChon.nk!==false) bangs.push('nk');
  var tx=self._tx(bangs,'readwrite');
  var p=yc(tx.objectStore(bang).add(o)); p.catch(function(){});
  if(self.ghiNhatKy&&tuyChon.nk!==false)
    tx.objectStore('nk').add({luc:nay(),may:self.may,nd:tuyChon.nd||'',bang:bang,
                              khoa:String(o[d.khoa]||''),viec:'them',sau:o});
  return xongGD(tx).then(function(){ return p; });
};

CSDL.prototype.datVao = function(bang,o,tuyChon){      /* add hoặc ghi đè */
  var self=this; tuyChon=tuyChon||{};
  var d=LUOC_DO[bang]; if(!d) return Promise.reject(new Error('Không có bảng '+bang));
  o=self._chuan(bang,o);
  var bangs=[bang]; if(self.ghiNhatKy&&tuyChon.nk!==false) bangs.push('nk');
  var tx=self._tx(bangs,'readwrite');
  var p=yc(tx.objectStore(bang).put(o)); p.catch(function(){});
  if(self.ghiNhatKy&&tuyChon.nk!==false)
    tx.objectStore('nk').add({luc:nay(),may:self.may,nd:tuyChon.nd||'',bang:bang,
                              khoa:String(o[d.khoa]||''),viec:'datVao',sau:o});
  return xongGD(tx).then(function(){ return p; });
};

CSDL.prototype.lay = function(bang,khoa){
  var tx=this._tx(bang,'readonly');
  return yc(tx.objectStore(bang).get(khoa));
};

CSDL.prototype.sua = function(bang,khoa,vaLai,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var d=LUOC_DO[bang]; if(!d) return Promise.reject(new Error('Không có bảng '+bang));
  var bangs=[bang]; if(self.ghiNhatKy&&tuyChon.nk!==false) bangs.push('nk');
  var tx=self._tx(bangs,'readwrite');
  var kho=tx.objectStore(bang);
  return yc(kho.get(khoa)).then(function(cu){
    if(!cu) throw new Error('Không thấy '+bang+' khoá '+khoa);
    var moi={}, k;
    for(k in cu) moi[k]=cu[k];
    var vl = typeof vaLai==='function' ? vaLai(cu) : vaLai;
    for(k in vl) moi[k]=vl[k];
    moi.suaLuc = nay();
    moi = self._chuan(bang,moi);
    kho.put(moi);
    if(self.ghiNhatKy&&tuyChon.nk!==false)
      tx.objectStore('nk').add({luc:nay(),may:self.may,nd:tuyChon.nd||'',bang:bang,
                                khoa:String(khoa),viec:'sua',truoc:cu,sau:moi});
    return xongGD(tx).then(function(){ return moi; });
  }).catch(function(e){ try{tx.abort();}catch(_){} throw e; });
};

/* xoá mềm (mặc định) hay xoá cứng ({cung:true}) */
CSDL.prototype.xoa = function(bang,khoa,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  if(!tuyChon.cung && LUOC_DO[bang] && !LUOC_DO[bang].tang)
    return self.sua(bang,khoa,{xoa:1},tuyChon);
  if(tuyChon.cung && PHU_THUOC[bang] && !tuyChon.khongTheoCon)
    return self.xoaCung(bang,khoa,tuyChon);
  var bangs=[bang]; if(self.ghiNhatKy&&tuyChon.nk!==false) bangs.push('nk');
  var tx=self._tx(bangs,'readwrite');
  var kho=tx.objectStore(bang);
  return yc(kho.get(khoa)).then(function(cu){
    kho.delete(khoa);
    if(self.ghiNhatKy&&tuyChon.nk!==false)
      tx.objectStore('nk').add({luc:nay(),may:self.may,nd:tuyChon.nd||'',bang:bang,
                                khoa:String(khoa),viec:'xoa',truoc:cu||null});
    return xongGD(tx).then(function(){ return true; });
  });
};

/* Xoá cứng kèm phụ thuộc. Cả cây nằm trong một giao dịch: hoặc sạch
   hết, hoặc không đổi gì. Trả về số dòng đã xoá / đã tháo liên kết. */
CSDL.prototype.xoaCung = function(bang,khoa,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var bangs=Object.keys(bangLienQuan(bang));
  var bc={xoa:{}, thaoLien:{}};
  function demLen(o,b){ o[b]=(o[b]||0)+1; }
  return self.gd(bangs,'readwrite',function(api){
    function xuLy(b,k){
      var chuoi=Promise.resolve();
      (PHU_THUOC[b]||[]).forEach(function(r){
        chuoi=chuoi.then(function(){
          var idx;
          try{ idx=api.kho(r.bang).index(r.chiMuc); }catch(e){ return; }
          var con=[];
          return new Promise(function(ok,loi){
            var rq=idx.openCursor(IDBKeyRange.only(k));
            rq.onsuccess=function(){ var c=rq.result; if(!c) return ok();
              con.push({khoa:c.primaryKey, dong:c.value}); c.continue(); };
            rq.onerror=function(){ loi(rq.error); };
          }).then(function(){
            var q=Promise.resolve();
            con.forEach(function(x){
              q=q.then(function(){
                if(r.viec==='xoa') return xuLy(r.bang, x.khoa);
                var o=x.dong; o[r.cot]=''; o.suaLuc=nay();
                demLen(bc.thaoLien, r.bang);
                return yc(api.kho(r.bang).put(o));
              });
            });
            return q;
          });
        });
      });
      return chuoi.then(function(){
        demLen(bc.xoa,b);
        api.nhatKy(b,k,'xoaCung',null,null);
        return yc(api.kho(b).delete(k));
      });
    }
    return xuLy(bang,khoa);
  }).then(function(){ return bc; });
};

/* ---------- đọc có chỉ mục ---------- */
/* d = {chiMuc, bang:[tu,den], khoa:giaTri, nguoc, gioiHan, lui, loc, keHienXoa} */
CSDL.prototype.duyet = function(bang,d){
  d=d||{};
  var tx=this._tx(bang,'readonly');
  var kho=tx.objectStore(bang);
  var nguon = d.chiMuc ? kho.index(d.chiMuc) : kho;
  var pv = d.khoa!==undefined ? IDBKeyRange.only(d.khoa)
         : (d.bang ? khoang(d.bang[0],d.bang[1],d.moTu,d.moDen) : null);
  var kq=[], boQua=d.lui||0, gh=d.gioiHan||Infinity, dem=0;
  return new Promise(function(ok,loi){
    var r=nguon.openCursor(pv, d.nguoc?'prev':'next');
    r.onsuccess=function(){
      var c=r.result;
      if(!c) return ok(kq);
      var v=c.value;
      var nhan = (d.keHienXoa||v.xoa!==1) && (!d.loc || d.loc(v));
      if(nhan){
        if(boQua>0){ boQua--; }
        else { kq.push(v); dem++; if(dem>=gh) return ok(kq); }
      }
      c.continue();
    };
    r.onerror=function(){ loi(r.error); };
  });
};

CSDL.prototype.tatCa = function(bang,d){ return this.duyet(bang,d); };

CSDL.prototype.timTheo = function(bang,chiMuc,giaTri,d){
  d=d||{}; d.chiMuc=chiMuc; d.khoa=giaTri; return this.duyet(bang,d);
};

CSDL.prototype.dem = function(bang,chiMuc,giaTri){
  var tx=this._tx(bang,'readonly');
  var kho=tx.objectStore(bang);
  var nguon = chiMuc ? kho.index(chiMuc) : kho;
  return yc(giaTri!==undefined ? nguon.count(IDBKeyRange.only(giaTri)) : nguon.count());
};

/* ---------- giao dịch nhiều bảng ----------
   Trong fn chỉ được await các thao tác IndexedDB của chính giao dịch này.
   Await thứ khác (fetch, setTimeout) sẽ làm giao dịch tự đóng. */
CSDL.prototype.gd = function(bangs,che,fn){
  var self=this;
  bangs = [].concat(bangs);
  if(che==='readwrite' && self.ghiNhatKy && bangs.indexOf('nk')<0) bangs.push('nk');
  var tx=self._tx(bangs,che);
  var xong=xongGD(tx); xong.catch(function(){});
  var api={
    tx: tx,
    kho: function(b){ return tx.objectStore(b); },
    lay: function(b,k){ return yc(tx.objectStore(b).get(k)); },
    them: function(b,o){ return yc(tx.objectStore(b).add(self._chuan(b,o))); },
    datVao: function(b,o){ return yc(tx.objectStore(b).put(self._chuan(b,o))); },
    datVaoMem: function(b,o){ return ycMem(tx.objectStore(b).put(self._chuan(b,o))); },
    themMem: function(b,o){ return ycMem(tx.objectStore(b).add(self._chuan(b,o))); },
    xoa: function(b,k){ return yc(tx.objectStore(b).delete(k)); },
    dem: function(b){ return yc(tx.objectStore(b).count()); },
    timTheo: function(b,ci,gt){
      var kq=[];
      return new Promise(function(ok,loi){
        var r=tx.objectStore(b).index(ci).openCursor(IDBKeyRange.only(gt));
        r.onsuccess=function(){ var c=r.result; if(!c) return ok(kq); kq.push(c.value); c.continue(); };
        r.onerror=function(){ loi(r.error); };
      });
    },
    nhatKy: function(b,k,viec,truoc,sau){
      if(!self.ghiNhatKy) return;
      tx.objectStore('nk').add({luc:nay(),may:self.may,bang:b,khoa:String(k||''),viec:viec,truoc:truoc,sau:sau});
    },
    huy: function(){ tx.abort(); }
  };
  return Promise.resolve().then(function(){ return fn(api); })
    .then(function(kq){ return xong.then(function(){ return kq; }); })
    .catch(function(e){ try{ tx.abort(); }catch(_){} throw e; });
};

/* ---------- sinh mã đơn / mã báo giá không trùng ---------- */
CSDL.prototype.maMoi = function(tienTo){
  var self=this, k='dem.'+tienTo;
  var tx=self._tx('meta','readwrite');
  var kho=tx.objectStore('meta');
  return yc(kho.get(k)).then(function(r){
    var n=(r&&r.v?r.v:0)+1;
    kho.put({k:k,v:n,luc:nay()});
    return xongGD(tx).then(function(){ return tienTo+'-'+n+self.tagMay; });
  });
};

CSDL.prototype.congNoTheoKhach = function(mocNgay){

      if(!o.ct && o.cd>=5) g[k].thieuGiay=true;
    });
    return Object.keys(g).map(function(k){return g[k];})
      .sort(function(a,b){ return b.ngayQuaHan-a.ngayQuaHan || b.tien-a.tien; });

/* HIỆU QUẢ NHẮC NỢ — chỉ số ROI của cả sản phẩm.
   Mỗi khoản khách trả được gán cho TỐI ĐA MỘT lần nhắc: lần nhắc gần nhất
   trước nó, cùng đơn (hoặc cùng khách nếu khoản thu không ghi đơn), và nằm
   trong cửa sổ soNgay ngày. Gán một lần nên không cộng trùng khi hai lần nhắc
   sát nhau; số khoản rơi vào nhiều cửa sổ vẫn được báo riêng để biết phần gán
   nào là mơ hồ. Tiền vào mà không sau lần nhắc nào thì tách ra hẳn, không nhập
   vào con số hiệu quả. */
CSDL.prototype.hieuQuaNhac = function(soNgay, tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var N = nguyen(soNgay,14); if(N<=0) N=14;
  var cuaSo = N*NGAY;
  return self.duyet('nhac',{chiMuc:'luc'}).then(function(dsNhac){
    return self.duyet('thuLog',{chiMuc:'luc'}).then(function(dsThu){
      var theoDon={}, theoKh={};
      dsNhac.forEach(function(nh){
        if(nh.donId) (theoDon[nh.donId]=theoDon[nh.donId]||[]).push(nh);
        if(nh.khId)  (theoKh[nh.khId] =theoKh[nh.khId] ||[]).push(nh);
      });
      var gan={}, moHo=0, tongNgay=0, soGan=0, tienSauNhac=0, tongTienThu=0;
      var tienKhacDon=0, soKhoanKhacDon=0;
      function trongCuaSo(nh,t){ return nh.luc<=t.luc && t.luc<=nh.luc+cuaSo; }
      dsThu.forEach(function(t){
        tongTienThu += t.tien;
        /* Khoản trả có ghi mã đơn thì CHỈ gán cho lần nhắc về đúng đơn đó, hoặc
           lần nhắc chung không ghi đơn nào của cùng khách. Không gán sang lần
           nhắc về đơn khác — làm vậy là tự thổi con số lên. */
        var ds;
        if(t.donId){
          ds = (theoDon[t.donId]||[]).concat(
                 (theoKh[t.khId]||[]).filter(function(nh){ return !nh.donId; }));
        } else {
          ds = theoKh[t.khId] || [];
        }
        var tot=null, demTrung=0;
        ds.forEach(function(nh){
          if(!trongCuaSo(nh,t)) return;
          demTrung++;
          if(!tot || nh.luc>tot.luc) tot=nh;
        });
        if(!tot){
          /* cùng khách, trong cửa sổ, nhưng nhắc về đơn khác: báo riêng, không cộng */
          if(t.donId && (theoKh[t.khId]||[]).some(function(nh){
               return nh.donId && nh.donId!==t.donId && trongCuaSo(nh,t); })){
            tienKhacDon += t.tien; soKhoanKhacDon++;
          }
          return;
        }
        if(demTrung>1) moHo++;
        (gan[tot.n]=gan[tot.n]||[]).push(t);
        tienSauNhac += t.tien;
        tongNgay += (t.luc-tot.luc)/NGAY; soGan++;
      });
      var bac={}, i;
      for(i=0;i<BAC_NHAC.length;i++) bac[i]={ten:BAC_NHAC[i], soLan:0, soLanCoTra:0, tien:0};
      var coTra=0, don={}, kh={};
      dsNhac.forEach(function(nh){
        var b=bac[nh.bac]||bac[0];
        b.soLan++;
        if(nh.donId) don[nh.donId]=1;
        if(nh.khId)  kh[nh.khId]=1;
        var g=gan[nh.n];
        if(g && g.length){
          coTra++; b.soLanCoTra++;
          g.forEach(function(t){ b.tien+=t.tien; });
        }
      });
      return {
        soNgay:N,
        soLanNhac: dsNhac.length,
        soDonCoNhac: Object.keys(don).length,
        soKhachCoNhac: Object.keys(kh).length,
        tongTienThu: tongTienThu,
        tienSauNhac: tienSauNhac,
        tienKhongDoNhac: tongTienThu - tienSauNhac,
        soLanNhacCoTra: coTra,
        tyLeNhacCoTra: dsNhac.length ? +(coTra/dsNhac.length*100).toFixed(1) : 0,
        tienMoiLanNhac: dsNhac.length ? Math.round(tienSauNhac/dsNhac.length) : 0,
        ngayTraTrungBinh: soGan ? +(tongNgay/soGan).toFixed(1) : null,
        soKhoanRoiNhieuCuaSo: moHo,
        tienCungKhachKhacDon: tienKhacDon,
        soKhoanCungKhachKhacDon: soKhoanKhacDon,
        theoBac: bac
      };
    });
  });
};

/* Đơn này đã trả đoạn thừa về kho phôi chưa? Trả lời từ cả hai nguồn: cờ
   daTraPhoi trên đơn, và có thật dòng phôi nào mang tuDon là đơn này. Nhờ vậy
   thợ bấm lại bước Cắt cũng không trả phôi lần hai. */
CSDL.prototype.daTraPhoiChua = function(donId){
  var self=this;
  return self.lay('don',String(donId)).then(function(o){
    return self.timTheo('phoi','tuDon',String(donId)).then(function(ds){
      return { daTra: !!(o&&o.daTraPhoi) || ds.length>0,
               theoCo: !!(o&&o.daTraPhoi), soDongPhoi: ds.length };
    });
  });
};

/* Đọc dữ liệu v8 từ localStorage (hoặc chuỗi/đối tượng truyền vào) */
function docV8(nguon){
  var tho=nguon;
  if(tho==null){
    try{ tho=G.localStorage?G.localStorage.getItem(KHOA_CU):null; }catch(e){ tho=null; }
  }
  if(tho==null) return null;
  if(typeof tho==='string'){ try{ tho=JSON.parse(tho); }catch(e){ return null; } }
  if(!tho || typeof tho!=='object') return null;
  return tho;
}

/* Bộ di trú có đánh số: tu -> den */
var BO_DI_TRU = [
  { tu:8, den:9, ten:'localStorage ironspace.v8 -> IndexedDB ironspace v9', chay:diTru8sang9 }
];

CSDL.prototype.diTru = function(tuyChon){
  var self=this; tuyChon=tuyChon||{};
  return self.layMeta('diTru.v8').then(function(da){
    if(da && !tuyChon.buoc) return {boQua:true, lyDo:'đã di trú trước đó', luc:da.luc, soDong:da.soDong};
    var tho=docV8(tuyChon.nguonV8);
    if(!tho) return {boQua:true, lyDo:'không thấy dữ liệu ironspace.v8'};
    var v = tho.v||0;
    var buoc = BO_DI_TRU.filter(function(b){ return b.tu>=v; });
    if(!buoc.length) return {boQua:true, lyDo:'phiên bản nguồn '+v+' không có đường di trú'};
    /* 1. sao lưu nguyên văn để còn đường lùi */
    var tho_s = JSON.stringify(tho);
    var tx=self._tx('lui','readwrite');
    tx.objectStore('lui').add({luc:nay(), tu:v, den:PHIEN_BAN, may:self.may,
                               byte:tho_s.length, bam:fnv1a(tho_s), du:tho_s});
    return xongGD(tx).then(function(){
      /* 2. chạy từng bước */
      var p=Promise.resolve({tho:tho, bc:[]});
      buoc.forEach(function(b){
        p=p.then(function(st){
          return b.chay(self, st.tho, tuyChon).then(function(bc){
            st.bc.push({buoc:b.ten, soDong:bc});
            return st;
          });
        });
      });
      return p;
    }).then(function(st){
      var soDong={}, i;
      st.bc.forEach(function(b){ for(i in b.soDong) soDong[i]=(soDong[i]||0)+b.soDong[i]; });
      return self.datMeta('diTru.v8',{luc:nay(),tu:v,den:PHIEN_BAN,soDong:soDong,buoc:st.bc.map(function(b){return b.buoc;})})
        .then(function(){
          try{ if(G.localStorage) G.localStorage.setItem(CO_DA_DITRU, String(nay())); }catch(e){}
          return {boQua:false, soDong:soDong, buoc:st.bc};
        });
    });
  });
};

/* ===== ÁNH XẠ CHUNG: khối S/HM/VT/TN/AU  ->  dòng của từng bảng =====
   Đây là phép ánh xạ DUY NHẤT trong module; hai đường ghi đều gọi nó, nên
   không bao giờ lệch nhau:
     diTru8sang9()  — nạp lần đầu từ localStorage ironspace.v8
     ghiHetTuS()    — ghi cả khối S xuống CSDL mỗi lần app lưu
   Hàm thuần: không đọc, không ghi CSDL, chỉ trả về dòng.
   Các cột bắt đầu bằng "_" là nghĩa tương đối mang kèm (số ngày tới hạn, số
   tuần trước) để bên ghi biết mốc tuyệt đối cũ có còn đúng nghĩa hay không;
   _chuan() xoá chúng trước khi vào CSDL. */
/* "khach" KHÔNG BAO GIỜ là vai của một thiết bị — nó là màn XEM THỬ của chế
   độ trình diễn (nút data-vai ở #who, chỉ hiện khi S.demo bật). Ghi nó xuống
   cấu hình là dựng một cái bẫy: mở lại app thì vai khách được khôi phục, mà
   vai khách chỉ có tab Zalo, KHÔNG có nút ⚙ cài đặt, và nút bật trình diễn tự
   chặn chính nó với vai khách — chủ xưởng kẹt trong màn xem thử, không có
   đường ra ngoài xoá sạch dữ liệu. chu/so/tho là vai thiết bị thật và vẫn lưu
   bình thường. Chặn ở CẢ hai đầu vì dữ liệu đã lưu trước đây có thể mang
   "khach" sẵn rồi. */
function vaiLuuDuoc(v){ return (v && v!=='khach') ? v : 'chu'; }

function anhXaS(S,HM,VT,TN,AU,tuyChon){
  tuyChon = tuyChon || {};
  var moc = tuyChon.moc || MOC_MAC_DINH;
  S=S||{}; HM=HM||[]; VT=VT||[]; TN=TN||{}; AU=AU||{};
  var dong={kh:[],don:[],buoc:[],bg:[],tin:[],chi:[],thuLog:[],nhac:[],phoi:[],
            vt:[],hm:[],moi:[],tb:[],cai:[],nd:[]};
  var tenToiId={}, daDungId={}, doiMa={}, k;
  if(tuyChon.tenToiId) for(k in tuyChon.tenToiId){
    tenToiId[k]=tuyChon.tenToiId[k]; daDungId[tuyChon.tenToiId[k]]=1; }

  /* --- 1. khách: hợp S.kh với MỌI tên được tham chiếu ở nơi khác --- */
  var coTen={}, thuTu=[];
  function ghiNhanTen(t){ t=String(t||'').trim(); if(!t) return;
    if(!coTen[t]){ coTen[t]=1; thuTu.push(t); } }
  (S.kh||[]).forEach(function(x){ ghiNhanTen(x.ten); });
  (S.don||[]).forEach(function(o){ ghiNhanTen(o.kh); });
  (S.donCu||[]).forEach(function(o){ ghiNhanTen(o.kh); });
  (S.bg||[]).forEach(function(q){ ghiNhanTen(q.kh); });
  (S.moi||[]).forEach(function(m){ ghiNhanTen(m.kh); });
  Object.keys(S.tin||{}).forEach(ghiNhanTen);

  var khGoc={};
  (S.kh||[]).forEach(function(x){ khGoc[String(x.ten||'').trim()]=x; });

  var demKh=0;
  function idKhMoi(){ var id;
    do{ demKh++; id='KH-'+('0000'+demKh).slice(-4); }while(daDungId[id]);
    daDungId[id]=1; return id; }

  thuTu.forEach(function(ten){
    var g=khGoc[ten]||null;
    var id=(g&&g.id) || tenToiId[ten] || idKhMoi();
    tenToiId[ten]=id; daDungId[id]=1;
    var sdt = g ? String(g.sdt==null?'':g.sdt) : '';
    if(sdt==='chưa có số') sdt='';          /* chữ do napVaoS bày ra, không phải số thật */
    dong.kh.push({ id:id, ten:ten, sdt:sdt,
      ghi: g ? (g.ghi||'') : 'Suy ra từ đơn hoặc tin, chưa có trong sổ khách cũ',
      soLanCu: g ? nguyen(g.lan) : 0,
      tuNgay: (g&&g.tu) ? docGio(g.tu,moc) : 0,
      nguon: g ? 'so_khach_v8' : 'suy_ra_v8',
      taoLuc: moc, suaLuc: moc });
  });

  /* --- 2. đơn: don (kho=0) + donCu (kho=1) vào một bảng, trùng mã thì giữ cả hai --- */
  var maDaDung={};
  function napDon(ds,kho){
    (ds||[]).forEach(function(o){
      var id=String(o.id||''); if(!id) return;
      if(maDaDung[id]){
        var moiId=id+'-K', n=2;
        while(maDaDung[moiId]) moiId=id+'-K'+(n++);
        doiMa[id+'@kho']=moiId; id=moiId;
      }
      maDaDung[id]=1;
      var tuan = kho ? (5-nguyen(o.w)) : nguyen(o.tg);   /* số tuần trước */
      var xong = o.cd>=5;
      dong.don.push({
        id:id, maGoc:String(o.id||''),
        khId: o.khId || tenToiId[String(o.kh||'').trim()] || '',
        khTen:String(o.kh||''), hang:o.hang||'',
        ban:o.ban, von:o.von, thu:o.thu, cd:o.cd,
        ct:o.ct?1:0, kho:kho,
        vtId:o.vtId||'', len:nguyen(o.len), qty:nguyen(o.qty), cay:nguyen(o.cay),
        daTraPhoi:co(o.daTraPhoi),
        hanNgay: (o.han==null) ? 0 : (moc + nguyen(o.han)*NGAY),
        xongLuc: xong ? (moc - tuan*7*NGAY) : 0,
        _hanTuongDoi: (o.han==null) ? null : nguyen(o.han),
        _tuanTruoc: xong ? tuan : null,
        taoLuc: moc - (kho?6:2)*7*NGAY, suaLuc: moc });
    });
  }
  napDon(S.don,0); napDon(S.donCu,1);

  /* --- 3. các bước đã xong (S.anh) --- */
  var A=S.anh||{};
  Object.keys(A).forEach(function(donId){
    (A[donId]||[]).forEach(function(m){
      var ten=m[0], bi=CD.indexOf(ten); if(bi<0) bi=0;
      /* Phần tử thứ ba là mốc thật (epoch milli). Có thì dùng thẳng — đó là
         nguồn đáng tin duy nhất. Không có thì đọc nhãn "DD/MM HH:MM" như cũ.
         Không bao giờ bịa ra mốc: thiếu cả hai thì để 0 và bên ghi sẽ giữ mốc
         đã lưu trong bảng buoc. */
      var luc = (m.length>2 && nguyen(m[2])>0) ? nguyen(m[2]) : docGio(m[1],moc);
      dong.buoc.push({ donId:donId, buoc:bi, tenBuoc:ten,
        luc:luc, anhId:'', thoId:'' });
    });
  });

  /* --- 4. báo giá --- */
  (S.bg||[]).forEach(function(q){
    dong.bg.push({
      id:String(q.id), khId:tenToiId[String(q.kh||'').trim()]||'', khTen:q.kh||'',
      hang:q.hang||'', vtTen:q.vt||'', vtId:q.vtId||'', qty:nguyen(q.qty), len:nguyen(q.len),
      cay:nguyen(q.cay), kg:(q.kg==null?null:so(q.kg)), hao:(q.hao==null?null:so(q.hao)),
      ban:q.ban, von:q.von,
      ngay:docGio(q.ngay,moc),
      hetHan: moc + nguyen(q.con)*NGAY,        /* con = số ngày còn lại tính từ mốc */
      _conTuongDoi: nguyen(q.con),
      tt:q.tt||'cho', donId:q.don||'',
      taoLuc:docGio(q.ngay,moc), suaLuc:moc });
  });

  /* --- 5. tin nhắn: map tên -> mảng, tháo thành bảng phẳng --- */
  var T=S.tin||{};
  Object.keys(T).forEach(function(ten){
    (T[ten]||[]).forEach(function(m){
      dong.tin.push({
        khId:tenToiId[String(ten).trim()]||'', khTen:ten,
        ai:m.ai||'kh', luc:docGio(m.g,moc),
        loai: m.loai || 'text',
        t:m.t||'', ma:m.ma||'', hang:m.hang||'',
        cay:(m.cay==null?null:nguyen(m.cay)), qty:(m.qty==null?null:nguyen(m.qty)),
        len:(m.len==null?null:nguyen(m.len)), tien:(m.tien==null?null:nguyen(m.tien)),
        ok:(m.ok==null?null:co(m.ok)), tra:(m.tra==null?null:co(m.tra)),
        anhId:'', daDoc:1 });
    });
  });

  /* --- 6. chi phí, phôi, vật tư, hạng mục, tin Zalo, thông báo đã đọc --- */
  (S.chi||[]).forEach(function(c){
    dong.chi.push({ ngay:docGio(c.ngay,moc), mo:c.mo||'', tien:c.tien,
      donId:c.don||'', loai:'vattu' });
  });
  (S.phoi||[]).forEach(function(f){
    /* vt là mã vật tư của đoạn phôi. Thiếu nó thì khoPhoi() có thể khuyên lấy
       đoạn inox đi cắt cho đơn sắt hộp — khác kim loại, khác giá. */
    dong.phoi.push({ len:f.len, qty:f.qty, tuDon:f.tu||'',
      vtId: f.vtId || f.vt || '', luc:moc });
  });
  /* Hai sổ mới mang mốc epoch thẳng trong S, không qua chuỗi "DD/MM" nào, nên
     không có chuyện suy ra ngày từ mốc rồi hai đường ghi lệch nhau. */
  (S.thuLog||[]).forEach(function(x){
    dong.thuLog.push({ donId:x.donId||'', tien:x.tien, luc:nguyen(x.luc),
      khId: x.khId || tenToiId[String(x.kh||'').trim()] || '',
      cach:x.cach||'khac', ghi:x.ghi||'' });
  });
  (S.nhac||[]).forEach(function(x){
    dong.nhac.push({ donId:x.donId||'', luc:nguyen(x.luc), bac:nguyen(x.bac),
      khId: x.khId || tenToiId[String(x.kh||'').trim()] || '',
      kenh:x.kenh||'zalo' });
  });
  (VT||[]).forEach(function(v){
    dong.vt.push({ id:String(v.id), ten:v.ten||'', mo:v.mo||'', d:v.d||'hop',
      a:so(v.a), b:so(v.b), t:so(v.t), rho:so(v.rho), gia:so(v.gia), an:0 });
  });
  (HM||[]).forEach(function(h,i){
    dong.hm.push({ id:'HM-'+(i+1), ten:String(h), thuTu:i });
  });
  (S.moi||[]).forEach(function(m){
    dong.moi.push({ id:String(m.id), khTen:m.kh||'',
      khId:tenToiId[String(m.kh||'').trim()]||'', luc:docGio(m.gio,moc),
      t:m.t||'', coAnh:co(m.anh), anhId:'', xuLy:0 });
  });
  (S.tbDoc||[]).forEach(function(id){
    dong.tb.push({ id:String(id), i:'', t:'', d:'', luc:moc, daDoc:1 });
  });

  /* --- 7. cài đặt + người dùng --- */
  var cai={ xuong:S.xuong, chu:S.chu, sdt:S.sdt, dinhMuc:S.dinhMuc,
    baoHanh:(S.baoHanh==null?12:S.baoHanh), anhGiu:S.anhGiu||'don',
    tbao:S.tbao||[true,true,true,true,true], nhap:S.nhap, troNang:TN,
    boQuaDeXuat:S.bo||[], vaiHienTai:vaiLuuDuoc(S.vai), thoDon:S.thoDon||'',
    khBG:S.khBG||'', uiTab:S.tab, uiTuanXem:S.tuanXem };
  Object.keys(cai).forEach(function(k2){
    if(cai[k2]!==undefined) dong.cai.push({k:k2, v:cai[k2]});
  });
  dong.nd.push({ id:'ND-0001', sdt:sdtChuan(AU.sdt||S.sdt||''), ten:S.chu||'Chủ xưởng',
    vai:'chu', pinB:AU.pinB||'', dongy:co(AU.dongy),
    quyen:AU.quyen||[true,true,true,true,false],
    tho:co(AU.tho), dangNhapLuc:moc });

  return { dong:dong, tenToiId:tenToiId, doiMa:doiMa };
}

/* Bảng mà ghiHetTuS được phép ghi. KHÔNG có "anh": ảnh nhị phân chỉ đi qua
   CRUD, khối S không mang byte ảnh nên ghi cả khối không được chạm vào nó. */
var BANG_TU_S = ['kh','don','buoc','bg','tin','chi','thuLog','nhac','phoi','vt','hm','moi','tb','cai','nd'];
/* Bảng mà S là nguồn chân lý đầy đủ: dòng biến khỏi S nghĩa là đã xoá.
   "moi" và "tb" không có ở đây vì napVaoS chỉ dựng lại phần chưa xử lý / đã đọc. */
var S_QUYET_XOA = {kh:1, don:1, bg:1, vt:1, hm:1, tin:1, chi:1, phoi:1, buoc:1};

/* Khoá tự nhiên để ghép dòng mới với dòng đã có trong CSDL */
function khoaTuNhien(b,o){
  if(b==='buoc') return 'b|'+o.donId+'|'+o.buoc;
  var d=LUOC_DO[b];
  if(!d.tang) return 'k|'+o[d.khoa];
  return 'h|'+(o.bam||'');
}
/* Khoá lỏng cho chi phí: napVaoS chỉ trả "DD/MM" nên mất năm, băm sẽ lệch
   khi khoản chi cũ hơn một năm. Ghép thêm bằng nội dung để không nhân dòng. */
function khoaLong(b,o){
  if(b==='chi') return 'l|'+(o.mo||'')+'|'+o.tien+'|'+(o.donId||'');
  /* Danh tính thật của một tin: khách + người gửi + nội dung + giờ:phút.
     Không có ngày, nên ghép được cả dòng đã lưu theo công thức băm cũ. */
  if(b==='tin') return 'l|'+(o.khId||'')+'|'+(o.ai||'')+'|'+(o.t||'')+'|'+
                       (o.loai||'')+'|'+(o.ma||'')+'|'+gioPhut(o.luc);
  /* Phôi: băm có vtId, nên dòng cũ lưu thời chưa biết loại vật tư sẽ lệch băm
     khi app bắt đầu gửi vt. Ghép thêm bằng chiều dài + số lượng + đơn nguồn để
     dòng cũ được ĐIỀN vtId chứ không bị nhân đôi. */
  if(b==='phoi') return 'l|'+o.len+'|'+o.qty+'|'+(o.tuDon||'');
  /* Sổ thu tiền và sổ nhắc nợ: băm của hai bảng này lấy cả o.luc tới MILI GIÂY,
     nên bất cứ thay đổi nào ở công thức băm — hoặc ở cách suy ra mốc thời gian —
     là nhân đôi cả sổ tiền. Nhân đôi một dòng thu nghĩa là tongThuCuaDon() đếm
     gấp đôi, đơn trông như đã trả xong, và xưởng thôi đi đòi một khoản nợ thật.

     Khoá lỏng ở đây cắt tới PHÚT chứ không tới ngày: hai lần khách trả cùng một
     số tiền, cùng một đơn, cùng cách trả, trong cùng một phút thì gần như chắc
     chắn là một lần được suy ra hai lối, chứ không phải hai lần trả thật. Cắt
     tới ngày thì rộng quá — hai lần trả bằng nhau trong một ngày là chuyện có
     thật. Khoá này chỉ được tra khi khoá băm đã trượt, nên ngày thường nó không
     chạy; nó chỉ đỡ đúng lúc công thức băm đổi. */
  if(b==='thuLog') return 'l|'+(o.donId||'')+'|'+(o.khId||'')+'|'+o.tien+'|'+
                          (o.cach||'')+'|'+phutISO(o.luc);
  if(b==='nhac')   return 'l|'+(o.donId||'')+'|'+(o.khId||'')+'|'+o.bac+'|'+
                          (o.kenh||'')+'|'+phutISO(o.luc);
  return null;
}
/* Mốc cắt tới phút, dạng so sánh được bằng chuỗi. Rỗng khi không có mốc, để hai
   dòng đều thiếu mốc không bị ghép bừa vào nhau. */
function phutISO(ms){
  if(!ms) return '';
  var d=new Date(ms); if(isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,16);
}
/* Những cột mà khối S không mang theo: napVaoS không trả chúng về, nên khi ghi
   cả khối phải giữ giá trị của dòng cũ, nếu không mỗi lần lưu là xoá sạch
   chúng (ghi chú khách, nguồn khách, mã gốc của đơn bị đổi mã, liên kết ảnh…). */
var GIU_CUA_CU = {
  kh:   ['ghi','nguon','diaChi'],
  don:  ['maGoc','thuGoc'],
  bg:   [],   /* vtId giờ S mang theo */
  buoc: ['anhId','thoId','luc'],  /* mốc thật của bước nằm ở CSDL, S chỉ mang nhãn */
  tin:  ['anhId','daDoc','luc'],   /* S không mang ngày tin cậy được: đã lưu rồi thì giữ */
  moi:  ['anhId'],
  phoi: ['luc'],   /* vtId giờ S mang theo, chỉ mốc là của CSDL */
  vt:   ['an'],
  nd:   ['dangNhapLuc','ten']
};

function giongNhau(a,b2){
  var x={}, y={}, k;
  for(k in a) if(k!=='suaLuc') x[k]=a[k];
  for(k in b2) if(k!=='suaLuc') y[k]=b2[k];
  return jsonChuan(x)===jsonChuan(y);
}

function diTru8sang9(db, tho, tuyChon){
  /* Di trú dùng CHUNG cả phép ánh xạ (anhXaS) lẫn bộ máy ghi (ghiHetTuS) với
     đường lưu thường ngày, nên hai đường không thể lệch nhau, và chạy di trú
     lại lần nữa không nhân đôi dòng nào — kể cả các bảng khoá tự tăng.
     khongXoaThieu: khối v8 không phải nguồn chân lý để xoá, chỉ để nạp vào. */
  var moc = (tuyChon && tuyChon.moc) ? tuyChon.moc : MOC_MAC_DINH;
  return db.ghiHetTuS(tho.S||{}, tho.HM||[], tho.VT||[], tho.TN||{}, tho.AU||{},
                      {moc:moc, khongXoaThieu:true})
    .then(function(bc){
      var dem={};
      BANG_TU_S.forEach(function(b){ dem[b]=(bc.them[b]||0)+(bc.sua[b]||0); });
      return db.datMeta('diTru.doiMa', bc.doiMa||{}).then(function(){
        return db.datMeta('diTru.loi', bc.loi||[]).then(function(){ return dem; });
      });
    });
}

/* ---------- đường lùi ---------- */
/* Trả dữ liệu v8 về localStorage đúng như trước khi di trú, và (nếu muốn)
   xoá hẳn CSDL mới. App7 cũ sẽ chạy lại như chưa có gì xảy ra. */
CSDL.prototype.danhSachBanLui = function(){
  return this.duyet('lui',{nguoc:true}).then(function(ds){
    return ds.map(function(b){ return {n:b.n,luc:b.luc,tu:b.tu,den:b.den,byte:b.byte,bam:b.bam}; });
  });
};
CSDL.prototype.lui = function(tuyChon){
  var self=this; tuyChon=tuyChon||{};
  return self.duyet('lui',{nguoc:true,gioiHan:1}).then(function(ds){
    if(!ds.length) throw new Error('Không có bản sao lưu nào để lùi');
    var b = tuyChon.n!=null ? null : ds[0];
    var p = b ? Promise.resolve(b) : self.lay('lui',tuyChon.n);
    return p;
  }).then(function(b){
    if(!b) throw new Error('Không thấy bản sao lưu');
    if(fnv1a(b.du)!==b.bam) throw new Error('Bản sao lưu bị hỏng (tổng kiểm tra không khớp)');
    try{ G.localStorage.setItem(KHOA_CU, b.du); }
    catch(e){ throw new Error('Không ghi lại được localStorage: '+e.message); }
    try{ G.localStorage.removeItem(CO_DA_DITRU); }catch(e){}
    return self.datMeta('diTru.v8',null).then(function(){
      if(!tuyChon.xoaCSDL) return {xong:true, byte:b.du.length, daXoaCSDL:false};
      self.raw.close();
      return xoaCSDL(self.ten).then(function(){ return {xong:true, byte:b.du.length, daXoaCSDL:true}; });
    });
  });
};

/* ================== 8. XUẤT / NHẬP ================== */

function blobSangGhi(b){
  return b.arrayBuffer().then(function(buf){
    return {__blob:1, kieu:b.type||'application/octet-stream', b64:b64Ma(buf)};
  });
}
function ghiSangBlob(o){
  var u=b64Giai(o.b64);
  return new Blob([u],{type:o.kieu||'application/octet-stream'});
}
function thayBlob(dong){                /* Blob -> {__blob} trong một dòng */
  var cho=[], k;
  for(k in dong) if(dong[k] && typeof Blob!=='undefined' && dong[k] instanceof Blob) cho.push(k);
  if(!cho.length) return Promise.resolve(dong);
  return Promise.all(cho.map(function(k){
    return blobSangGhi(dong[k]).then(function(g){ dong[k]=g; });
  })).then(function(){ return dong; });
}

CSDL.prototype.xuat = function(tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var bangs = tuyChon.bang || BANG_DU_LIEU.concat(tuyChon.keNhatKy?['nk']:[]);
  var ra={ungDung:'ironspace', phienBan:PHIEN_BAN, luc:nay(),
           may:self.may, bang:{}, soDong:{}, tong:0};
  var p=Promise.resolve();
  bangs.forEach(function(b){
    p=p.then(function(){
      return self.duyet(b,{keHienXoa:true}).then(function(ds){
        return Promise.all(ds.map(thayBlob)).then(function(ds2){
          ra.bang[b]=ds2; ra.soDong[b]=ds2.length; ra.tong+=ds2.length;
        });
      });
    });
  });
  return p.then(function(){
    /* TỔNG KIỂM TRA TỆP DÙNG fnv1a, KHÔNG DÙNG bamDong. Hai hàm đó có hai nhiệm
       vụ khác nhau và một trong hai được phép đổi:

         bamDong  — khoá chống trùng của sáu bảng chỉ thêm. Nó ĐÃ đổi một lần
                    (32 lên 64 bit, vì 32 bit cho 25% xác suất trùng ở 50.000
                    dòng) và còn có thể đổi nữa.
         fnv1a    — tổng kiểm tra tệp. Đổi nó là mọi tệp .json chủ xưởng đã tải
                    về mất khả năng nhập lại.

       Chỗ này trước đây dùng bamDong mà nhãn lại ghi 'fnv1a32', nên nó TRÔNG như
       đang được bảo vệ. Hậu quả thật: lần đổi bamDong sang 64 bit làm mọi tệp
       sao lưu cũ trượt kiểm tra và nhap() từ chối chúng — chủ xưởng mất đường
       phục hồi từ chính bản sao mình đã cẩn thận tải về.

       Dùng fnv1a(jsonChuan(x)) ở đây khôi phục đúng công thức của bamDong cũ,
       nên tệp cũ hợp lệ trở lại, và từ nay đổi bamDong không chạm tới tệp nữa. */
    var maTep=function(x){ return fnv1a(jsonChuan(x)); };
    var maBang={};
    Object.keys(ra.bang).forEach(function(b){ maBang[b]=maTep(ra.bang[b]); });
    ra.kiemTra={ thuatToan:'fnv1a32', ma:maTep(ra.bang), maBang:maBang,
                 soDong:ra.soDong, tong:ra.tong };
    return ra;
  });
};

CSDL.prototype.xuatChuoi = function(tuyChon){
  return this.xuat(tuyChon).then(function(r){ return JSON.stringify(r); });
};

/* Kiểm tra toàn vẹn tệp sao lưu TRƯỚC khi nhập */
function kiemTraTep(tep){
  var loi=[], canh=[];
  if(!tep || typeof tep!=='object') return {hopLe:false, loi:['Không phải JSON đối tượng']};
  if(tep.ungDung!=='ironspace') loi.push('Không phải tệp IronSpace (ungDung='+tep.ungDung+')');
  if(!tep.bang||typeof tep.bang!=='object') loi.push('Thiếu phần bang');
  if(tep.phienBan>PHIEN_BAN) loi.push('Tệp ở phiên bản '+tep.phienBan+', app này chỉ đọc tới '+PHIEN_BAN);
  if(!loi.length && tep.kiemTra){
    /* Phải dùng ĐÚNG hàm mà xuat() dùng — fnv1a, không phải bamDong. Xem chú
       thích dài ở xuat(). */
    var maTep=function(x){ return fnv1a(jsonChuan(x)); };
    var ma=maTep(tep.bang);
    if(ma!==tep.kiemTra.ma) loi.push('Tổng kiểm tra không khớp: tệp ghi '+tep.kiemTra.ma+', tính lại được '+ma);
    if(tep.kiemTra.maBang) Object.keys(tep.kiemTra.maBang).forEach(function(b){
      if(!tep.bang[b]) { canh.push('Tệp có mã kiểm tra cho bảng '+b+' nhưng không có dữ liệu'); return; }
      var m=maTep(tep.bang[b]);
      if(m!==tep.kiemTra.maBang[b]) loi.push('Bảng '+b+' sai tổng kiểm tra');
    });
    var tong=0; Object.keys(tep.bang).forEach(function(b){ tong+=tep.bang[b].length; });
    if(tep.kiemTra.tong!=null && tep.kiemTra.tong!==tong)
      loi.push('Số dòng không khớp: tệp ghi '+tep.kiemTra.tong+', đếm được '+tong);
  } else if(!loi.length){
    canh.push('Tệp không có phần kiemTra, không kiểm tra được toàn vẹn');
  }
  return {hopLe:loi.length===0, loi:loi, canhBao:canh};
}

/* cach: 'ghiDe' (xoá sạch rồi nạp) | 'tron' (gộp, mới hơn thắng) */
CSDL.prototype.nhap = function(tep, tuyChon){
  var self=this; tuyChon=tuyChon||{};
  if(typeof tep==='string'){ try{ tep=JSON.parse(tep); }catch(e){ return Promise.reject(new Error('JSON không đọc được: '+e.message)); } }
  var kt=kiemTraTep(tep);
  if(!kt.hopLe && !tuyChon.boQuaKiemTra) return Promise.reject(new Error('Tệp không hợp lệ: '+kt.loi.join('; ')));
  var cach = tuyChon.cach || 'ghiDe';
  var bangs = Object.keys(tep.bang).filter(function(b){ return !!LUOC_DO[b]; });
  var bc={cach:cach, kiemTra:kt, nhanDuoc:0, themMoi:0, capNhat:0, boQua:0, loi:[]};

  var p=Promise.resolve();
  /* sao lưu trạng thái hiện tại trước khi ghi đè — vẫn có đường lùi */
  if(cach==='ghiDe' && tuyChon.saoLuuTruoc!==false){
    p=p.then(function(){
      return self.xuatChuoi().then(function(s){
        var tx=self._tx('lui','readwrite');
        tx.objectStore('lui').add({luc:nay(),tu:PHIEN_BAN,den:PHIEN_BAN,may:self.may,
          byte:s.length,bam:fnv1a(s),du:s,ghi:'trước khi nhập tệp'});
        return xongGD(tx);
      });
    });
  }

  self.ghiNhatKy=false;
  bangs.forEach(function(b){
    p=p.then(function(){
      var ds=tep.bang[b]||[];
      bc.nhanDuoc+=ds.length;
      return self.gd([b],'readwrite',function(api){
        var kho=api.kho(b), d=LUOC_DO[b], chuoi=Promise.resolve();
        if(cach==='ghiDe') chuoi=chuoi.then(function(){ return yc(kho.clear()); });
        ds.forEach(function(dong){
          chuoi=chuoi.then(function(){
            var o={}, k;
            for(k in dong) o[k]=dong[k];
            /* khôi phục Blob */
            for(k in o) if(o[k] && o[k].__blob) o[k]=ghiSangBlob(o[k]);
            if(cach==='ghiDe'){
              if(d.tang) delete o[d.khoa];
              return yc(kho.put(self._chuan(b,o))).then(function(){ bc.themMoi++; },
                function(e){ bc.loi.push(b+': '+e.message); bc.boQua++; });
            }
            /* --- trộn --- */
            if(BANG_THEM.indexOf(b)>=0 && d.tang){
              /* bảng chỉ thêm: chống trùng bằng băm nội dung */
              var bamMoi = o.bam || bamDong(o);
              var daCo=false;
              return new Promise(function(ok){
                var idx; try{ idx=kho.index('bam'); }catch(e){ return ok(false); }
                var r=idx.get(bamMoi);
                r.onsuccess=function(){ ok(!!r.result); };
                r.onerror=function(){ ok(false); };
              }).then(function(co2){
                if(co2){ bc.boQua++; return; }
                delete o[d.khoa];
                o.bam=bamMoi;
                return yc(kho.put(self._chuan(b,o))).then(function(){ bc.themMoi++; });
              });
            }
            var khoaGT=o[d.khoa];
            if(khoaGT==null){ bc.boQua++; return; }
            return yc(kho.get(khoaGT)).then(function(cu){
              if(!cu){ return yc(kho.put(self._chuan(b,o))).then(function(){ bc.themMoi++; }); }
              var sMoi=so(o.suaLuc,0), sCu=so(cu.suaLuc,0);
              if(sMoi>sCu){ return yc(kho.put(self._chuan(b,o))).then(function(){ bc.capNhat++; }); }
              bc.boQua++;
            });
          });
        });
        return chuoi;
      });
    });
  });

  return p.then(function(){
    self.ghiNhatKy=true;
    return self.datMeta('nhap.lanCuoi',{luc:nay(),cach:cach,tuMay:tep.may,bc:{
      nhanDuoc:bc.nhanDuoc,themMoi:bc.themMoi,capNhat:bc.capNhat,boQua:bc.boQua}});
  }).then(function(){ return bc; },
     function(e){ self.ghiNhatKy=true; throw e; });
};

/* ---------- kiểm tra toàn vẹn CSDL đang chạy ---------- */
CSDL.prototype.kiemTraToanVen = function(){
  var self=this, bc={loi:[], canhBao:[], soDong:{}};
  var khId={}, donId={}, vtId={};
  return self.duyet('kh',{keHienXoa:true}).then(function(ds){
    ds.forEach(function(k){ khId[k.id]=1; }); bc.soDong.kh=ds.length;
    return self.duyet('don',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.don=ds.length;
    ds.forEach(function(o){
      donId[o.id]=1;
      if(!o.khId || !khId[o.khId]) bc.loi.push('don '+o.id+' trỏ tới khách không có: "'+(o.khId||o.khTen)+'"');
      if(o.con !== Math.max(0,o.ban-o.thu)) bc.loi.push('don '+o.id+' cột con sai');
      if(o.thu>o.ban) bc.canhBao.push('don '+o.id+' đã thu nhiều hơn giá bán');
      if(o.von>o.ban) bc.canhBao.push('don '+o.id+' vốn cao hơn giá bán');
    });
    return self.duyet('vt',{keHienXoa:true});
  }).then(function(ds){
    ds.forEach(function(v){ vtId[v.id]=1; }); bc.soDong.vt=ds.length;
    return self.duyet('bg',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.bg=ds.length;
    ds.forEach(function(q){
      if(q.khId && !khId[q.khId]) bc.loi.push('bg '+q.id+' trỏ tới khách không có');
      if(q.donId && !donId[q.donId]) bc.loi.push('bg '+q.id+' trỏ tới đơn không có: '+q.donId);
    });
    return self.duyet('tin',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.tin=ds.length;
    ds.forEach(function(m){ if(m.khId && !khId[m.khId]) bc.loi.push('tin '+m.n+' trỏ tới khách không có'); });
    return self.duyet('chi',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.chi=ds.length;
    ds.forEach(function(c){ if(c.donId && !donId[c.donId]) bc.canhBao.push('chi '+c.n+' trỏ tới đơn không có: '+c.donId); });
    return self.duyet('phoi',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.phoi=ds.length;
    ds.forEach(function(f){ if(f.tuDon && !donId[f.tuDon]) bc.canhBao.push('phoi '+f.n+' trỏ tới đơn không có: '+f.tuDon); });
    return self.duyet('buoc',{keHienXoa:true});
  }).then(function(ds){
    bc.soDong.buoc=ds.length;
    ds.forEach(function(b){ if(!donId[b.donId]) bc.canhBao.push('buoc '+b.n+' trỏ tới đơn không có: '+b.donId); });
    bc.sach = bc.loi.length===0;
    return bc;
  });
};

/* ---------- ảnh: hạn giữ và dọn ảnh hết hạn ---------- */
/* hetHan = mốc chụp + số tháng chủ xưởng chọn ở màn Cài đặt (S.baoHanh).
   0 nghĩa là giữ mãi, và cột hetHan=0 bị bỏ ngoài chỉ mục nên không bị dọn. */
function hanXoaAnh(luc, thangGiu){
  var t=nguyen(thangGiu,0), l=nguyen(luc);
  if(!l || t<=0) return 0;
  var d=new Date(l);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+t, d.getUTCDate(),
                  d.getUTCHours(), d.getUTCMinutes());
}

/* Xoá hẳn ảnh đã hết hạn giữ. Xoá cứng vì mục đích là trả lại dung lượng;
   dòng buoc và mốc thời gian của bước thì vẫn còn, chỉ mất tấm ảnh. */
CSDL.prototype.donAnhHetHan = function(tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var moc = tuyChon.moc==null ? nay() : tuyChon.moc;
  return self.duyet('anh',{chiMuc:'hetHan',bang:[1,moc],keHienXoa:true}).then(function(ds){
    if(!ds.length) return {soAnh:0, byte:0, id:[]};
    var byte=0, id=[];
    ds.forEach(function(a){ byte += nguyen(a.byte) || (a.du&&a.du.size) || 0; id.push(a.id); });
    return self.gd(['anh'],'readwrite',function(api){
      var chuoi=Promise.resolve();
      id.forEach(function(x){
        chuoi=chuoi.then(function(){
          api.nhatKy('anh',x,'xoaAnhHetHan',null,null);
          return yc(api.kho('anh').delete(x));
        });
      });
      return chuoi;
    }).then(function(){ return {soAnh:id.length, byte:byte, id:id}; });
  });
};

/* ================== 9. DUNG LƯỢNG ================== */

function doLocalStorage(){
  var ky=0, gt=0, i, k;
  try{
    for(i=0;i<G.localStorage.length;i++){
      k=G.localStorage.key(i); ky+=k.length;
      gt+=(G.localStorage.getItem(k)||'').length;
    }
  }catch(e){ return null; }
  return {soKhoa:G.localStorage.length, kyTu:ky+gt, uocByte:(ky+gt)*2};
}

CSDL.prototype.dungLuong = function(tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var ra={nguon:'navigator.storage.estimate', hanMuc:null, daDung:null, conLai:null,
          phanTram:null, localStorage:doLocalStorage(),
          tranLocalStorage:{kyTuDoDuoc:5177344, ghi:'đo bằng cách ghi từng khối 64 Ki ký tự tới khi QuotaExceededError'}};
  var p;
  if(G.navigator && G.navigator.storage && G.navigator.storage.estimate){
    p=G.navigator.storage.estimate().then(function(e){
      ra.hanMuc=e.quota; ra.daDung=e.usage;
      ra.conLai=(e.quota!=null&&e.usage!=null)?e.quota-e.usage:null;
      ra.phanTram=(e.quota?+(e.usage/e.quota*100).toFixed(3):null);
      if(e.usageDetails) ra.chiTietHeThong=e.usageDetails;
    }, function(err){ ra.nguon='không đọc được estimate: '+err.message; });
  } else { ra.nguon='trình duyệt không có storage.estimate'; p=Promise.resolve(); }

  return p.then(function(){
    if(!tuyChon.chiTiet) return ra;
    /* đo thật từng bảng bằng cách tuần tự hoá — chậm, chỉ gọi khi cần */
    var bangs=BANG_DU_LIEU.concat(['nk','lui']);
    var q=Promise.resolve(); ra.theoBang={}; ra.byteDuLieu=0;
    bangs.forEach(function(b){
      q=q.then(function(){
        return self.duyet(b,{keHienXoa:true}).then(function(ds){
          var byteAnh=0;
          ds.forEach(function(d){ var k; for(k in d) if(d[k]&&typeof Blob!=='undefined'&&d[k] instanceof Blob) byteAnh+=d[k].size; });
          var s=0;
          try{ s=JSON.stringify(ds.map(function(d){ var o={},k;
            for(k in d) if(!(d[k]&&typeof Blob!=='undefined'&&d[k] instanceof Blob)) o[k]=d[k];
            return o; })).length; }catch(e){}
          ra.theoBang[b]={soDong:ds.length, byteJSON:s, byteAnh:byteAnh,
                          byteMoiDong: ds.length?Math.round((s+byteAnh)/ds.length):0};
          ra.byteDuLieu+=s+byteAnh;
        });
      });
    });
    return q.then(function(){
      var d=ra.theoBang.don;
      if(d && d.byteMoiDong>0 && ra.conLai!=null)
        ra.uocSoDonConNhet=Math.floor(ra.conLai/Math.max(1,d.byteMoiDong));
      return ra;
    });
  });
};

/* ================== 10. CẦU NỐI VỚI app7 (S/HM/VT/TN/AU) ================== */
/* Để ghép vào app mà không phải viết lại giao diện:
     nap()  ->  await db.napVaoS(S,HM,VT,TN,AU)
     luu()  ->  db.ghiTuS(S,HM,VT,TN,AU)      (có gộp nhịp, không chặn luồng) */

/* ---- GHI CẢ KHỐI S XUỐNG MỌI BẢNG NGHIỆP VỤ ----
   Đối xứng với napVaoS. Dùng đúng phép ánh xạ của hàm di trú (anhXaS), nên hai
   đường không bao giờ lệch nhau. Quy tắc:
     · ghép dòng mới với dòng đã có bằng khoá tự nhiên (mã đơn, mã khách,
       [donId+buoc], hoặc băm nội dung với bảng chỉ thêm) — KHÔNG xoá rồi ghi lại,
       nên taoLuc và nhật ký nk của dòng cũ còn nguyên;
     · dòng không đổi thì bỏ qua, không ghi, không sinh nhật ký;
     · dòng biến khỏi S thì đánh dấu xoa=1, không xoá cứng;
     · bảng "anh" không bị chạm tới: khối S không mang byte ảnh;
     · tất cả nằm trong MỘT giao dịch, hoặc xong hết hoặc không đổi gì.
   Tuỳ chọn:
     moc            mốc quy đổi số ngày/tuần tương đối trong S ra dấu thời gian
                    thật. Mặc định Date.now(). Đường di trú truyền MOC_MAC_DINH.
     khongXoaThieu  không coi S là nguồn chân lý để xoá (đường di trú dùng).
     choPhepXoaHet  cho phép xoá mềm cả bảng khi S rỗng (mặc định KHÔNG, xem rào
                    an toàn bên dưới).
     chiTiet        trả thêm bc.themKhoa liệt kê dòng vừa thêm, để soi khi nghi
                    có dòng bị nhân đôi.
   Trả về {them,sua,xoaMem,giuNguyen,loi,canhBao,msAnhXa,msTong} — số theo bảng. */
CSDL.prototype.ghiHetTuS = function(S,HM,VT,TN,AU,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var moc = tuyChon.moc || nay();
  var bc = {them:{}, sua:{}, xoaMem:{}, giuNguyen:{}, loi:[], canhBao:[], msAnhXa:0, msTong:0};
  var t0 = dongHo();

  function demLen(o,b){ o[b]=(o[b]||0)+1; }

  /* gộp hai dòng: giữ danh tính và lịch sử của dòng cũ, lấy nội dung của dòng mới */
  function gopDong(b,cu,moi,ynghia){
    var o={}, k;
    for(k in cu) o[k]=cu[k];
    for(k in moi) if(k!=='taoLuc' && k!=='suaLuc' && k!=='xoa') o[k]=moi[k];
    o.taoLuc = cu.taoLuc;
    o.xoa = 0;                       /* còn trong S nghĩa là còn sống */
    (GIU_CUA_CU[b]||[]).forEach(function(c){ if(c in cu) o[c]=cu[c]; });
    /* S chỉ mang nghĩa tương đối (còn mấy ngày, mấy tuần trước). Nếu mốc tuyệt
       đối cũ vẫn ra đúng nghĩa đó thì giữ nguyên, để ghi lại nhiều lần không
       làm ngày tháng trôi dần. */
    if(b==='don'){
      /* Đơn đã có sổ thu (thuGoc khác null) thì SỔ là nguồn chân lý của số đã
         thu, khối S không được ghi đè. Nhờ vậy dời từng chỗ sang ghiThu được:
         chỗ nào đã dời thì sổ cầm, chỗ chưa dời thì S vẫn cầm như cũ. */
      if(cu.thuGoc!=null){ o.thu=cu.thu; o.thuGoc=cu.thuGoc; }
      if(ynghia.han!=null && cu.hanNgay>0 &&
         Math.round((cu.hanNgay-moc)/NGAY)===ynghia.han) o.hanNgay=cu.hanNgay;
      if(ynghia.tuan!=null && cu.xongLuc>0 &&
         Math.round((moc-cu.xongLuc)/(7*NGAY))===ynghia.tuan) o.xongLuc=cu.xongLuc;
    }
    if(b==='bg' && ynghia.con!=null && cu.hetHan>0 &&
       Math.round((cu.hetHan-moc)/NGAY)===ynghia.con) o.hetHan=cu.hetHan;
    return self._chuan(b,o);
  }

  return self.gd(BANG_TU_S,'readwrite',function(api){
    /* 1. đọc bảng kh trước, để khách cũ giữ nguyên id thay vì được cấp id mới */
    return new Promise(function(ok,loi){
      var m={}, r=api.kho('kh').openCursor();
      r.onsuccess=function(){ var c=r.result;
        if(!c) return ok(m);
        if(c.value.ten) m[c.value.ten]=c.value.id;
        c.continue(); };
      r.onerror=function(){ loi(r.error); };
    }).then(function(tenToiId){
      var tA=dongHo();
      var ax = anhXaS(S,HM,VT,TN,AU,{moc:moc, tenToiId:tenToiId});
      bc.msAnhXa = dongHo()-tA;
      bc.doiMa = ax.doiMa;

      var chuoi=Promise.resolve();
      BANG_TU_S.forEach(function(b){
        chuoi=chuoi.then(function(){ return apDungBang(api,b,ax.dong[b]||[]); });
      });
      return chuoi.then(function(){
        /* một dòng nhật ký tóm tắt cho mỗi lần ghi có đổi thật — không ghi nhật
           ký từng dòng, vì hàm này chạy sau mỗi lần vẽ màn hình */
        var coDoi = Object.keys(bc.them).length || Object.keys(bc.sua).length
                 || Object.keys(bc.xoaMem).length;
        if(coDoi) api.nhatKy('*','','ghiHetTuS',null,
          {them:bc.them, sua:bc.sua, xoaMem:bc.xoaMem});
      });
    });

    function apDungBang(api,b,moiDS){
      var d=LUOC_DO[b];
      var theoKhoa={}, theoLong={}, daCo=[];
      return new Promise(function(ok,loi){
        var r=api.kho(b).openCursor();
        r.onsuccess=function(){ var c=r.result;
          if(!c) return ok();
          var v=c.value;
          theoKhoa[khoaTuNhien(b,v)]=v;
          /* DANH SÁCH, không phải một dòng. Giữ một dòng thì hai dòng cũ cùng
             khoá lỏng chỉ ghép được một, dòng còn lại thành mồ côi và sinh ra
             một dòng nhân đôi. Đo được: 2 dòng cũ + 2 lần trả mới cùng phút ra
             3 dòng. Ghép một-một thật thì phải xếp hàng cả hai. */
          var kl=khoaLong(b,v); if(kl){ (theoLong[kl]=theoLong[kl]||[]).push(v); }
          daCo.push(v);
          c.continue(); };
        r.onerror=function(){ loi(r.error); };
      }).then(function(){
        var dung={}, chuoi=Promise.resolve();
        moiDS.forEach(function(o0){
          chuoi=chuoi.then(function(){
            var ynghia={han:o0._hanTuongDoi, tuan:o0._tuanTruoc, con:o0._conTuongDoi};
            var o=self._chuan(b,o0);          /* _chuan xoá các cột "_" */
            var kt=khoaTuNhien(b,o);
            var cu=theoKhoa[kt];
            if(!cu){ var kl=khoaLong(b,o);
                     if(kl && theoLong[kl] && theoLong[kl].length) cu=theoLong[kl][0]; }
            /* MỘT DÒNG CŨ CHỈ ĐƯỢC GHÉP MỘT LẦN. Thiếu hai dòng dưới thì hai dòng
               mới cùng khoá lỏng đều ghép vào CÙNG một dòng cũ, và lần put sau đè
               lần put trước — mất hẳn một dòng.

               Đo được: 1 dòng thuLog cũ mang băm 8 ký tự + 2 lần khách trả thật
               500.000 đ trong cùng một phút => còn 1 dòng, tổng 500.000 đ. MẤT
               500.000 đ, không lỗi, không cảnh báo. Ba lần trả thì mất 1.000.000 đ.

               Điều kiện nổ là khoá băm trượt, tức ĐÚNG lúc công thức băm đổi —
               nên nó nổ trên mọi máy xưởng trong cửa sổ nâng cấp băm 32 lên 64
               bit. Lỗi này có từ trước với chi/tin/phoi; thêm khoá lỏng cho
               thuLog và nhac làm nó chạm tới sổ tiền. */
            if(cu){
              delete theoKhoa[khoaTuNhien(b,cu)];
              var klCu=khoaLong(b,cu);
              if(klCu && theoLong[klCu]){
                var vt=theoLong[klCu].indexOf(cu);
                if(vt>=0) theoLong[klCu].splice(vt,1);
              }
            }
            if(cu){
              dung[cu[d.khoa]]=1;
              var tron=gopDong(b,cu,o,ynghia);
              if(giongNhau(cu,tron)){ demLen(bc.giuNguyen,b); return; }
              tron.suaLuc=nay();
              demLen(bc.sua,b);
              return ycMem(api.kho(b).put(tron)).then(function(r){
                if(!r.ok){ bc.sua[b]--; bc.loi.push(b+' sửa '+cu[d.khoa]+': '+r.loi); }
              });
            }
            if(d.tang) delete o[d.khoa];
            demLen(bc.them,b);
            if(tuyChon.chiTiet){ (bc.themKhoa=bc.themKhoa||[]).push(b+' '+kt+' '+jsonChuan(o).slice(0,200)); }
            return ycMem(api.kho(b).put(o)).then(function(r){
              if(!r.ok){ bc.them[b]--; bc.loi.push(b+' thêm: '+r.loi); }
            });
          });
        });
        /* RÀO AN TOÀN: khối S không có dòng nào cho bảng này mà CSDL thì có,
           thì gần như chắc chắn S đang dở (gọi trước napVaoS, nạp lỗi, màn
           đăng nhập chưa xong) chứ không phải chủ xưởng vừa xoá sạch đơn hàng.
           Không xoá mềm cả bảng; ghi lại cảnh báo để bên gọi biết. */
        if(S_QUYET_XOA[b] && !tuyChon.khongXoaThieu && !moiDS.length && daCo.length){
          bc.canhBao.push('bảng '+b+': khối S rỗng nhưng CSDL có '+daCo.length+
            ' dòng — không xoá gì cả. Truyền {choPhepXoaHet:true} nếu thật sự muốn xoá.');
          if(!tuyChon.choPhepXoaHet) return chuoi;
        }
        if(S_QUYET_XOA[b] && !tuyChon.khongXoaThieu) daCo.forEach(function(v){
          chuoi=chuoi.then(function(){
            if(dung[v[d.khoa]] || v.xoa===1) return;
            var x={}, k; for(k in v) x[k]=v[k];
            x.xoa=1; x.suaLuc=nay();
            demLen(bc.xoaMem,b);
            return ycMem(api.kho(b).put(x)).then(function(r){
              if(!r.ok){ bc.xoaMem[b]--; bc.loi.push(b+' xoá mềm '+v[d.khoa]+': '+r.loi); }
            });
          });
        });
        return chuoi;
      });
    }
  }).then(function(){
    bc.msTong = dongHo()-t0;
    return bc;
  });
};

/* ================== GHI TỪNG DÒNG ==================
   Mọi phương thức bắt đầu bằng "ghi" đều cùng một hợp đồng:
     · gọi được thẳng trong handler onclick, trả về ngay (phần đồng bộ ~0 ms);
     · KHÔNG BAO GIỜ ném lỗi và KHÔNG BAO GIỜ reject — thất bại thì resolve với
       {khongGhiDuoc:true, loi:[...]} và đặt db.loiGhiCuoi;
     · xếp hàng, chạy lần lượt, nên bấm nhanh mấy cái liền không đụng nhau;
     · mất kết nối thì tự moLai() rồi thử lại đúng một lần.
   Không cần await. Muốn hiện toast "chưa lưu được" thì đọc db.loiGhiCuoi. */
CSDL.prototype._xepGhi = function(ten, fn){
  var self=this;
  self._hang = self._hang || [];
  var giai;
  var hua = new Promise(function(ok){ giai=ok; });
  self._hang.push({ten:ten, fn:fn, giai:giai});
  self._xaHang();
  return hua;
};
CSDL.prototype._xaHang = function(){
  var self=this;
  if(self._dangXa) return;
  self._dangXa = true;
  function tiep(){
    var viec = self._hang.shift();
    if(!viec){ self._dangXa=false; return; }
    Promise.resolve()
      .then(function(){ return self.dong ? self.moLai() : null; })
      .then(function(){ return viec.fn(); })
      .catch(function(e1){
        return self.moLai().then(function(){ return viec.fn(); })
          .catch(function(e2){
            self.loiGhiCuoi = {luc:nay(), viec:viec.ten,
              loi:String(e2&&e2.message||e2), truocDo:String(e1&&e1.message||e1)};
            return {khongGhiDuoc:true, viec:viec.ten, loi:[self.loiGhiCuoi.loi]};
          });
      })
      .then(function(kq){ try{ viec.giai(kq); }catch(e){} tiep(); });
  }
  tiep();
};

/* --- thu tiền: ghi sổ VÀ cập nhật đơn trong cùng một giao dịch ---
   don.thu được tính lại = thuGoc + tổng sổ thu, nên sổ là nguồn chân lý.
   thuGoc là số đã thu trước khi có sổ (đơn di trú từ v8), đặt một lần ở dòng
   thu đầu tiên và từ đó không đổi — nhờ vậy không mất tiền của đơn cũ. */
CSDL.prototype.ghiThu = function(d){
  var self=this; d=d||{};
  return self._xepGhi('ghiThu', function(){
    return self.gd(['thuLog','don'],'readwrite', function(api){
      var donId=String(d.donId||'');
      return (donId ? api.lay('don',donId) : Promise.resolve(null)).then(function(o){
        var dong={ donId:donId, khId: d.khId || (o&&o.khId) || '',
          tien:nguyen(d.tien), luc: d.luc==null?nay():nguyen(d.luc),
          cach:d.cach||'khac', ghi:d.ghi||'' };
        if(dong.tien<=0) return {loi:['số tiền phải lớn hơn 0'], khongGhiDuoc:true};
        return api.them('thuLog',dong).then(function(n){
          if(!o) return {n:n, con:null, thu:null};
          /* cộng lại từ sổ, không cộng dồn vào số cũ */
          var tong=0;
          return new Promise(function(ok,loi){
            var r=api.kho('thuLog').index('donId').openCursor(IDBKeyRange.only(donId));
            r.onsuccess=function(){ var c=r.result;
              if(!c) return ok();
              if(c.value.xoa!==1) tong+=nguyen(c.value.tien);
              c.continue(); };
            r.onerror=function(){ loi(r.error); };
          }).then(function(){
            /* o.thu đọc TRƯỚC khi chèn dòng sổ, nên nó đúng là số đã thu từ
               thời chưa có sổ. Đặt một lần rồi không đổi nữa. */
            var goc = (o.thuGoc==null) ? nguyen(o.thu) : nguyen(o.thuGoc);
            if(goc<0) goc=0;
            var moi={}, k; for(k in o) moi[k]=o[k];
            moi.thuGoc=goc; moi.thu=goc+tong; moi.suaLuc=nay();
            api.nhatKy('don',donId,'thuTien',{thu:o.thu},{thu:moi.thu,tien:dong.tien});
            return api.datVao('don',moi).then(function(){
              return {n:n, thu:moi.thu, con:Math.max(0,nguyen(moi.ban)-moi.thu), tongSo:tong};
            });
          });
        });
      });
    });
  });
};

/* --- nhắc nợ: ghi lại đã nhắc, bậc nào, qua kênh nào ---
   Không truyền bac thì tự tính từ hạn của đơn bằng bacNhac(), đúng cách chia
   bậc của hàm tang() trong app. */
CSDL.prototype.ghiNhac = function(d){
  var self=this; d=d||{};
  return self._xepGhi('ghiNhac', function(){
    return self.gd(['nhac','don'],'readwrite', function(api){
      var donId=String(d.donId||'');
      return (donId ? api.lay('don',donId) : Promise.resolve(null)).then(function(o){
        var luc = d.luc==null?nay():nguyen(d.luc);
        var bac = d.bac;
        if(bac==null){
          var qh = (o && o.hanNgay>0) ? Math.floor((luc-o.hanNgay)/NGAY) : 0;
          bac = bacNhac(qh);
        }
        return api.them('nhac',{ donId:donId, khId: d.khId || (o&&o.khId) || '',
          luc:luc, bac:nguyen(bac), kenh:d.kenh||'zalo' })
          .then(function(n){ return {n:n, bac:nguyen(bac), ten:BAC_NHAC[nguyen(bac)]||''}; });
      });
    });
  });
};

/* --- thợ báo xong một bước: ghi bước VÀ đẩy chặng của đơn, một giao dịch --- */
CSDL.prototype.ghiXongBuoc = function(donId, d){
  var self=this; d=d||{};
  return self._xepGhi('ghiXongBuoc', function(){
    return self.gd(['buoc','don'],'readwrite', function(api){
      return api.lay('don',String(donId)).then(function(o){
        if(!o) return {khongGhiDuoc:true, loi:['không thấy đơn '+donId]};
        var bi = d.buoc==null ? nguyen(o.cd) : nguyen(d.buoc);
        var luc = d.luc==null?nay():nguyen(d.luc);
        return api.themMem('buoc',{ donId:String(donId), buoc:bi,
            tenBuoc: d.tenBuoc || CD[bi] || '', luc:luc,
            thoId:d.thoId||'', anhId:d.anhId||'' })
          .then(function(r){
            if(d.buoc!=null && nguyen(d.buoc)<nguyen(o.cd)) return {n:r.kq, cd:o.cd};
            var moi={}, k; for(k in o) moi[k]=o[k];
            moi.cd = Math.min(5, nguyen(o.cd)+1);
            if(moi.cd>=5 && !moi.xongLuc) moi.xongLuc=luc;
            moi.suaLuc=nay();
            api.nhatKy('don',String(donId),'xongBuoc',{cd:o.cd},{cd:moi.cd,buoc:bi});
            return api.datVao('don',moi).then(function(){
              return {n:r.kq, cd:moi.cd, tenBuoc:CD[bi]||'', daGhiBuoc:r.ok}; });
          });
      });
    });
  });
};

/* --- ảnh thật: nhận Blob, tự tính hạn giữ theo số tháng chủ xưởng chọn --- */
CSDL.prototype.ghiAnh = function(d){
  var self=this; d=d||{};
  return self._xepGhi('ghiAnh', function(){
    var luc = d.luc==null?nay():nguyen(d.luc);
    var p = d.thangGiu!=null ? Promise.resolve(d.thangGiu) : self.layCai('baoHanh',12);
    return p.then(function(thang){
      /* khoá chính là donId|chỉ số bước, đúng cách app đang đặt: chụp lại một
         bước thì thay tấm cũ, mỗi bước giữ đúng một ảnh */
      var id = d.id || (String(d.donId||'')+'|'+nguyen(d.buoc));
      var bl = d.du;
      return self.datVao('anh',{ id:id, donId:String(d.donId||''), buoc:nguyen(d.buoc),
        kieu: d.kieu || (bl&&bl.type) || 'image/jpeg',
        byte: nguyen(d.byte) || (bl&&bl.size) || 0,
        rong:nguyen(d.rong), cao:nguyen(d.cao),
        du: bl, luc:luc, hetHan: hanXoaAnh(luc, thang),
        thoId:d.thoId||'', ghi:d.ghi||'' })
        .then(function(){ return {id:id, byte:(bl&&bl.size)||0,
          hetHan:hanXoaAnh(luc,thang), thangGiu:nguyen(thang)}; });
    });
  });
};

/* --- khách mới / đơn mới: tự sinh khoá, không trùng kể cả giữa hai máy --- */
