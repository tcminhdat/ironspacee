/* ---- Đường ghi dùng ở cuối ve(): gộp nhịp, ghi cả khối ----
   Phần đồng bộ chỉ là gán tham chiếu và hẹn giờ, nên không chặn luồng vẽ.
   Nhiều lần bấm liên tiếp dồn thành một lần ghi. */
CSDL.prototype.ghiTuS = function(S,HM,VT,TN,AU,tuyChon){
  var self=this; tuyChon=tuyChon||{};
  var tre = tuyChon.tre==null?250:tuyChon.tre;
  self._cho = {S:S,HM:HM,VT:VT,TN:TN,AU:AU,tuyChon:tuyChon};

  if(self._dangGhi){ self._lai=true; return self._huaGhi||Promise.resolve(); }
  if(self._hen) return self._hua||Promise.resolve();

  self._hua = new Promise(function(ok,loi){
    self._hen = setTimeout(function(){
      self._hen=null;
      self._dangGhi=true;
      var c=self._cho;
      function ghiMot(){
        return (c.tuyChon && c.tuyChon.chiCai)
          ? self._ghiNgay(c.S,c.HM,c.VT,c.TN,c.AU)
          : self.ghiHetTuS(c.S,c.HM,c.VT,c.TN,c.AU,c.tuyChon);
      }
      self._huaGhi = Promise.resolve()
        .then(function(){ return self.dong ? self.moLai() : null; })
        .then(ghiMot)
        .catch(function(e1){
          /* mất kết nối giữa đường: mở lại một lần rồi thử lại đúng một lần */
          return self.moLai().then(ghiMot).catch(function(e2){
            self.loiGhiCuoi = {luc:nay(), loi:String(e2&&e2.message||e2),
                               truocDo:String(e1&&e1.message||e1)};
            return {loi:[self.loiGhiCuoi.loi], them:{}, sua:{}, xoaMem:{}, giuNguyen:{},
                    msAnhXa:0, msTong:0, khongGhiDuoc:true};
          });
        });
      self._huaGhi.then(function(bc){
        self._dangGhi=false;
        if(self._lai && !bc.khongGhiDuoc){ self._lai=false;
          var d=self._cho;
          return self.ghiTuS(d.S,d.HM,d.VT,d.TN,d.AU,{tre:0}).then(function(){ return bc; });
        }
        self._lai=false;
        return bc;
      }).then(ok, function(e){
        /* hợp đồng của ghiTuS: gọi từ cuối ve() nên KHÔNG BAO GIỜ nổ ra ngoài */
        self._dangGhi=false; self._lai=false;
        self.loiGhiCuoi = {luc:nay(), loi:String(e&&e.message||e)};
        ok({loi:[self.loiGhiCuoi.loi], khongGhiDuoc:true});
      });
    }, tre);
  });
  return self._hua;
};

/* Chỉ ghi bảng cài đặt. Nhanh hơn, nhưng KHÔNG lưu đơn/khách/tin —
   chỉ dùng khi biết chắc chỉ có cài đặt đổi. */
CSDL.prototype.ghiCaiTuS = function(S,HM,VT,TN,AU){
  return this._ghiNgay(S,HM,VT,TN,AU);
};

CSDL.prototype._ghiNgay = function(S,HM,VT,TN,AU){
  var self=this;
  return self.gd(['cai'],'readwrite',function(api){
    var cai={xuong:S.xuong, chu:S.chu, sdt:S.sdt, dinhMuc:S.dinhMuc,
      baoHanh:S.baoHanh, anhGiu:S.anhGiu, tbao:S.tbao, nhap:S.nhap,
      troNang:TN, boQuaDeXuat:S.bo, vaiHienTai:vaiLuuDuoc(S.vai), thoDon:S.thoDon, khBG:S.khBG,
      uiTab:S.tab, uiTuanXem:S.tuanXem};
    var chuoi=Promise.resolve();
    Object.keys(cai).forEach(function(k){
      if(cai[k]===undefined) return;
      chuoi=chuoi.then(function(){ return api.datVao('cai',{k:k,v:cai[k]}); });
    });
    return chuoi;
  });
};

CSDL.prototype.napVaoS = function(S,HM,VT,TN,AU){
  var self=this;
  return self.duyet('cai',{}).then(function(ds){
    var c={}; ds.forEach(function(r){ c[r.k]=r.v; });
    if(c.xuong!=null) S.xuong=c.xuong;
    if(c.chu!=null) S.chu=c.chu;
    if(c.sdt!=null) S.sdt=c.sdt;
    if(c.dinhMuc) S.dinhMuc=c.dinhMuc;
    if(c.baoHanh!=null) S.baoHanh=c.baoHanh;
    if(c.anhGiu) S.anhGiu=c.anhGiu;
    if(c.tbao) S.tbao=c.tbao;
    if(c.nhap) S.nhap=c.nhap;
    if(c.boQuaDeXuat) S.bo=c.boQuaDeXuat;
    if(c.vaiHienTai && c.vaiHienTai!=='khach') S.vai=c.vaiHienTai;
    if(c.thoDon) S.thoDon=c.thoDon;
    if(c.troNang&&TN) { var k; for(k in c.troNang) TN[k]=c.troNang[k]; }
    return self.duyet('vt',{});
  }).then(function(ds){
    if(VT && ds.length){ VT.length=0; ds.forEach(function(v){ VT.push(v); }); }
    return self.duyet('hm',{chiMuc:'thuTu'});
  }).then(function(ds){
    if(HM && ds.length){ HM.length=0; ds.forEach(function(h){ HM.push(h.ten); }); }
    return self.duyet('kh',{chiMuc:'ten'});
  }).then(function(ds){
    S.kh = ds.map(function(k){ return {id:k.id, ten:k.ten, sdt:k.sdt||'chưa có số',
      lan:k.soLanCu||0, tu:k.tuNgay?thangNam(k.tuNgay):''}; });
    return self.duyet('don',{chiMuc:'khId_kho'});
  }).then(function(ds){
    var moc = nay();
    function raDon(o){
      return {id:o.id, kh:o.khTen, hang:o.hang, ban:o.ban, von:o.von, cd:o.cd,
              thu:o.thu, ct:!!o.ct,
              vtId:o.vtId||'', len:o.len||0, qty:o.qty||0, cay:o.cay||0,
              daTraPhoi:!!o.daTraPhoi,
              han: o.hanNgay? Math.round((o.hanNgay-moc)/NGAY) : null,
              tg: o.xongLuc? Math.max(0,Math.round((moc-o.xongLuc)/(7*NGAY))) : 0,
              khId:o.khId};
    }
    S.don   = ds.filter(function(o){return !o.kho;}).map(raDon);
    S.donCu = ds.filter(function(o){return !!o.kho;}).map(function(o){
      var r=raDon(o); r.w = Math.max(0, 5 - r.tg); return r; });
    return self.duyet('bg',{});
  }).then(function(ds){
    var moc=nay();
    S.bg = ds.map(function(q){ return {id:q.id, kh:q.khTen, hang:q.hang, vt:q.vtTen, vtId:q.vtId||'',
      qty:q.qty, len:q.len, cay:q.cay, ban:q.ban, von:q.von,
      ngay:ngayThang(q.ngay), con:q.hetHan?Math.round((q.hetHan-moc)/NGAY):0, tt:q.tt,
      don:q.donId||undefined, kg:q.kg, hao:q.hao}; });
    return self.duyet('tin',{chiMuc:'khId_luc'});
  }).then(function(ds){
    var T={};
    ds.forEach(function(m){
      var ten=m.khTen||m.khId;
      (T[ten]=T[ten]||[]).push({ai:m.ai, g:gioHoacNgayGio(m.luc),
        t:m.t||undefined, loai:m.loai==='text'?undefined:m.loai,
        ma:m.ma||undefined, hang:m.hang||undefined, cay:m.cay==null?undefined:m.cay,
        qty:m.qty==null?undefined:m.qty, len:m.len==null?undefined:m.len,
        tien:m.tien==null?undefined:m.tien,
        ok:m.ok==null?undefined:!!m.ok, tra:m.tra==null?undefined:!!m.tra});
    });
    S.tin=T;
    return self.duyet('chi',{chiMuc:'ngay',nguoc:true});
  }).then(function(ds){
    S.chi = ds.map(function(c){ return {ngay:ngayThang(c.ngay), mo:c.mo, tien:c.tien, don:c.donId}; });
    return self.duyet('phoi',{});
  }).then(function(ds){
    S.phoi = ds.map(function(f){ return {len:f.len, qty:f.qty, vt:f.vtId||'', tu:f.tuDon}; });
    return self.duyet('thuLog',{chiMuc:'luc',nguoc:true});
  }).then(function(ds){
    S.thuLog = ds.map(function(x){ return {donId:x.donId, khId:x.khId, tien:x.tien,
      luc:x.luc, cach:x.cach, ghi:x.ghi}; });
    return self.duyet('nhac',{chiMuc:'luc',nguoc:true});
  }).then(function(ds){
    S.nhac = ds.map(function(x){ return {donId:x.donId, khId:x.khId, luc:x.luc,
      bac:x.bac, kenh:x.kenh}; });
    return self.duyet('moi',{chiMuc:'luc',nguoc:true});
  }).then(function(ds){
    S.moi = ds.filter(function(m){return !m.xuLy;}).map(function(m){
      return {id:m.id, kh:m.khTen, gio:gioHoacNgayGio(m.luc), t:m.t, anh:!!m.coAnh}; });
    return self.duyet('buoc',{chiMuc:'donId'});
  }).then(function(ds){
    var A={};
    ds.sort(function(a,b){return a.buoc-b.buoc;}).forEach(function(b){
      (A[b.donId]=A[b.donId]||[]).push([b.tenBuoc||CD[b.buoc], ngayGio(b.luc), b.luc]);
    });
    S.anh=A;
    return self.duyet('tb',{});
  }).then(function(ds){
    S.tbDoc = ds.filter(function(t){return t.daDoc;}).map(function(t){return t.id;});
    return self.duyet('nd',{chiMuc:'vai'});
  }).then(function(ds){
    if(AU && ds.length){
      var u=ds[0];
      AU.sdt=u.sdt||''; AU.pinB=u.pinB||''; AU.dongy=!!u.dongy;
      AU.quyen=u.quyen||AU.quyen; AU.tho=!!u.tho;
    }
    return true;
  });
};

function p2(n){ return (n<10?'0':'')+n; }
function ngayThang(ms){ if(!ms) return ''; var d=new Date(ms); return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1); }
function thangNam(ms){ if(!ms) return ''; var d=new Date(ms); return p2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear(); }
function gioPhut(ms){ if(!ms) return ''; var d=new Date(ms); return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()); }
function ngayGio(ms){ if(!ms) return ''; return ngayThang(ms)+' '+gioPhut(ms); }
/* Tin trong ngày thì chỉ "09:02" như app7 vẫn hiện; tin cũ hơn thì kèm ngày,
   nếu không mỗi vòng nạp-ghi lại dồn hết tin về hôm nay. */
function cungNgay(a,b){ var x=new Date(a), y=new Date(b);
  return x.getUTCFullYear()===y.getUTCFullYear() && x.getUTCMonth()===y.getUTCMonth()
      && x.getUTCDate()===y.getUTCDate(); }
function gioHoacNgayGio(ms){ if(!ms) return '';
  return cungNgay(ms,nay()) ? gioPhut(ms) : ngayGio(ms); }

function pack(parts, barLen, kerf){
  const th=parts.filter(p=>p.qty>0);
  if(th.some(p=>p.len>barLen)) return null;
  /* duong tat: moi phoi cung mot chieu dai -> xep thang, O(so cay) */
  if(th.length===1){
    const p=th[0], n=Math.round(p.qty);
    if(n<=0) return [];
    const k=Math.floor((barLen+kerf)/(p.len+kerf));
    if(k<1) return null;
    const bars=[], soCay=Math.ceil(n/k);
    for(let i=0;i<soCay;i++){
      const c=Math.min(k,n-i*k), it=[];
      for(let j=0;j<c;j++) it.push({len:p.len,label:p.label});
      bars.push({used:c*p.len+(c-1)*kerf, items:it});
    }
    return bars;
  }
  const items=[]; th.forEach(p=>{for(let i=0;i<p.qty;i++) items.push({len:p.len,label:p.label});});
  items.sort((a,b)=>b.len-a.len);
  if (items.some(i=>i.len>barLen)) return null;
  const bars=[];
  for (const it of items){ let placed=false;
    for (const b of bars){ const need=b.items.length?kerf+it.len:it.len;
      if (b.used+need<=barLen+1e-9){ b.used+=need; b.items.push(it); placed=true; break; } }
    if (!placed) bars.push({used:it.len,items:[it]}); }
  return bars;
}
function plan(parts, barLen, kerf){
  const bars=pack(parts,barLen,kerf); if(!bars) return null;
  const netMm=parts.reduce((s,p)=>s+p.len*p.qty,0), grossMm=bars.length*barLen;
  const kerfMm=bars.reduce((s,b)=>s+(b.items.length-1)*kerf,0);
  return { bars, soCay:bars.length, netMm, grossMm, kerfMm, dauMauMm:grossMm-netMm-kerfMm,
    haoPct:(grossMm-netMm)/grossMm*100,
    soNhat:bars.reduce((s,b)=>s+((barLen-b.used)>=kerf?b.items.length:Math.max(0,b.items.length-1)),0),
    duPhongMin:Math.min(...bars.map(b=>barLen-b.used)) };
}
function congDon(n){
  if(n.tuDong===false) return {gio:+n.gio||0, han:+n.han||0, may:+n.may||0};
  const q=Math.max(1,+n.qty||1);
  return {gio:Math.max(1,Math.round((2+q*0.33)*2)/2), han:q*2, may:+(q*0.25).toFixed(2)};
}
function timLui(parts, barLen, kerf, maxLui=30){
  const tong=parts.reduce((a,p)=>a+p.qty,0); if(tong>3000) return null;
  const goc=plan(parts,barLen,kerf); if(!goc) return null;
  for(let d=1; d<=maxLui; d++) for(let i=0;i<parts.length;i++){
    if (parts[i].len-d<=0) continue;
    const thu=parts.map((q,j)=> j===i?{...q,len:q.len-d}:{...q});
    const r=plan(thu,barLen,kerf);
    if (r && r.soCay<goc.soCay && r.duPhongMin>=(S.dinhMuc.duPhong??10)) return {i,lui:d,lenMoi:thu[i].len,r};
  }

}

  const n=S.nhap, m=vt(), D=S.dinhMuc;
  const p=plan([{len:n.len,qty:n.qty,label:n.hm}], D.cay, D.mach);
  if(!p) return null;
  const kg=kgCay(m,D.cay), vatTu=p.soCay*kg*m.gia, c=congDon(n);
  const cong=c.gio*D.gioCong, vien=Math.ceil(p.soNhat/D.nhatMoiDa);
  const an=vien*D.da + c.han*D.que + c.han*D.khi + c.may*D.dien;
  const von=Math.round(vatTu+cong+an), loi=Math.round(n.ban)-von;
  return {p,m,kg,kgTong:p.soCay*kg,c,vien,vatTu:Math.round(vatTu),cong,an:Math.round(an),von,loi,
          pct:n.ban>0?loi/n.ban*100:null};

function vonVatTu(o){

function khoPhoi(){

     chứ không đoán — đoán sai ở đây là cắt nhầm kim loại. */
  const hopLe=(S.phoi||[]).filter(o=>o.vt===n.vt && o.len>=n.len);
  const tong=hopLe.reduce((a,o)=>a+(o.qty||0),0);
  const hop=Math.min(tong, Math.max(1,+n.qty||1));
  if(!hop) return null;
  const k=Math.floor((D.cay+D.mach)/(n.len+D.mach))||1;
  const bot=Math.floor(hop/k);
  return {soDoan:hop, bot, tong, k, len:hopLe[0]};
}

/* Trừ phôi kho ra khỏi đơn đang báo giá. Trước đây S.phoi chỉ được đọc, không bao
   giờ bị trừ — kho là một danh sách 5 dòng bất động, mãi mãi. */
function dungPhoi(soDoan){
  const n=S.nhap; let con=soDoan;
  const giu=[];
  (S.phoi||[]).forEach(o=>{
    if(con<=0 || o.vt!==n.vt || o.len<n.len){ giu.push(o); return; }
    const lay=Math.min(con, o.qty||0); con-=lay;
    const conLai=(o.qty||0)-lay;
    if(conLai>0) giu.push({...o, qty:conLai});
  });
  S.phoi=giu;
  return soDoan-con;
}

/* Cắt xong thì phần thừa mỗi cây quay lại kho, đúng loại vật tư. */
function traPhoi(donId){
  const o=timDon(donId), D=S.dinhMuc;
  if(!o || !o.vtId || !o.len || !o.qty) return 0;   /* đơn cũ không mang quy cách thì bỏ qua */
  const n={vt:o.vtId, len:o.len, qty:o.qty, hm:o.hang};
  const p=plan([{len:n.len,qty:n.qty,label:n.hm}], D.cay, D.mach);
  if(!p || !p.bars || !p.bars.length) return 0;
  const thua=p.bars.map(b=>Math.floor(D.cay-b.used)).filter(x=>x>=200);
  if(!thua.length) return 0;
  const gom={};
  thua.forEach(len=>{ gom[len]=(gom[len]||0)+1; });
  Object.keys(gom).forEach(len=>{
    const cu=(S.phoi||[]).find(o=>o.vt===n.vt && o.len===+len && o.tu===donId);
    if(cu) cu.qty+=gom[len];
    else (S.phoi=S.phoi||[]).push({len:+len, qty:gom[len], vt:n.vt, tu:donId});
  });
  return thua.length;
}

    t1:`${o.id} xong rồi, chưa có giấy tờ`,
    t2:`${o.kh} · ${o.hang}`,

  S.moi.forEach(m=>them({
    key:"zl"+m.id, diem:72, av:"Z", cls:"ok",
    t1:`${m.kh} chờ báo giá`,
    t2:m.t.slice(0,50)+(m.t.length>50?"…":""),
    t3:"Khách chờ lâu thì dễ đi hỏi xưởng khác.",
    go:()=>{ S.tab="bao"; S.xem={k:"moi",id:m.id}; ve(); }}));

  dangLam().filter(o=>o.han!==null&&o.han<=2).forEach(o=>them({
    key:"hn"+o.id, diem:78-o.han, av:String(o.cd), cls:"wa",
    t1:`${o.hang} còn ${o.han} ngày là tới hẹn`,
    t2:`${o.kh} · đang ở bước ${CD[o.cd]}`,
    t3:`Còn ${Math.max(1,5-o.cd)} bước nữa: ${CD.slice(o.cd+1,5).join(" → ")||CD[5]}.`,
    go:()=>{ S.tab="don"; S.xem={k:"don",id:o.id}; ve(); }}));

  S.don.filter(o=>o.cd<5&&(o.ban-o.von)/o.ban<0.15).forEach(o=>them({
    key:"bm"+o.id, diem:95, av:"%", cls:"hot",
    t1:`${o.hang} biên chỉ ${Math.round((o.ban-o.von)/o.ban*100)}%`,
    t2:`${o.kh} · lời ${Ftr(o.ban-o.von)} trên ${Ftr(o.ban)}`,
    t3:"Dưới ngưỡng 15%. Xem lại giá vật tư hoặc tiền công.",
    go:()=>{ S.tab="don"; S.xem={k:"don",id:o.id}; ve(); }}));

  gop();
  return r.sort((a,b)=>b.diem-a.diem);

/* ===================== ẢNH & GIẤY TỜ ===================== */
/* ===== ẢNH THẬT =====
   Trước đây "Chụp ảnh và báo xong" chỉ ghi tên bước rồi vẽ một SVG dựng sẵn.
   Đó là vòng lặp lõi của sản phẩm, nên nó phải là ảnh thật.
   Ảnh đi thẳng vào IndexedDB dạng Blob nhị phân, KHÔNG vào S:
   S bị tuần tự hoá lại mỗi lần vẽ màn hình, một ảnh 223 KB vào đó là vỡ
   trần 5 MB của localStorage sau khoảng 31 đơn. */
const ANH_RONG=1600, ANH_CAO=1200, ANH_CL=0.8;
const ANH_THAT={};                    /* "DH-238|1" -> objectURL, để vẽ đồng bộ */
function khoaAnh(donId,i){ return donId+"|"+i; }
function laAnhThat(donId,buoc){ const i=CD.indexOf(buoc); return i>=0 && !!ANH_THAT[khoaAnh(donId,i)]; }

function hacCoAnh(tep){
  return new Promise((ok,loi)=>{
    if(!tep || !/^image\//.test(tep.type||"")) return loi(new Error("Không phải ảnh"));
    const fr=new FileReader();
    fr.onerror=()=>loi(new Error("Không đọc được tệp ảnh"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>loi(new Error("Ảnh hỏng hoặc máy không mở được"));
      im.onload=()=>{
        let w=im.naturalWidth||1, h=im.naturalHeight||1;
        const t=Math.min(1, ANH_RONG/w, ANH_CAO/h);
        w=Math.max(1,Math.round(w*t)); h=Math.max(1,Math.round(h*t));
        try{
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(im,0,0,w,h);
          cv.toBlob(b=> b?ok({blob:b,w,h}):loi(new Error("Máy không nén được ảnh")), "image/jpeg", ANH_CL);
        }catch(e){ loi(e); }
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(tep);
  });
}

/* Hạn giữ ảnh lấy đúng theo lựa chọn ở Cài đặt, không phải con số tròn bịa ra. */
function hanGiuAnh(){
  if(S.anhGiu==="giu") return 0;                       /* giữ tới khi chủ xưởng xoá */
  const thang=(S.baoHanh??12)+6;                       /* bảo hành + 6 tháng khiếu nại */
  return Date.now() + thang*30*864e5;
}

async function luuAnhThat(donId, i, tep){
  const r=await hacCoAnh(tep);
  const id=khoaAnh(donId,i);
  if(DB){
    await DB.datVao("anh",{ id, donId, buoc:i, kieu:"image/jpeg",
      byte:r.blob.size, rong:r.w, cao:r.h, du:r.blob, luc:Date.now(), hetHan:hanGiuAnh() });
  }
  try{
    if(ANH_THAT[id]) URL.revokeObjectURL(ANH_THAT[id]);
    ANH_THAT[id]=URL.createObjectURL(r.blob);
  }catch(e){}
  return {byte:r.blob.size, w:r.w, h:r.h};
}

/* Nạp sẵn ảnh đã lưu để vẽ được đồng bộ. Chạy một lần sau khi mở CSDL. */
async function napAnhThat(){
  if(!DB) return 0;
  try{
    const ds=await DB.tatCa("anh");
    let n=0;
    ds.forEach(a=>{
      if(!a || !a.du || !a.id) return;
      if(a.hetHan && a.hetHan>0 && a.hetHan<Date.now()) return;   /* quá hạn thì không dựng */
      try{ ANH_THAT[a.id]=URL.createObjectURL(a.du); n++; }catch(e){}
    });
    return n;
  }catch(e){ return 0; }
}

/* Xoá ảnh đã quá hạn giữ. Màn Cài đặt hứa điều này, nên nó phải chạy thật. */
async function donAnhHetHan(){
  if(!DB) return 0;
  try{
    const ds=await DB.tatCa("anh");
    const het=ds.filter(a=>a && a.hetHan>0 && a.hetHan<Date.now());
    for(const a of het){
      if(ANH_THAT[a.id]){ try{URL.revokeObjectURL(ANH_THAT[a.id]);}catch(e){} delete ANH_THAT[a.id]; }
      await DB.xoaCung("anh", a.id).catch(()=>DB.xoa("anh", a.id));
    }
    return het.length;
  }catch(e){ return 0; }
}

/* ===================== DỌN THEO MỐC LƯU TRỮ ===================== */
/* Mấy con số này đúng bằng con số trong Chính sách quyền riêng tư mục 4. Hai
   chỗ phải khớp, nếu không thì văn bản thành lời hứa suông. */
const GIU_NGAY = {
  tinCho:   90,          /* tin khách chưa thành đơn */
  khachSau: 24*30,       /* tên và số điện thoại khách, tính từ đơn cuối */
  chungTu:  10*365       /* đơn, báo giá, công nợ, khoản chi — pháp luật kế toán */
};
const NGAY_MS = 864e5;
/* Cầu dao: một lần dọn không được chạm quá tỉ lệ này của sổ. Điện thoại Android
   giá rẻ hay sai đồng hồ, và một cái đồng hồ nhảy mười năm là xoá sạch sổ xưởng.
   Thà bỏ sót một lần dọn, chứ không được xoá oan. */
const DON_TOI_DA = 0.25;

/* Kiểm đồng hồ trước khi tin vào nó. Nếu bây giờ còn trước lúc tạo dòng mới
   nhất trong CSDL thì đồng hồ máy đang sai — không dọn gì cả. */
function dongHoDangTin(mocMoiNhat){
  const nay=Date.now();
  if(!(nay>0)) return false;
  if(mocMoiNhat>0 && nay < mocMoiNhat - NGAY_MS) return false;  /* cho 1 ngày sai lệch */
  if(nay < 17e11) return false;                                  /* trước 2023: đồng hồ chưa đặt */
  return true;
}

/* Trả về bản kê đã dọn gì. Không bao giờ ném lỗi ra ngoài. */
async function donHetHan(epBuoc){
  const ke={boQua:"", tinCho:0, khach:0, don:0};
  if(!DB) { ke.boQua="chưa mở được cơ sở dữ liệu"; return ke; }
  try{
    /* Mỗi ngày một lần là đủ. Mốc lưu trữ tính bằng tháng và năm, nên quét lại
       mỗi lần mở app chỉ làm app mở chậm thêm mà không dọn được thêm gì. */
    if(!epBuoc){
      const lan=await DB.layMeta("donHetHan.lan").catch(()=>0);
      if(lan>0 && Date.now()-lan < NGAY_MS){ ke.boQua="đã dọn trong 24 giờ qua"; return ke; }
    }
    await DB.datMeta("donHetHan.lan", Date.now()).catch(()=>{});
    const dsDon=await DB.tatCa("don");
    const mocMoiNhat=dsDon.reduce((a,o)=>Math.max(a, o.taoLuc||0, o.suaLuc||0), 0);
    if(!dongHoDangTin(mocMoiNhat)){ ke.boQua="đồng hồ máy đang sai"; return ke; }
    const nay=Date.now();

    /* --- 1. tin khách chưa thành đơn, quá 90 ngày --- */
    try{
      const mo=await DB.tatCa("moi");
      const het=mo.filter(m=>m && !m.xuLy && m.luc>0 && nay-m.luc > GIU_NGAY.tinCho*NGAY_MS);
      if(het.length && het.length <= Math.max(5, Math.ceil(mo.length*DON_TOI_DA))){
        const id=new Set(het.map(m=>m.id));
        for(const m of het) await DB.xoaCung("moi",m.id).catch(()=>{});
        S.moi=(S.moi||[]).filter(m=>!id.has(m.id));
        ke.tinCho=het.length;
      }
    }catch(e){}

    /* --- 2. tên và số điện thoại khách, quá 24 tháng sau đơn cuối --- */
    /* Dùng lại anDanhKhach: bỏ phần nhận dạng được, giữ con số đơn hàng cho
       chứng từ kế toán. Hai mốc khác nhau nên hai việc khác nhau, không gộp. */
    try{
      const donCuoi={};
      dsDon.forEach(o=>{ const t=o.khTen||""; if(!t) return;
        donCuoi[t]=Math.max(donCuoi[t]||0, o.xongLuc||0, o.taoLuc||0); });
      const ungVien=S.kh.filter(k=>{
        if(/^Khách đã xoá/.test(k.ten)) return false;        /* đã ẩn danh rồi */
        const m=donCuoi[k.ten]||0;
        if(!(m>0)) return false;                              /* không rõ đơn cuối thì đừng đoán */
        if(nay-m <= GIU_NGAY.khachSau*NGAY_MS) return false;
        /* Còn nợ thì giữ số điện thoại: xoá đi là xưởng mất đường đòi tiền.
           Luật 91/2025 Điều 14 khoản 2 cho giữ khi có căn cứ hợp pháp. */
        const no=moiDonCua(k.ten).reduce((a,o)=>a+Math.max(0,o.ban-(o.thu||0)),0);
        return no<=0;
      });
      const tran=Math.max(2, Math.ceil(S.kh.length*DON_TOI_DA));
      for(const k of ungVien.slice(0,tran)){
        const r=await anDanhKhach(k.ten);
        if(r){ ghiXoaKhach(r); ke.khach++; }
      }
    }catch(e){}

    /* --- 3. đơn, báo giá, khoản chi quá 10 năm --- */
    try{
      const het=dsDon.filter(o=>o && o.cd>=5 && (o.taoLuc||0)>0 &&
                                nay-(o.xongLuc||o.taoLuc) > GIU_NGAY.chungTu*NGAY_MS);
      if(het.length && het.length <= Math.max(2, Math.ceil(dsDon.length*DON_TOI_DA))){
        const id=new Set(het.map(o=>o.id));
        for(const o of het) await DB.xoa("don",o.id).catch(()=>{});   /* xoa() cuốn theo buoc, anh */
        S.don=(S.don||[]).filter(o=>!id.has(o.id));
        S.donCu=(S.donCu||[]).filter(o=>!id.has(o.id));
        S.bg=(S.bg||[]).filter(q=>!id.has(q.donId||""));
        id.forEach(x=>{ if(S.anh) delete S.anh[x]; });
        ke.don=het.length;
      }
    }catch(e){}

    if(ke.tinCho||ke.khach||ke.don){
      try{ await DB.ghiHetTuS(S,HM,VT,TN,AU); }catch(e){}
    }
  }catch(e){ ke.boQua="lỗi khi dọn: "+(e&&e.message||"không rõ"); }
  return ke;
}

/* Ghi xong một bước. coAnh=false khi máy thợ không chụp được — vẫn báo xong
   được, nhưng nói thẳng là không kèm ảnh chứ không giả vờ có. */
function baoXong(o, coAnh){
  const xong=CD[o.cd]; const i=o.cd; o.cd++; S.thoDon=o.id;
  const nay=new Date(), p2=n=>String(n).padStart(2,"0");
  (S.anh[o.id]=S.anh[o.id]||[]).push(
    [xong, `${p2(nay.getDate())}/${p2(nay.getMonth()+1)} ${gio()}`, Date.now()]);
  if(o.cd>=5){ o.tg=0; o.han=0; }
  /* Cắt xong thì phần thừa mỗi cây quay lại kho phôi, đúng loại vật tư. */
  if(xong==="Cắt" && !o.daTraPhoi){ const n=traPhoi(o.id); if(n>0) o.daTraPhoi=true; }
  toast(coAnh ? `Đã báo xong “${xong}” kèm ảnh` : `Đã báo xong “${xong}” — không kèm ảnh`);
  ve();
  return i;
}

/* Trước đây hàm này TỰ BỊA ra một mốc thời gian từ new Date(2026,9,10) cứng
   trong mã khi không tìm thấy bản ghi. Bịa dữ liệu lúc đọc nghĩa là không bao
   giờ tính được hạn xoá ảnh, trong khi màn Cài đặt đang mời chủ xưởng chọn mốc
   giữ ảnh. Giờ không có bản ghi thì trả null — không có ảnh thì nói là không có. */
function anhBuoc(o,i){
  if(i>=o.cd) return null;
  const m=S.anh[o.id]; if(m){const f=m.find(a=>a[0]===CD[i]); if(f) return f;}
  return null;
  const d=new Date(2026,9,10); d.setDate(d.getDate()-(o.cd-i));
  const H=[9,11,14,16][i%4], M=[14,40,5,22][i%4];
  const p=n=>String(n).padStart(2,"0");
  return [CD[i], `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(H)}:${p(M)}`];
}
const GIAY=[["Biên bản nghiệm thu","📋","Khách xác nhận hàng đã lắp xong, đúng mẫu"],

            ["Biên bản đối chiếu công nợ","🧾","Số tiền còn lại và hạn trả"]];
function giayHTML(o,i){

  return `<h4>${ten}</h4>${chung}${r("Giá trị đơn",F(o.ban)+" đ")}${r("Khách đã trả",F(o.thu)+" đ")}${r("Còn lại",F(no(o))+" đ")}${r("Hạn thanh toán","15 ngày kể từ nghiệm thu")}
    <p style="margin-top:10px">Hai bên xác nhận số còn lại nêu trên là đúng tại ngày lập biên bản.</p>`;
}

/* ===================== KHÁCH HÀNG ===================== */
const LOC_KH=[["all","Tất cả"],["moi","Khách mới"],["tx","Thường xuyên"],["cu","Khách cũ"]];
/* Chốt duy nhất mà mọi tin đi ra khách đều đi qua. KHÔNG chặn cả hàm — nó cũng chở
   báo giá và biên nhận tiền, là việc chủ xưởng chủ động bấm. Chỉ tin có cờ nhac
   mới cần quyền 3. Trả true/false để chỗ gọi biết tin có đi hay không. */
function guiTin(ten,msg){
  if(!ten) return false;
  if(msg && msg.nhac && !duocPhep(3)) return false;   /* tin nhắc: phải có quyền 3 */
  (S.tin[ten]=S.tin[ten]||[]).push({g:gio(),...msg});
  return true;
}
/* Số điện thoại khách, để chỗ nào tắt nhắc qua tin nhắn thì đổi sang nút gọi. */
const sdtKhach = ten => (S.kh.find(x=>x.ten===ten)||{}).sdt || "";
/* Mở hội thoại của khách đang có báo giá chờ trả lời; không có thì về khách mặc định.
   Nếu không, nút "Đồng ý báo giá" nằm ở hội thoại không ai mở tới. */
const khachZalo = () => {
  const cho = Object.keys(S.tin||{}).find(t =>
    (S.tin[t]||[]).some(m => m.loai === "bg" && !m.ok));
  return cho || VAI.khach.ai;
};
const chuCai = t => (String(t).replace("Nhà thầu ","").trim()[0]||"?");
function noKhach(){
  const m={}; noDon().forEach(o=>{(m[o.kh]=m[o.kh]||[]).push(o);});
  return Object.entries(m).map(([ten,ds])=>({ten,ds,
    tien:ds.reduce((a,o)=>a+no(o),0),
    ngay:Math.max(...ds.map(qh)),
    thieu:ds.some(o=>!o.ct&&o.cd===5)}))
   .sort((a,b)=> b.ngay-a.ngay || b.tien-a.tien);
}
function donCua(t){ return S.don.filter(o=>o.kh===t); }
function tinCua(t){ return S.moi.filter(m=>m.kh===t); }

/* ===================== QUYỀN CỦA MỘT KHÁCH ===================== */
/* Luật 91/2025 cho khách quyền xem, lấy về và yêu cầu xoá dữ liệu của mình.
   Xuất toàn bộ xưởng thì đã có ở Cài đặt › Xuất dữ liệu, nhưng khi MỘT khách
   yêu cầu mà đưa cả sổ xưởng thì vừa lộ khách khác vừa không phải thứ họ xin.
   Hai việc dưới làm đúng phạm vi một khách.

   Về chuyện xoá: luật kế toán buộc giữ chứng từ, nên "xoá khách" ở đây là
   ẩn danh hoá — bỏ tên, số điện thoại, tin nhắn và ảnh, giữ lại con số đơn
   hàng dưới một cái tên vô danh. Hai luật không đánh nhau: luật dữ liệu cá
   nhân đòi bỏ phần nhận dạng được, luật kế toán đòi giữ phần con số. */

function khachTheoTen(t){ return S.kh.find(x=>x.ten===t)||null; }
function moiDonCua(t){ return [...(S.don||[]), ...(S.donCu||[])].filter(o=>o.kh===t); }

/* Gom mọi thứ app biết về một khách. Lịch sử thu tiền nằm trong CSDL nên đọc
   thêm nếu CSDL mở được; không mở được thì vẫn có tổng đã thu trên từng đơn. */
async function duLieuKhach(ten){
  const k=khachTheoTen(ten), don=moiDonCua(ten);
  const idDon=don.map(o=>o.id);
  let thu=[], nhac=[], khId="";
  if(DB){
    try{
      const r=await DB.timTheo("kh","ten",ten);
      khId=(r&&r[0]&&r[0].id)||"";
      if(khId){
        thu =await DB.thuTheoKhach(khId).catch(()=>[]);
        nhac=await DB.nhacTheoKhach(khId).catch(()=>[]);
      }
    }catch(e){}
  }
  return {
    canCu:"Luật 91/2025/QH15 — quyền truy cập và quyền lấy dữ liệu của chủ thể dữ liệu",
    xuong:S.xuong, ngayXuat:new Date().toISOString(),
    khach:k?{ten:k.ten, sdt:k.sdt, khachTu:k.tu, ghiChu:k.ghi||"", soDonTruocKhiDungApp:k.lan||0, maTrongCSDL:khId}:{ten:ten},
    don:don.map(o=>({ma:o.id, hang:o.hang, giaBan:o.ban, daThu:o.thu||0,
                     conNo:Math.max(0,o.ban-(o.thu||0)), trangThai:CD[o.cd]||String(o.cd)})),
    baoGia:(S.bg||[]).filter(q=>q.kh===ten).map(q=>({ma:q.id, hang:q.hang, giaBan:q.ban, ngayGui:q.ngay, trangThai:q.tt})),
    tinNhan:((S.tin&&S.tin[ten])||[]).map(x=>({luc:x.g, ben:x.ai==="kh"?"khách":"xưởng", noiDung:x.t||"", loai:x.loai||"chu"})),
    tinChoXuLy:(S.moi||[]).filter(m=>m.kh===ten).map(m=>({luc:m.luc||"", noiDung:m.t||"", coAnh:!!m.anh})),
    anhBanVe:idDon.flatMap(id=>((S.anh&&S.anh[id])||[]).map(a=>({donId:id, buoc:a[0], luc:a[1]}))),
    lichSuThuTien:(thu||[]).map(x=>({luc:new Date(x.luc).toISOString(), donId:x.donId, soTien:x.tien, cach:x.cach||"khac"})),
    lanDaNhacNo:(nhac||[]).map(x=>({luc:new Date(x.luc).toISOString(), donId:x.donId, bac:x.bac}))
  };
}

/* Biên bản đã thực hiện yêu cầu xoá. Nằm cùng bảng nk với nhật ký đồng ý, nên
   cũng không bị dọn cùng dữ liệu nghiệp vụ.

   CỐ Ý KHÔNG ghi tên cũ và số điện thoại cũ vào đây. Ghi vào thì chính biên bản
   xoá lại trở thành chỗ lưu dữ liệu vừa xoá, và quyền được xoá thành vô nghĩa.
   Giữ mốc thời gian, tên vô danh và số lượng là đủ để chứng minh đã làm. */
function ghiXoaKhach(ke){
  if(!DB || !ke) return false;
  try{
    const p=DB.datVao("nk",{ luc:Date.now(), may:DB.may||"", bang:"xoakhach",
      khoa:ke.tenMoi, viec:"andanh", truoc:null, sau:null,
      nd:`giữ ${ke.soDon} đơn · bỏ ${ke.soTin} tin · bỏ ${ke.soAnh} ảnh · bỏ ${ke.soChoXuLy} tin chờ` },{nk:false});
    if(p && p.catch) p.catch(()=>{});
  }catch(e){ return false; }
  return true;
}

/* Tên vô danh phải không trùng với tên nào đang có, vì khách khoá bằng tên. */
function tenVoDanh(){
  let n=1; while(S.kh.some(x=>x.ten==="Khách đã xoá "+n)) n++;
  return "Khách đã xoá "+n;
}

/* Ẩn danh hoá. Trả về bản kê những gì đã bỏ, để hiện cho chủ xưởng thấy. */
async function anDanhKhach(ten){
  const k=khachTheoTen(ten); if(!k) return null;
  const don=moiDonCua(ten), idDon=don.map(o=>o.id), moi=tenVoDanh();
  /* maKhach trả ra ngoài vì lớp đồng bộ cần mã khách trong CSDL (KH-0001) để
     gọi endpoint ẩn danh của máy chủ. Khách khoá bằng TÊN trong S, nên không
     trả ra thì bên ngoài không có đường nào lấy được sau khi tên đã đổi. */
  const ke={tenCu:ten, tenMoi:moi, maKhach:"", soDon:don.length, soTin:0, soAnh:0, soChoXuLy:0};

  /* 1. Lấy mã khách trong CSDL TRƯỚC khi đổi tên, vì sau khi đổi thì tra không ra. */
  let khId="";
  if(DB){ try{ const r=await DB.timTheo("kh","ten",ten); khId=(r&&r[0]&&r[0].id)||""; }catch(e){} }
  ke.maKhach=khId;

  /* 2. Bỏ phần nhận dạng được trong bộ nhớ. */
  k.ten=moi; k.sdt=""; k.ghi="Dữ liệu cá nhân đã xoá theo yêu cầu của khách";
  (S.don||[]).forEach(o=>{ if(o.kh===ten) o.kh=moi; });
  (S.donCu||[]).forEach(o=>{ if(o.kh===ten) o.kh=moi; });
  (S.bg||[]).forEach(q=>{ if(q.kh===ten) q.kh=moi; });

  /* 3. Tin nhắn và tin chờ xử lý là dữ liệu cá nhân thuần: xoá, không đổi tên. */
  if(S.tin && S.tin[ten]){ ke.soTin=S.tin[ten].length; delete S.tin[ten]; }
  if(S.tin && S.tin[moi]) delete S.tin[moi];
  const truocMoi=(S.moi||[]).length;
  S.moi=(S.moi||[]).filter(m=>m.kh!==ten);
  ke.soChoXuLy=truocMoi-S.moi.length;

  /* 4. Ảnh bản vẽ: thu hồi objectURL rồi bỏ khỏi bộ nhớ. */
  idDon.forEach(id=>{
    const ds=(S.anh&&S.anh[id])||[];
    ke.soAnh+=ds.length;
    ds.forEach((_,i)=>{ const kh=khoaAnh(id,i);
      if(ANH_THAT[kh]){ try{ URL.revokeObjectURL(ANH_THAT[kh]); }catch(e){} delete ANH_THAT[kh]; } });
    if(S.anh) delete S.anh[id];
  });

  /* 5. Ghi xuống CSDL, rồi XOÁ CỨNG phần nhận dạng được. ghiHetTuS chỉ xoá mềm
        (đánh dấu xoa=1) nên dòng cũ còn nguyên tên và số — xoá mềm không phải
        xoá, nên phải gọi xoaCung cho đúng nghĩa quyền được xoá. */
  if(DB){
    try{ await DB.ghiHetTuS(S,HM,VT,TN,AU); }catch(e){}
    if(khId){
      try{ const t=await DB.timTheo("tin","khId",khId);
           for(const x of (t||[])) await DB.xoaCung("tin",x.n).catch(()=>{}); }catch(e){}
      try{ const mo=await DB.timTheo("moi","khId",khId);
           for(const x of (mo||[])) await DB.xoaCung("moi",x.id).catch(()=>{}); }catch(e){}
      try{ await DB.xoaCung("kh",khId); }catch(e){}
    }
    for(const id of idDon){
      try{ const a=await DB.timTheo("anh","donId",id);
           for(const x of (a||[])) await DB.xoaCung("anh",x.id).catch(()=>{}); }catch(e){}
    }
  }
  return ke;
}

const m0=t=>t.length?t[0].id:"";
/* Dấu tiếng Việt trong thuộc tính download làm Chrome bỏ cả tên file,
   còn [^\w]+ thì ăn mất luôn chữ. Bỏ dấu rồi mới thay khoảng trắng. */
function boDau(t){
  return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/Đ/g,"D")
    .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "tep";
}

function docTin(t){
  /* Quyền 0. Trường tat:true để chỗ gọi phân biệt "máy đọc nhưng không ra" với
     "máy không được đọc" — hai cái đó phải hiện hai câu khác nhau cho chủ xưởng. */
  if(!duocPhep(0)) return {len:0, qty:0, vtid:"", hm:"", du:false, tat:true};
  const s=(t||"").toLowerCase().replace(/\.(?=\d{3}\b)/g,"");
  let len=0, qty=0, vtid="";
  let k=s.match(/(\d{2,5})\s*(?:mm|li)\b/);
  if(k) len=+k[1];
  /* "1m8" nghĩa là 1.800 mm — cách người Việt viết hằng ngày. */
  if(!len){ k=s.match(/(\d)\s*m\s*(\d)(?!\d)/); if(k) len=(+k[1])*1000 + (+k[2])*100; }
  if(!len){ k=s.match(/(\d(?:[,.]\d+)?)\s*(?:m|mét|met)(?![a-z0-9])/); if(k) len=Math.round(parseFloat(k[1].replace(",","."))*1000); }
  k=s.match(/(\d{1,4})\s*(?:thanh|cây|cay|cái|cai|bộ|bo|chiếc|chiec)\b/);
  if(k) qty=+k[1];
  const d=s.match(/(\d{2,3})\s*[x×]\s*(\d{2,3})/);
  if(d){ const a=+d[1], b=+d[2], inox=/inox|304|201|trắng/.test(s);
    const hop=VT.filter(v=>((v.a===a&&v.b===b)||(v.a===b&&v.b===a)) && (inox? v.rho>7.9 : true));
    if(hop.length) vtid=hop[0].id; }
  let hm=""; [["lan can","Lan can"],["cổng","Cổng"],["cầu thang","Cầu thang"],["cửa","Cửa inox"],
             ["mái","Mái che"],["hàng rào","Hàng rào"],["khung","Khung"],["kệ","Khung kệ"]]
    .forEach(([a,b])=>{ if(!hm&&s.includes(a)) hm=b; });
  return {len, qty, vtid, hm, du:!!(len&&qty)};
}
function dxHoaDon(m){
  if(!duocPhep(0)) return null;      /* đặt TRÊN if(m.anh) cho rõ: chặn áp cả hai loại tin */
  if(m.anh) return null;
  const d=docTin(m.t);
  if(!d.du) return null;
  const vt=VT.find(v=>v.id===(d.vtid||"i4012"))||VT[0];
  const len=d.len, qty=Math.min(500,d.qty), D=S.dinhMuc;
  const pl=plan([{len,qty}],D.cay,D.mach);
  if(!pl) return null;
  const kg=kgCay(vt,D.cay)*pl.soCay, thep=kg*vt.gia;
  const c=congDon({qty,tuDong:true});
  const cong=c.gio*D.gioCong;
  const an=Math.ceil(pl.soNhat/D.nhatMoiDa)*D.da + c.han*D.que + c.han*D.khi + c.may*D.dien;
  const von=Math.round(thep+cong+an);
  const tien=Math.round(von/0.78/1000)*1000;
  return { dong:[["Hạng mục",d.hm||"Theo tin khách"],["Vật tư",vt.ten],
                 ["Kích thước",`${qty} thanh × ${F(len)} mm`],
                 ["Số cây cần mua",`${pl.soCay} cây 6 m`],
                 ["Khối lượng",`${F2(kg,1)} kg`],
                 ["Hao hụt",`${F2(pl.haoPct,1)}%`],
                 ["Giá vốn",`${F(von)} đ`]],
           tien, von, len, qty, vtid:vt.id, hm:d.hm,
           mo:["chiều cao lan can","loại tay vịn"] };
}

["p", "**Tên và số điện thoại khách.** Lấy để gọi khách, gửi báo giá vào Zalo, và ghi khách nào nợ bao nhiêu. Đây là dữ liệu cá nhân cơ bản theo Nghị định 356/2025, Điều 3 khoản 1 và khoản 7. Giữ trong khi còn làm ăn với khách, và 24 tháng sau đơn cuối. Hết 24 tháng, phần mềm xoá tên và số; phần nằm trong chứng từ kế toán thì giữ theo mục 4 dưới đây."],
["p", "**Nội dung tin khách nhắn.** Lấy để dựng sẵn báo giá — máy bóc ra chiều dài, số lượng, loại vật tư. Đây là công tắc số 1 ở mục 5. Tin chưa xử lý giữ cho tới khi anh gửi báo giá hoặc bấm nhập tay; tin không thành đơn thì giữ 90 ngày rồi xoá."],
["p", "**Ảnh bản vẽ khách gửi.** Lấy để xem lại lúc cắt và lúc hàn. Đây là công tắc số 2. Thời hạn do anh chọn ở **Cài đặt › Dữ liệu của anh nằm ở đâu › Ảnh bản vẽ khách gửi giữ bao lâu**, hai cách: giữ theo đời đơn hàng, hoặc giữ lại để khách đặt lại từ ảnh cũ. Chọn cách thứ nhất thì mốc xoá là ngày nghiệm thu cộng thời hạn bảo hành anh khai cộng 6 tháng khiếu nại — mặc định là 18 tháng. Chọn cách thứ hai thì anh phải hỏi riêng từng khách trong Zalo và lưu lại câu họ trả lời. Khách im lặng không tính là đồng ý."],
["p", "**Công nợ từng khách.** Lấy để biết tiền đang kẹt ở đâu và nhắc đúng bậc. Đây là chỗ cần nói kỹ, nằm ở mục 3 ngay dưới. Giữ 10 năm, bằng thời hạn giữ chứng từ kế toán."],
["p", "**Tên và số điện thoại chủ xưởng và thợ.** Lấy để đăng nhập, phân vai, và để thợ báo xong bước. Dữ liệu cá nhân cơ bản. Tài khoản thợ: chủ xưởng gỡ quyền thì xoá trong 30 ngày."],
["p", "**Mã PIN 4 số.** Lưu dạng băm một chiều ngay trên máy, không lưu số gốc. Nói thẳng: PIN 4 số chỉ có 10.000 khả năng, nên nó là khoá nhanh để người đi ngang không mở app lên xem, không phải lớp mã hoá. Ai cầm được điện thoại đã mở khoá thì vẫn đọc được dữ liệu. Lớp bảo vệ thật là khoá màn hình của chính điện thoại — anh nhớ bật."],
["p", "**Thiết bị đang đăng nhập và lần đăng nhập cuối.** Lấy để anh thấy thiết bị lạ mà đá ra. Giữ 12 tháng."],
["p", "Phần mềm **không** lấy: vị trí, danh bạ, ảnh trong máy ngoài ảnh anh chủ động chụp cho đơn, thời gian làm của từng thợ. Không có bảng xếp hạng ai nhanh ai chậm, vì phần mềm không đo cái đó."],
["h3", "3. Công nợ của một người — chỗ xám, và nhóm xử thế nào"],
["p", "Nghị định 356/2025 liệt kê dữ liệu cá nhân nhạy cảm ở Điều 4 khoản 1. Điểm k của khoản đó nói về tên đăng nhập và mật khẩu tài khoản ngân hàng, thông tin thẻ, lịch sử giao dịch, và thông tin tài chính, tín dụng — nhưng câu đó gắn với khách hàng **tại các tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung gian thanh toán, chứng khoán, bảo hiểm và các tổ chức được phép khác**. Xưởng cơ khí không phải một trong những tổ chức đó. Đọc sát câu chữ thì khoản tiền một người còn nợ xưởng không rơi vào điểm k."],
["p", "Nhưng điểm c của cùng khoản đó nói về đời sống riêng tư và bí mật cá nhân, và điểm m là điểm vét cho dữ liệu khác mà pháp luật đòi giữ kín. Chuyện anh Bình nợ 14,6 triệu quá hạn 42 ngày là chuyện anh Bình không muốn ai biết. Hai điểm này để ngỏ."],
["p", "Nhóm không chờ ai phân xử chỗ ngỏ đó. **Nhóm xử công nợ cá nhân theo mức của dữ liệu nhạy cảm.** Cụ thể: màn công nợ chỉ mở cho vai chủ xưởng và vai giữ sổ; tin nhắn đối chiếu công nợ gửi đúng một người là khách đó, không gửi nhóm, không gửi ai khác. Làm chặt hơn mức bắt buộc thì không ai phạt; làm lỏng hơn thì có."],
["p", "Và phải nói thẳng một chỗ bản này **chưa** làm được, vì bản trước của văn bản này hứa quá. Bản 0.4 che số liệu tiền với vai thợ **ở lúc vẽ màn hình**, không phải bằng cách lược nó ra khỏi dữ liệu trong máy. Dữ liệu vẫn nằm trong cơ sở dữ liệu của trình duyệt trên máy đó, và một người biết mở công cụ nhà phát triển là đọc được. Che khi vẽ là lời đề nghị lịch sự, không phải phân quyền."],
["p", "Phân quyền thật đòi dữ liệu nằm ở chỗ thợ không với tới — tức là ở máy chủ, và máy chủ thì quyết định không gửi phần tiền xuống máy thợ ngay từ đầu. Nhóm đang dựng đúng chỗ đó. Trong lúc chưa xong, cách giữ an toàn là **đừng cho thợ dùng máy có sổ xưởng**: một máy riêng cho thợ, hoặc thợ xem việc qua máy của anh. Bản thật sẽ bỏ được câu này; bản 0.4 thì chưa."],
["p", "Chỗ này nhóm đọc Nghị định 356/2025 qua bản chụp lại của một trang luật, chưa đọc được bản công báo gốc. Nếu anh cần chắc tới mức in vào hợp đồng với nhà thầu, lấy bản công báo ra đối chiếu điểm k một lần nữa."],
["h3", "4. Giữ bao lâu, và vì sao là con số đó"],
["p", "Mỗi con số dưới đây gắn với một lý do, không phải chọn cho tròn."],
["p", "Tin khách chưa thành đơn: **90 ngày**. Quá ba tháng mà khách không chốt thì cái tin đó không còn giúp anh báo giá nữa."],
["p", "Ảnh bản vẽ: **18 tháng** kể từ ngày nghiệm thu, với thời hạn bảo hành mặc định 12 tháng. Anh đổi thời hạn bảo hành thì con số này đổi theo, vì nó là bảo hành cộng 6 tháng khiếu nại."],
["p", "Tên và số điện thoại khách: **24 tháng** sau đơn cuối."],
["p", "Đơn hàng, báo giá, công nợ, khoản chi: **10 năm**. Đây là thời hạn giữ chứng từ kế toán theo pháp luật kế toán Việt Nam. Nhóm lấy con số 10 năm làm mặc định của phần mềm; nếu kế toán của xưởng nói khác cho loại giấy tờ cụ thể nào, nghe kế toán."],
["p", "Tài khoản thợ sau khi bị gỡ quyền: **30 ngày**."],
["p", "Thiết bị đăng nhập: **12 tháng**."],
["p", "Mấy điều phải nói thật về cách phần mềm thi hành mấy con số này."],
["p", "**Ảnh bản vẽ tự xoá theo mốc.** Mỗi ảnh lưu xuống đều mang sẵn ngày hết hạn tính từ lựa chọn của anh ở Cài đặt, và mỗi lần anh mở app, phần mềm quét qua rồi xoá hẳn ảnh nào quá hạn. Anh chọn \"Giữ lại để khách đặt lại từ ảnh cũ\" thì ảnh không mang ngày hết hạn và nằm lại tới khi anh xoá."],
["p", "**Tin khách chưa thành đơn, tên và số điện thoại khách, và đơn quá chứng từ cũng tự dọn theo mốc**, mỗi ngày một lần khi anh mở app. Tin chờ quá 90 ngày thì xoá. Khách quá 24 tháng từ đơn cuối thì phần mềm bỏ tên và số điện thoại, giữ con số đơn hàng dưới tên vô danh — đúng như khi anh tự bấm nút xoá cho một khách. Đơn đã xong quá 10 năm thì xoá cả đơn."],
["p", "Ba chỗ chặn trong việc dọn tự động đó, viết ra để anh biết nó không làm bừa. Một, **khách còn nợ thì không bị bỏ số điện thoại**, dù quá 24 tháng — bỏ số rồi thì anh mất đường đòi tiền, và Luật 91/2025 Điều 14 khoản 2 cho giữ khi có căn cứ hợp pháp. Hai, phần mềm **kiểm đồng hồ máy trước khi dọn**; đồng hồ sai thì nó bỏ qua lần dọn đó chứ không xoá theo cái mốc sai. Ba, **một lần dọn không được chạm quá một phần tư sổ**; quá thì nó dừng và không xoá gì. Thà bỏ sót một lần dọn chứ không xoá oan sổ của xưởng."],
["p", "Còn **chưa tự dọn**: tài khoản thợ đã gỡ quyền và thiết bị đăng nhập cũ. Hai chỗ đó hiện chưa ghi ngày gỡ và ngày đăng nhập cuối, nên chưa có mốc để tính. Chưa xong thì nói là chưa xong."],
["p", "Hai: chừng nào chưa có máy chủ, \"xoá\" nghĩa là xoá khỏi máy này. Tệp .json anh đã tải về nằm trong tay anh, phần mềm không với tới nó được. Anh xoá tệp đó."],
["h3", "5. Năm công tắc — cái nào chặn cái gì"],
["p", "Màn đăng ký có năm công tắc, và chúng nằm lại ở **Cài đặt › Quyền riêng tư** để anh bật tắt lúc nào cũng được. Luật 91/2025 đòi đồng ý riêng từng việc, không gộp một cục (Điều 9). Dưới đây là điều từng công tắc thật sự quyết định."],
["p", "**1 — Đọc tin nhắn khách gửi.** Bật thì máy bóc chiều dài, số lượng, loại vật tư ra khỏi câu khách nhắn và dựng sẵn hoá đơn cho anh soát. Tắt thì máy không bóc gì, màn báo giá mở ra trống, anh nhập bốn con số bằng tay. Tin của khách vẫn hiện nguyên câu cho anh đọc — tắt công tắc này không làm mất tin nhắn, nó chỉ dừng việc máy đọc hộ. Đây là công tắc duy nhất phần mềm đánh dấu \"cần cho tính năng chính\", và nó mặc định bật. Bốn công tắc còn lại mặc định tắt."],
["p", "**2 — Lưu ảnh bản vẽ khách gửi.** Bật thì ảnh bản vẽ được giữ lại theo mốc anh chọn. Tắt thì phần mềm không giữ ảnh nào của khách, và mục chọn thời hạn giữ ảnh cũng không còn ý nghĩa nên nó ẩn đi. Ảnh thợ chụp báo xong bước **không** thuộc công tắc này — đó là ảnh sản phẩm của xưởng, không phải bản vẽ khách gửi."],
["p", "**3 — Gửi phần mô tả vật tư ra dịch vụ AI nước ngoài.** Đang tắt, và trong bản này bật cũng không gửi, vì chưa có dịch vụ nào ở ngoài để gửi tới. Nói cho rõ chuyện nhãn hiển thị: chữ \"AI\" anh thấy trên thẻ hoá đơn đề xuất là máy đọc **trong chính điện thoại anh** bằng mấy dòng khớp mẫu chữ, không có câu nào của khách rời khỏi máy. Khi nào nhóm thật sự nối ra một dịch vụ ngoài nước, có hai việc phải xong trước. Một là xoá tên khách và số điện thoại ra khỏi đoạn gửi đi — chỉ còn kích thước và loại vật tư. Hai là lập hồ sơ đánh giá tác động chuyển dữ liệu cá nhân xuyên biên giới và gửi cơ quan chuyên trách trong 60 ngày kể từ lần chuyển đầu, theo Điều 20 Luật 91/2025. Hồ sơ chưa có thì công tắc không gửi được gì, kể cả khi anh bật. Chưa xong thì nói là chưa xong."],
["p", "**4 — Nhắc việc qua tin nhắn.** Bật thì phần mềm gửi vào Zalo khách lời nhắc đơn sắp tới hạn và lời nhắc khách nợ lâu, theo bậc 7 · 15 · 30 ngày. Tắt thì không có tin nhắc nào đi ra; nút nhắc đổi thành nút gọi điện, anh gọi trực tiếp. Tin giao dịch **không** thuộc công tắc này: báo giá anh bấm gửi, hồ sơ nghiệm thu, biên nhận tiền khách vừa trả — mấy cái đó là việc anh chủ động làm với khách, vẫn gửi bình thường."],
["p", "**5 — Dùng dữ liệu xưởng này để cải thiện sản phẩm.** Đang tắt và mặc định tắt. Tắt cũng không ảnh hưởng gì tới anh. Nếu sau này anh bật, thứ duy nhất đi ra là số đếm không gắn với người: bao nhiêu báo giá dựng được, bao nhiêu lần máy đọc sai, màn nào hay bị bấm sai. Không có tên khách, không có số điện thoại, không có số tiền của đơn nào. Và chừng nào chưa có máy chủ thì bật cũng không có chỗ nào nhận."],
["p", "Một dòng cần biết: anh tắt một công tắc thì việc đã làm **trước đó** không tự quay lại. Luật 91/2025 Điều 10 khoản 4 nói việc rút lại đồng ý không áp cho phần đã xử lý xong. Báo giá máy đã dựng hôm qua vẫn còn ở đó; từ lúc anh tắt, máy thôi dựng cái mới."],
["h3", "6. Quyền của khách và của thợ, và làm thế nào trong phần mềm"],
["p", "Luật 91/2025 Điều 4 khoản 1 cho chủ thể dữ liệu sáu nhóm quyền. Dưới đây là từng quyền và chỗ bấm."],
["p", "**Được biết dữ liệu mình bị xử lý thế nào.** Trong phần mềm: **Cài đặt › Quyền riêng tư** và **Cài đặt › Dữ liệu của anh nằm ở đâu**. Với khách của xưởng: khách hỏi anh, anh đọc cho khách nghe hoặc gửi họ hai văn bản này."],
["p", "**Đồng ý, không đồng ý, và rút lại đồng ý.** Năm công tắc ở mục 5. Bật tắt lúc nào cũng được, không mất gì, không phải giải thích với ai. Với ảnh bản vẽ khi anh chọn cách giữ lâu: anh hỏi từng khách trong Zalo và lưu câu trả lời của họ."],
["p", "**Xem và sửa dữ liệu của mình.** Trong phần mềm: **Khách hàng › chọn khách** cho dữ liệu khách, và **Cài đặt › Hồ sơ của tôi** cho dữ liệu chủ xưởng. Khách gọi nói sai số điện thoại thì anh sửa ngay chỗ đó."],
["p", "Nói thật một chỗ: **Cài đặt › Người dùng và phân quyền** và **Cài đặt › Thiết bị đang đăng nhập** hiện là hai màn **ví dụ**, tên trong đó là tên bịa. Bản này chỉ có một tài khoản thật — tài khoản của anh trên máy này. Hai màn đó bày ra để anh thấy bản thật sẽ trông thế nào, và trong app cũng ghi rõ như vậy ở đầu mỗi màn. Thợ muốn xem hay sửa dữ liệu của mình thì hiện tại nói với anh, anh sửa hộ. Mời thợ, đổi vai, gỡ quyền và đá thiết bị lạ đều cần máy chủ: phân quyền chỉ có thật khi dữ liệu nằm ở chỗ thợ không với tới được, chứ không phải khi màn hình không vẽ ra."],
["p", "**Yêu cầu một bản dữ liệu của mình.** Hai chỗ, tuỳ ai hỏi. Cả xưởng thì **Cài đặt › Xuất toàn bộ dữ liệu**. Một khách hỏi riêng thì **Khách hàng › chọn khách › Tải dữ liệu của khách này** — ra một tệp .json chỉ có khách đó: hồ sơ, đơn, báo giá, tin nhắn, ảnh bản vẽ, lịch sử thu tiền và những lần đã nhắc nợ. Nút đó không lọt dữ liệu khách khác, nên anh gửi thẳng cho họ được, không phải cắt tay."],
["p", "**Yêu cầu xoá hoặc dừng xử lý.** Tắt công tắc để dừng. Xoá sạch cả máy thì **Cài đặt › Xoá hết dữ liệu trên máy này**. Một khách đòi xoá dữ liệu của họ thì **Khách hàng › chọn khách › Xoá dữ liệu cá nhân của khách này**."],
["p", "Nút đó bỏ tên, số điện thoại, toàn bộ tin nhắn và ảnh bản vẽ của khách đó — bỏ thật, kể cả trong cơ sở dữ liệu, không phải chỉ ẩn khỏi màn hình. Nhưng nó **giữ lại con số đơn hàng** dưới một cái tên vô danh kiểu \"Khách đã xoá 1\". Lý do: pháp luật kế toán buộc giữ chứng từ, và Luật 91/2025 Điều 14 khoản 2 cho phép không xoá trong trường hợp pháp luật đòi giữ. Hai luật không đánh nhau — luật dữ liệu cá nhân đòi bỏ phần nhận dạng được, luật kế toán đòi giữ phần con số."],
["p", "Trước khi bấm, phần mềm hiện rõ sẽ bỏ gì và giữ gì, và nếu khách đó **còn nợ** thì nó cảnh báo: xoá số điện thoại rồi thì anh không gọi đòi được nữa. Nói thẳng với khách lý do giữ phần chứng từ, đừng hứa xoá hết rồi không xoá hết."],
["p", "Phần mềm cũng ghi một biên bản là đã làm việc xoá đó — mốc thời gian, tên vô danh mới, và số lượng đã bỏ. Biên bản **không ghi tên cũ và số cũ**, vì ghi vào thì chính nó lại thành chỗ lưu thứ vừa xoá."],
["p", "**Phản đối việc xử lý.** Khách nói không muốn xưởng lưu ảnh bản vẽ của họ: anh tắt công tắc số 2, hoặc chọn cách giữ theo đời đơn hàng rồi xoá ảnh của khách đó."],
["p", "**Khiếu nại, tố cáo, khởi kiện, đòi bồi thường.** Khách khiếu nại với anh trước, vì anh là bên kiểm soát. Anh khiếu nại với nhóm nếu lỗi ở phần mềm. Không xong thì khiếu nại hoặc tố cáo tới cơ quan chuyên trách bảo vệ dữ liệu cá nhân thuộc Bộ Công an, và khởi kiện ra toà."],
["p", "Luật cũng đặt nghĩa vụ lên chủ thể dữ liệu (Điều 4 khoản 2): tự bảo vệ dữ liệu của mình, tôn trọng dữ liệu của người khác, và cung cấp dữ liệu đúng. Với anh, nghĩa vụ cụ thể nhất là bật khoá màn hình điện thoại và không đưa mã PIN cho người ngoài."],
["h3", "7. Rút lại đồng ý — cách làm"],
["p", "Tắt công tắc ở **Cài đặt › Quyền riêng tư** là rút lại đồng ý. Phần mềm nhận ngay, không hỏi lại, không bắt giải thích, và hiện một câu xác nhận: \"Đã tắt. Anh bật lại lúc nào cũng được.\""],
["p", "Luật 91/2025 Điều 10 khoản 2 muốn yêu cầu rút lại thể hiện được bằng văn bản, kể cả dạng điện tử hoặc định dạng kiểm chứng được. Phần mềm ghi lại trạng thái từng công tắc trong máy, nên lúc nào anh cũng mở Cài đặt ra xem được cái nào đang bật cái nào đang tắt, và tệp .json anh tải về có kèm trạng thái đó."],
["p", "Ngoài trạng thái hiện tại, phần mềm ghi thêm **ngày giờ mỗi lần bật tắt**. Mở **Cài đặt › Quyền riêng tư › Nhật ký bật tắt** là thấy từng dòng: giờ phút, mục nào, bật hay tắt, và vai của người bấm. Có nút tải riêng nhật ký đó thành một tệp .json, nên lúc bị hỏi anh đưa đúng tờ đó chứ không phải đưa cả sổ đơn hàng và công nợ."],
["p", "Nhật ký này nằm riêng khỏi dữ liệu đơn hàng. Nhập tệp mới hay dọn dữ liệu cũ đều không xoá nó, và nó cũng không hết hạn theo mốc ở mục 4 — vì nó là bằng chứng chứ không phải sổ sách. Trong luồng mở app lần đầu, mấy lần bấm thử công tắc **trước khi** bấm \"Đồng ý và tiếp tục\" thì không ghi, vì lúc đó chưa đồng ý gì cả. Mốc đồng ý là lúc bấm nút đó."],
["p", "Khách của xưởng rút lại đồng ý thì họ nhắn cho anh trong Zalo. Anh lưu lại tin đó, rồi tắt công tắc hoặc xoá phần dữ liệu của họ."],
["h3", "8. Có sự cố thì làm gì, trong bao lâu"],
["p", "Bản 0.4 không gửi dữ liệu đi đâu, nên sự cố hay gặp nhất không phải tin tặc. Nó là **mất điện thoại**, hoặc **người khác cầm điện thoại đã mở khoá của anh lên đọc**."],
["p", "Mất điện thoại thì làm ba việc, theo thứ tự."],
["p", "Một, **đổi mã PIN trên máy còn lại của anh**, ở Cài đặt › Hồ sơ của tôi. Hai, nếu điện thoại mất có khoá màn hình của chính nó thì dùng chức năng tìm và xoá từ xa của Google hoặc Apple — đó là thứ xoá được dữ liệu trên máy đó, phần mềm này thì không. Ba, nhìn lại xem trong máy đó có công nợ của khách nào; nếu có, báo cho khách đó biết, đừng im."],
["p", "Nói thẳng chỗ bản trước của văn bản này hứa sai: nó bảo anh mở **Cài đặt › Thiết bị đang đăng nhập** và đá thiết bị đó ra. Màn đó là **màn ví dụ**, tên và giờ trong đó là bịa, và nút \"Đá ra\" không có hiệu lực thật — nó chỉ ghi một dòng trên màn hình. Việc đầu tiên của một quy trình ứng cứu không được là việc không làm được. Đá thiết bị thật cần máy chủ, vì phải thu hồi được thẻ đăng nhập của máy đó; đang dựng."],
["p", "Về thời hạn: Luật 91/2025 Điều 23 khoản 1 buộc bên kiểm soát thông báo cho cơ quan chuyên trách bảo vệ dữ liệu cá nhân **chậm nhất 72 giờ kể từ khi phát hiện** vi phạm, nếu vi phạm đó có thể gây tổn hại. Vì **xưởng là bên kiểm soát** với dữ liệu khách, 72 giờ đó là của xưởng. Nhóm là bên xử lý, nên nghĩa vụ của nhóm là báo cho xưởng ngay khi phát hiện — nhóm tự đặt mốc cho mình là **trong 24 giờ**, để anh còn 48 giờ mà làm việc của anh. Cùng điều đó khoản 2 buộc lập biên bản xác nhận vi phạm; nhóm viết biên bản đó giúp anh, anh ký."],
["p", "Một khoản nợ của một cá nhân bị lộ là trường hợp phải báo, không phải trường hợp bỏ qua. Xem lại mục 3 về lý do."],
["h3", "9. Trẻ em"],
["p", "Phần mềm này là công cụ làm việc của xưởng cơ khí. Nó không dành cho người dưới 16 tuổi và không có đường nào để một người dưới 16 tuổi tự mở tài khoản — thợ vào bằng mã mời do chủ xưởng phát. Nếu xưởng có thợ học việc dưới 16 tuổi, chuyện đó thuộc pháp luật lao động, không thuộc văn bản này, và nhóm không xử lý dữ liệu của người đó khác đi."],
["h3", "10. Bên thứ ba"],
["p", "Bản 0.4 **không có bên thứ ba nào**. Không có máy phân tích hành vi, không có quảng cáo, không có công cụ đo lường, không có dịch vụ lưu trữ ngoài. Phần mềm là một tệp chạy trong trình duyệt điện thoại anh."],
["p", "Những bên thứ ba **dự kiến** có khi lên bản thật, nói trước để anh không bị bất ngờ: một nhà cung cấp máy chủ đặt tại Việt Nam để lưu và sao lưu; Zalo, qua kênh ZNS, để gửi tin cho khách bằng tài khoản chính danh của xưởng. Chuyện ZNS: gửi tin bằng ZNS cần Official Account đã xác thực, mà xác thực OA đòi giấy phép kinh doanh. Nhóm đang làm hồ sơ pháp nhân; khi xong sẽ bật. Chưa xong thì nói là chưa xong. Thêm bên nào, nhóm hiện lại màn đồng ý và anh tick lại, theo mục 9 của Phần một."],
["h3", "11. Chuyển dữ liệu ra nước ngoài"],
["p", "Hiện tại: **không**. Dữ liệu nằm trong máy anh, không ra khỏi máy, nên không có chuyện chuyển ra nước ngoài."],
["p", "Khi lên bản thật, máy chủ đặt tại Việt Nam. Nếu có ngày nhóm gọi một dịch vụ ở nước ngoài — công tắc số 3 — thì theo Điều 20 Luật 91/2025 đó là chuyển dữ liệu xuyên biên giới, và nhóm phải lập hồ sơ đánh giá tác động chuyển dữ liệu cá nhân xuyên biên giới rồi gửi một bản chính cho cơ quan chuyên trách trong 60 ngày kể từ lần chuyển đầu tiên. Hồ sơ đó chưa có. Chừng nào chưa có, phần mềm không gửi gì ra ngoài, kể cả khi công tắc được bật."],
["h3", "12. Hồ sơ nhóm phải lập cho chính mình"],
["p", "Luật 91/2025 Điều 21 buộc bên kiểm soát lập hồ sơ đánh giá tác động xử lý dữ liệu cá nhân và gửi một bản chính cho cơ quan chuyên trách trong 60 ngày kể từ ngày đầu tiên xử lý dữ liệu, và Điều 22 buộc cập nhật khi có thay đổi. Nghị định 356/2025 Điều 19 nói rõ hồ sơ gồm những gì và nộp theo mẫu nào."],
["p", "Nhưng trước khi anh lo, đọc chỗ này: **Điều 38 khoản 3 miễn hẳn hộ kinh doanh và doanh nghiệp siêu nhỏ** khỏi Điều 21, Điều 22 và khoản 2 Điều 33. **Khoản 2** cho doanh nghiệp nhỏ và doanh nghiệp khởi nghiệp được chọn làm hoặc không làm ba điều đó, trong 5 năm kể từ 1/1/2026. Xưởng cơ khí bốn tới tám thợ gần như luôn thuộc một trong hai nhóm đó, nên mặc định **anh được miễn**."],
["p", "Miễn trừ đó mất hiệu lực trong ba trường hợp, cũng ghi ngay trong hai khoản trên: kinh doanh dịch vụ xử lý dữ liệu; **trực tiếp xử lý dữ liệu cá nhân nhạy cảm**; hoặc xử lý dữ liệu của số lượng lớn chủ thể. Trường hợp đầu không phải anh. Trường hợp cuối thì cả Luật và Nghị định đều không đưa ra con số nào, nên không có ngưỡng để chỉ vào."],
["p", "Trường hợp giữa là chỗ xám, và nó đúng là chỗ xám đã nói ở mục 3. Chép lại nguyên văn điểm k của Nghị định 356 Điều 4 khoản 1, kể cả mệnh đề giới hạn ở cuối, vì mệnh đề đó quyết định cả đoạn: *\"Tên đăng nhập, mật khẩu truy cập của tài khoản ngân hàng; thông tin thẻ ngân hàng; dữ liệu về lịch sử giao dịch của tài khoản ngân hàng; thông tin tài chính, tín dụng và các thông tin về hoạt động, lịch sử giao dịch tài chính, chứng khoán, bảo hiểm **của khách hàng tại** các tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung gian thanh toán... và các tổ chức được phép khác.\"*"],
["p", "Mệnh đề \"của khách hàng tại các tổ chức tín dụng...\" gắn vào vế \"thông tin tài chính, tín dụng\", và xưởng cơ khí không phải một trong các tổ chức đó — đúng như mục 3 đã kết luận. Vế \"lịch sử giao dịch của tài khoản ngân hàng\" thì nói về **tài khoản ngân hàng**, thứ phần mềm không giữ. Nên đọc sát câu chữ thì sổ công nợ của anh **không** rơi vào điểm k, và anh vẫn được miễn."],
["p", "Chỗ còn ngỏ là điểm c (đời sống riêng tư, bí mật cá nhân) và điểm m (điểm vét), đúng hai điểm mục 3 đã để ngỏ. Phần mềm **không lưu số tài khoản và không lưu số thẻ** của ai."],
["p", "Cho nên nhóm làm sẵn một bản mẫu điền được, ở tệp **dpia-mau.md**: phần lớn đã điền sẵn từ chính phần mềm, anh chỉ điền tên xưởng, loại hình đăng ký và vài ô, mất chừng mười lăm phút. Có hồ sơ mà được miễn thì không mất gì, lại dùng được khi khách hỏi. Không có mà hoá ra không được miễn thì Điều 19 khoản 6 Nghị định 356 cho xem xét xử phạt. Lệch rủi ro rõ một bên."],
["p", "Nhóm cũng là bên kiểm soát với dữ liệu tài khoản của chủ xưởng và thợ, nên nhóm phải lập hồ sơ cho chính mình. Nhóm là doanh nghiệp khởi nghiệp nên về nguyên tắc được chọn theo khoản 2, nhưng vẫn sẽ lập — đang làm cùng hồ sơ pháp nhân. Nói thêm cho đủ: nhóm không phải luật sư, và việc anh có thuộc nhóm được miễn hay không phụ thuộc loại hình đăng ký kinh doanh của chính xưởng, nên hỏi kế toán hoặc luật sư một câu cho chắc."],
["h3", "13. Những chỗ còn chưa xong, tính đến ngày 5/11/2026"],
["p", "Danh sách này có thật trong văn bản để anh đối chiếu, và nó sẽ ngắn dần. Ngày ở tiêu đề mục này đổi mỗi lần sửa."],
["p", "Chưa có máy chủ, nên chưa có sao lưu tự động — anh tự tải tệp .json mỗi tuần."],
["p", "Chưa có tài khoản thợ thật và danh sách thiết bị thật, nên hai màn đó là ví dụ và chưa có mốc nào để tự dọn. Ảnh, tin chờ, tên và số điện thoại khách, và đơn quá chứng từ thì đã tự dọn theo mốc."],
["p", "Chưa gửi được tin bằng ZNS vì chưa xác thực Official Account, vì chưa có giấy phép kinh doanh."],
["p", "Chưa có pháp nhân, nên chỗ ghi tên công ty và mã số thuế trong Phần một mục 1 còn trống."],
["p", "Nhóm chưa lập hồ sơ đánh giá tác động cho chính mình. Bản mẫu cho xưởng thì đã có, ở tệp dpia-mau.md kèm theo phần mềm."],
["h3", "14. Liên hệ về dữ liệu cá nhân"],
["p", "**Nhóm chưa có số hỗ trợ riêng, và phải nói ra chỗ này cho rõ.** Số đang hiện ở Cài đặt › Về IronSpace là số viết cứng trong bản chạy thử, và nó trùng số của xưởng mẫu — gọi vào đó là gọi vào chính máy anh, không tới nhóm. Trong lúc chưa có số riêng, anh liên hệ nhóm qua người đã giao bản này cho anh."],
["p", "Với khách của xưởng thì khác, và chỗ này không thiếu gì: **anh là bên kiểm soát** dữ liệu khách, nên khách hỏi, khách đòi xem, đòi lấy về, đòi xoá hay khiếu nại thì họ liên hệ với anh, không phải với nhóm. Mọi chỗ bấm để làm việc đó đều có trong phần mềm, kể ở mục 6."],
["p", "Khi nhóm có pháp nhân, Cài đặt › Về IronSpace sẽ có số riêng của nhóm, một địa chỉ thư điện tử dành riêng cho việc dữ liệu cá nhân, và tên người chịu trách nhiệm."]];
/* === het PHAP_LY === */
/* Văn bản pháp lý là DỮ LIỆU, không phải mã: rào HTML trước, rồi mới đổi **đậm**
   thành <b>. Làm ngược thứ tự là mở cửa cho chữ trong văn bản chạy như mã. */
function dam(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
/* boH1=true khi màn hình đã có tiêu đề riêng, khỏi in title hai lần. */
function vanBanPhapLy(boH1){
  return PHAP_LY.map(([k,t])=>
      k==="h1" ? (boH1?"":`<div class="h1" style="margin-bottom:2px">${esc(t)}</div>`)
    : k==="h2" ? `<div class="plh2">${esc(t)}</div>`
    : k==="h3" ? `<div class="plh3">${esc(t)}</div>`
    :            `<p class="plp">${dam(t)}</p>`).join("");
}
/* Mở từ màn đăng ký: ở đó chưa vào app nên không dùng được màn Cài đặt. */

}

function vCai(){
  const m=S.xem&&S.xem.m;
  if(!m) return `<button class="bk" data-bk="1">‹ Quay lại</button>
    <div class="h1">Cài đặt</div><div class="sub">${esc(S.xuong)} · ${esc(VAI[S.vai].ai)}</div>
    ${CAI_NHOM.map(([ten,ds])=>`<div class="sgrp">${esc(ten)}</div><div class="sbox">
      ${ds.map(k=>{const[ic,t,d]=CAI_MUC[k];return `<button class="srow" data-cm="${k}">
        <span class="sic">${ic}</span><span class="st"><b>${esc(t)}</b><span>${esc(d)}</span></span>
        <span class="chev">›</span></button>`;}).join("")}</div>`).join("")}
    <div class="sbox" style="margin-top:18px"><button class="srow" data-thoat="1">
      <span class="sic">⏻</span><span class="st"><b>Khoá lại</b>
      <span>Về màn nhập mã 4 số. Dữ liệu trong máy giữ nguyên.</span></span></button>
      <button class="srow" data-xoasach="1">
      <span class="sic">⌫</span><span class="st"><b style="color:var(--bad)">Xoá hết dữ liệu trên máy này</b>
      <span>Mất toàn bộ đơn, khách và công nợ. Không lấy lại được.</span></span></button></div>
    <div class="note" style="margin:14px 2px">IronSpace bản dùng thử · Dữ liệu lưu tại Việt Nam</div>`;

  const [ic,ten] = CAI_MUC[m];
  const bk = `<button class="bk" data-bk="1">‹ Cài đặt</button><div class="h1">${esc(ten)}</div>`;

  if(m==="xuong") return bk+`<div class="c"><div class="fi"><label>Tên xưởng</label>
      <input id="cfX" value="${esc(S.xuong)}" style="width:190px;text-align:left"></div>
    <div class="fi"><label>Chủ xưởng</label><input id="cfChu" value="${esc(S.chu)}" style="width:150px;text-align:left"></div>
    <div class="fi"><label>Số điện thoại</label><input id="cfSdt" type="tel" value="${esc(S.sdt||"0909 112 334")}"></div></div>
    <button class="b sp" data-luu="1">Lưu lại</button>`;

  if(m==="gia") return bk+`<div class="sub">Giá nhập theo ký. Đổi ở đây thì mọi báo giá sau tính theo giá mới.</div>
    <div class="sbox">${VT.map(v=>`<div class="srow"><span class="st"><b>${esc(v.ten)}</b><span>${esc(v.mo)}</span></span>
      <span class="num sv"><b style="color:var(--ink);font-size:14px">${F(v.gia)}</b> đ/kg</span></div>`).join("")}</div>
    <button class="b gh" data-themvt="1">+ Thêm loại vật tư</button>`;

  if(m==="may") return bk+`<div class="sub">Ba con số này quyết định số cây phải mua. Sai một ly là sai cả báo giá.</div>
    <div class="c">
      <div class="fi"><label>Chiều dài cây nguyên (mm)</label><input id="cfA" value="${S.dinhMuc.cay}"></div>
      <div class="fi"><label>Mạch cắt (mm)</label><input id="cfB" value="${S.dinhMuc.mach}"></div>
      <div class="fi"><label>Dự phòng mỗi cây (mm)</label><input id="cfC" type="number" value="${S.dinhMuc.duPhong??10}"></div></div>
    <div class="note">Mạch cắt thật tuỳ máy: đá cầm tay 1,2–1,4 mm, máy cắt bàn 14 inch khoảng 3,0 mm.</div>
    <button class="b sp" data-luu="1">Lưu lại</button>`;

  if(m==="cong") return bk+`<div class="c">
      <div class="fi"><label>Giờ công thợ (đ/giờ)</label><input id="cfGioCong" type="number" value="${S.dinhMuc.gioCong}"></div>
      <div class="fi"><label>Điện (đ/giờ)</label><input id="cfDien" type="number" value="${S.dinhMuc.dien}"></div>
      <div class="fi"><label>Đá cắt (đ/viên)</label><input id="cfDa" type="number" value="${S.dinhMuc.da}"></div>
      <div class="fi"><label>Nhát mỗi viên đá</label><input id="cfNhatMoiDa" type="number" value="${S.dinhMuc.nhatMoiDa}"></div>
      <div class="fi"><label>Que hàn (đ/que)</label><input id="cfQue" type="number" value="${S.dinhMuc.que}"></div>
      <div class="fi"><label>Khí (đ/phút)</label><input id="cfKhi" type="number" value="${S.dinhMuc.khi}"></div></div>
    <button class="b sp" data-luu="1">Lưu lại</button>`;

  if(m==="toi") return bk+`<div class="c">
      <div class="fi"><label>Tên</label><input id="cfChu" value="${esc(S.chu)}" style="width:150px;text-align:left"></div>
      <div class="fi"><label>Số điện thoại</label><input id="cfToiSdt" type="tel" value="${esc(AU.sdt?("0"+AU.sdt):"0912 345 678")}"></div></div>
    <button class="b sp" data-luu="1">Lưu lại</button>
    <button class="b gh" style="margin-top:9px" data-doipin="1">Đổi mã PIN</button>
    <div class="note">Mã PIN chỉ mở khoá trên máy này. Máy khác phải nhận lại tin nhắn.</div>`;

  if(m==="nguoi") return bk+`<div class="c flat" style="border:1px solid var(--warn)">
      <b class="sm" style="color:var(--warn)">Danh sách dưới là ví dụ, không phải người thật</b>
      <div class="sm muted" style="margin-top:5px">Bản này chỉ có <b>một tài khoản thật</b>: tài khoản của anh trên máy này. Bốn dòng dưới bày ra để anh thấy bản thật sẽ trông thế nào. Mời thợ, đổi vai và gỡ quyền cần máy chủ, vì phân quyền chỉ có thật khi dữ liệu nằm ở chỗ thợ không với tới được.</div></div>
    <div class="sbox">
      ${[["Anh Sáu","Chủ xưởng","Thấy tất cả"],["Chị Hạnh","Giữ sổ","Thấy tiền, không sửa định mức"],
         ["Anh Tám","Thợ","Chỉ thấy việc, không thấy tiền"],["Anh Bảy","Thợ","Chỉ thấy việc, không thấy tiền"]]
        .map(([n,v,d])=>`<div class="srow" style="opacity:.62"><span class="sic">${esc(chuCai(n))}</span>
          <span class="st"><b>${esc(n)}</b><span>${esc(d)}</span></span><span class="p">${esc(v)}</span></div>`).join("")}</div>
    <div class="c flat"><div class="lbl">MÃ MỜI THỢ</div>
      <div class="big" style="margin-top:4px;letter-spacing:.12em">${esc(S.maMoi||"MS6K7P")}</div>
      <div class="sm muted" style="margin-top:6px">Đọc mã này cho thợ. Bản chạy thử dùng chung một mã cho cả xưởng; bản thật sẽ cho mã dùng một lần, hết hạn sau 24 giờ.</div>
      <button class="b gh" style="margin-top:10px" data-mamoi="1">Tạo mã mới</button></div>`;

  if(m==="tbi") return bk+`<div class="c flat" style="border:1px solid var(--warn)">
      <b class="sm" style="color:var(--warn)">Hai dòng dưới là ví dụ, không phải thiết bị thật</b>
      <div class="sm muted" style="margin-top:5px">Bản này chạy trong máy, nên nó chỉ biết <b>chính máy này</b> — nó không có cách nào thấy máy khác đang mở app hay không. Danh sách thiết bị thật, và nút đá ra có hiệu lực thật, cần máy chủ. Nút “Đổi mã PIN” dưới cùng thì thật.</div></div>
    <div class="sbox">
      ${(S.thietBiRa||[]).length?`<div class="note" style="margin:0 0 10px">Đã đá ra: ${(S.thietBiRa||[]).map(esc).join(", ")}. Thiết bị đó phải nhập lại mã mời.</div>`:""}
      ${[["Điện thoại này","Hôm nay, 18:02","day"],["Samsung A15","Hôm qua, 07:31",""],["Máy bàn phòng kế toán","12/10, 14:05",""]]
        .map(([n,g,c])=>`<div class="srow"${c?"":' style="opacity:.62"'}><span class="sic">📱</span>
          <span class="st"><b>${esc(n)}${c?' <span class="p ok">đang dùng</span>':""}</b><span>Lần cuối ${esc(g)}</span></span>
          ${c?"":`<button class="p hot" data-dara="${esc(g)}" style="border:0;cursor:pointer;font:inherit">Đá ra</button>`}</div>`).join("")}</div>
    <div class="note">Thấy thiết bị lạ thì đá ra ngay, rồi đổi mã PIN ngay bên dưới.</div>
    <button class="b gh" style="margin-top:12px" data-doipin="1">Đổi mã PIN</button>`;

  if(m==="tron") return bk+`<div class="sub">Áp cho cả ứng dụng, nhớ luôn cho lần sau.</div>
    <button class="b sp" data-a11y="1">Mở bảng trợ năng</button>
    <div class="note">Cỡ chữ đang dùng: ${["Vừa","Lớn","Rất lớn"][TN.co]}${TN.tp?" · tương phản cao":""}${TN.cd?" · giảm chuyển động":""}</div>`;

  if(m==="tbao") return bk+`<div class="sbox" style="padding:4px 15px">
      ${TBAO_LOAI.map(([t,d],i)=>`<div class="prow" style="border-top:${i?"1px solid var(--line)":"0"}">
        <div style="flex:1"><div class="tt">${esc(t)}</div><div class="dd">${esc(d)}</div></div>
        <div class="sw ${S.tbao[i]?"on":""}" data-tbs="${i}"><b></b></div></div>`).join("")}</div>`;

  if(m==="rieng") return bk+`<div class="sub">Luật 91/2025 yêu cầu đồng ý riêng từng việc. Tắt lúc nào cũng được.</div>
    <div class="sbox" style="padding:4px 15px">
      ${QUYEN.map(([t,d,c],i)=>`<div class="prow" style="border-top:${i?"1px solid var(--line)":"0"}">
        <div style="flex:1"><div class="tt">${esc(t)}${c?' <span class="chip">cần cho tính năng chính</span>':""}</div>
        <div class="dd">${esc(d)}</div></div>
        <div class="sw ${AU.quyen[i]?"on":""}${(i===2&&!CO_DICH_VU_AI)||(i===4&&!CO_MAY_CHU)?" mo":""}" data-q="${i}"><b></b></div></div>`).join("")}</div>
    <button class="b gh" style="margin-top:11px" data-cm="nkq">Nhật ký bật tắt${NKQ.length?` · ${NKQ.length} dòng`:""}</button>`;

  if(m==="nkq"){
    const ds=NKQ.slice().reverse();          /* mới nhất lên trên */
    const vaiTen=v=>v==="chu"?"chủ xưởng":v==="so"?"người giữ sổ":v==="tho"?"thợ":v||"chủ xưởng";
    return bk+`<div class="sub">Luật 91/2025 Điều 10 khoản 2 buộc việc rút lại đồng ý phải kiểm chứng được. Mỗi lần bật hay tắt một mục, máy ghi đúng giờ phút ở đây.</div>
      ${ds.length?`<div class="sbox" style="padding:4px 15px">
        ${ds.map((o,k)=>`<div class="prow" style="border-top:${k?"1px solid var(--line)":"0"}">
          <div style="flex:1"><div class="tt">${esc(nkqTen(o.i))}</div>
          <div class="dd">${esc(nkqGio(o.luc))} · ${esc(vaiTen(o.vai))}</div></div>
          <b class="sm" style="color:var(--${o.bat?"ok":"bad"})">${o.bat?"BẬT":"TẮT"}</b></div>`).join("")}</div>
        <button class="b sp" style="margin-top:11px" data-nkqtv="1">Tải nhật ký về máy (.json)</button>`
      :`<div class="c flat"><b>Chưa có dòng nào.</b>
        <div class="sm muted" style="margin-top:5px">Nhật ký bắt đầu từ lần bấm “Đồng ý và tiếp tục”. Mọi lần bật tắt sau đó đều được ghi.</div></div>`}
      <div class="note" style="margin-top:11px">Nhật ký nằm riêng khỏi dữ liệu đơn hàng, nên nhập tệp mới hay dọn dữ liệu cũ đều không xoá nó. Nó là bằng chứng, không phải sổ sách.</div>`;
  }

  if(m==="xuat") return bk+`<div class="sub">Dữ liệu là của anh. Tải về bất cứ lúc nào, không cần xin phép ai.</div>
    <div class="c"><div class="dl"><span>Đơn hàng</span><b>${S.don.length} đơn</b></div>
      <div class="dl"><span>Khách hàng</span><b>${S.kh.length} khách</b></div>
      <div class="dl"><span>Khoản chi</span><b>${S.chi.length} dòng</b></div>
      <div class="dl"><span>Bảng giá vật tư</span><b>${VT.length} loại</b></div></div>
    <button class="b sp" data-taive="1">Tải toàn bộ về máy (.json)</button>`;

  if(m==="hoi"){ const bh=S.baoHanh??12, th=bh+6;
    return bk+`<div class="sub">Bốn câu xưởng hay hỏi nhất. Chỉ ghi thứ IronSpace làm được, không hứa trước.</div>

    <div class="sgrp">Dữ liệu lưu ở đâu</div>
    <div class="c"><b>Hiện tại: dữ liệu nằm trong chính máy này.</b>
      <div class="sm muted" style="margin-top:6px">Bản chạy thử chưa có máy chủ. Đơn hàng, khách và công nợ nằm trong bộ nhớ trình duyệt trên điện thoại này. Không gửi đi đâu — nhưng cũng chưa có bản sao nào ở nơi khác. Xoá dữ liệu duyệt web, đổi máy hay gỡ ứng dụng là mất hết.</div>
      <div class="sm muted" style="margin-top:7px"><b style="color:var(--spark-ink)">Việc anh nên làm mỗi tuần:</b> bấm “Tải toàn bộ về máy” ở cuối màn Cài đặt rồi giữ file đó. Hiện tại đó là bản sao lưu duy nhất.</div>
      <div class="sm muted" style="margin-top:7px"><b>Khi lên bản thật, dự kiến:</b> máy chủ đặt tại Việt Nam, sao lưu hằng đêm, thợ mất sóng thì việc nằm chờ trong máy và có mạng lại tự gửi lên. Chưa xong thì nói là chưa xong.</div></div>

    <div class="sgrp">Mã xác thực gửi bằng gì</div>
    <div class="c"><b>Hiện tại: mã mời 6 số do chủ xưởng phát.</b>
      <div class="sm muted" style="margin-top:6px">Bản chạy thử dùng một mã chung cho cả xưởng, chưa tự hết hạn. Bản thật sẽ cấp mã dùng một lần, hết hạn sau 24 giờ, và cho chủ xưởng gỡ thiết bị khi thợ nghỉ.</div>
      <div class="sm muted" style="margin-top:7px">Gửi mã qua Zalo bằng ZNS cần Official Account đã xác thực, mà xác thực OA đòi giấy phép kinh doanh. Nhóm đang làm hồ sơ pháp nhân; khi xong sẽ bật. Chưa xong thì nói là chưa xong.</div></div>

    <div class="sgrp">Mật khẩu để ở đâu</div>
    <div class="c"><b>Khách của xưởng không có mật khẩu nào cả.</b>
      <div class="sm muted" style="margin-top:6px">Khách không cài ứng dụng — mọi thứ diễn ra trong Zalo họ vẫn nhắn hằng ngày. Không có mật khẩu thì không có gì để lộ.</div>
      <div class="sm muted" style="margin-top:7px">Tài khoản trong xưởng dùng mã PIN 4 số. Bản chạy thử lưu PIN dạng băm một chiều ngay trên máy, không lưu số gốc. Nhưng nói thẳng: PIN 4 số chỉ có 10.000 khả năng, nên nó là khoá nhanh để người đi ngang không mở app lên xem, <b>không phải lớp mã hoá</b>. Ai cầm được điện thoại đã mở khoá thì vẫn đọc được dữ liệu. Lớp bảo vệ thật là khoá màn hình của chính điện thoại — anh nhớ bật. Khi có máy chủ, việc xác thực chuyển lên máy chủ.</div></div>

    <div class="sgrp">Ảnh bản vẽ khách gửi giữ bao lâu</div>
    <div class="c">${duocPhep(1)?`<div class="sm muted" style="margin-bottom:9px">Luật buộc giữ đúng khoảng thời gian cần cho mục đích, nên xưởng tự chọn. Không đặt con số tròn.</div>
      <button class="srow" data-ag="don" style="border-radius:10px"><span class="sic">${S.anhGiu==="don"?"◉":"○"}</span>
        <span class="st"><b>Giữ theo đời đơn hàng</b><span>Xong đơn + bảo hành ${bh} tháng + 6 tháng khiếu nại = khoảng ${th} tháng. Bản thật sẽ xoá theo mốc này.</span></span></button>
      <button class="srow" data-ag="giu" style="border-radius:10px"><span class="sic">${S.anhGiu==="giu"?"◉":"○"}</span>
        <span class="st"><b>Giữ lại để khách đặt lại từ ảnh cũ</b><span>Phải hỏi riêng từng khách trong Zalo và lưu lại câu trả lời</span></span></button>`
    :`<div class="sm muted" style="margin-bottom:9px">Anh đang tắt “Lưu ảnh bản vẽ khách gửi”, nên không có ảnh nào để đặt thời hạn. Thời hạn bảo hành dưới đây vẫn dùng cho đơn hàng.</div>
      <button class="b gh" style="margin-bottom:11px" data-cm="rieng">Bật lại công tắc</button>`}
      <div class="dl" style="margin-top:11px"><span>Thời hạn bảo hành xưởng khai</span>
        <b>${bh} tháng</b></div>
      <div class="step" style="margin-top:7px"><button data-bh="-3">–</button>
        <input type="number" value="${bh}" readonly><button data-bh="3">+</button></div>
      ${duocPhep(1)&&S.anhGiu==="giu"?`<div class="note" style="margin-top:10px">Chọn cách này thì mỗi khách phải bấm đồng ý riêng cho việc giữ ảnh. Khách im lặng không tính là đồng ý.</div>`:""}
    </div>

    <div class="note">Xưởng là bên quyết định dùng dữ liệu để làm gì. IronSpace chỉ xử lý theo hợp đồng ký với xưởng và không dùng dữ liệu của xưởng cho việc riêng.</div>`;}

  if(m==="phapLy") return bk+`<div class="sub">Bản đầy đủ của hai văn bản anh đã tick lúc đăng ký. Nằm trong máy, đọc được khi không có mạng.</div>
    <div style="padding-bottom:24px">${vanBanPhapLy(true)}</div>`;

  if(m==="goi") return bk+`<div class="c dark"><div class="lbl">ĐANG DÙNG</div>
      <div class="big" style="margin-top:4px">Bản dùng thử</div>
      <div class="sm" style="color:#AEB9C6;margin-top:6px">Không giới hạn tính năng. Chưa tính phí.</div></div>
    <div class="note">Mức giá chính thức chưa chốt. Khi chốt, xưởng đang dùng thử được báo trước ít nhất 30 ngày.</div>`;

  return bk+`<div class="c"><div class="dl"><span>Phiên bản</span><b class="num">0.4 · 14/10/2026</b></div>
    <div class="dl"><span>Dữ liệu đặt tại</span><b>Việt Nam</b></div>
    <div class="dl"><span>Hỗ trợ</span><b>0909 112 334</b></div></div>
    <div class="sbox"><button class="srow" data-cm="phapLy">
      <span class="sic">📄</span><span class="st"><b>Điều khoản và Chính sách quyền riêng tư</b>
      <span>Bản đầy đủ · ${PHAP_LY.filter(x=>x[0]==="h3").length} mục</span></span>
      <span class="chev">›</span></button></div>
    <div class="note">IronSpace không dùng dữ liệu của xưởng này để phục vụ xưởng khác.</div>`;
}

    <div class="f" style="margin-top:16px"><label>Giá báo cho khách</label>
